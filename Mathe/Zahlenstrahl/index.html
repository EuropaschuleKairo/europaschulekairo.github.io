<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mein Zahlenstrahl-Wortschatz • Klasse 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper: #fbfcfe;
  --grid: #dbe6f4;
  --margin: #e8a0a0;
  --ink: #1b2f5b;
  --ink-soft: #4b5d82;
  --ink-muted: #7b8ea6;
  --line: #c9d6ea;
  --card: #ffffff;
  --card-2: #f1f5fb;
  --card-hover: #eaf1fa;

  --accent: #2e74b5;
  --accent-ink: #ffffff;
  --marker: #ffe066;
  --marker-ink: #1b2f5b;

  /* Artikel-Farben (Standard DaZ / Grundschule) */
  --der: #2463c9;
  --die: #d13b3b;
  --das: #1d9458;

  /* Stufen-Farben */
  --einfach: #1d9458;
  --einfach-bg: #e3f5ea;
  --mittel: #d97706;
  --mittel-bg: #fef3c7;
  --schwer: #7c3aed;
  --schwer-bg: #f3e8ff;

  --ok: #1d9458;
  --ok-bg: #e3f5ea;
  --bad: #c43838;
  --bad-bg: #fbe6e6;
  --warn: #b86e00;
  --warn-bg: #fff2d6;

  /* Teams */
  --t1: #2463c9; /* Löwen */
  --t2: #1d9458; /* Delphine */
  --t3: #d97706; /* Adler */
  --t4: #c23f7e; /* Füchse */

  --shadow: 0 2px 0 rgba(27,47,91,.1), 0 8px 24px rgba(27,47,91,.06);
  --shadow-lg: 0 6px 0 rgba(27,47,91,.15), 0 14px 32px rgba(27,47,91,.1);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;

  --display: "Lilita One", system-ui, sans-serif;
  --body: "Andika", "Segoe UI", system-ui, sans-serif;
}

:root[data-theme="dark"]{
  color-scheme: dark;
  --paper: #0f172a;
  --grid: #1e293b;
  --margin: #5c2d3a;
  --ink: #f1f5f9;
  --ink-soft: #94a3b8;
  --ink-muted: #64748b;
  --line: #334155;
  --card: #1e293b;
  --card-2: #283548;
  --card-hover: #334155;

  --accent: #38bdf8;
  --accent-ink: #0f172a;
  --marker: #fbbf24;
  --marker-ink: #0f172a;

  --der: #60a5fa;
  --die: #f87171;
  --das: #34d399;

  --einfach: #34d399;
  --einfach-bg: #064e3b;
  --mittel: #fbbf24;
  --mittel-bg: #78350f;
  --schwer: #c084fc;
  --schwer-bg: #581c87;

  --ok: #34d399;
  --ok-bg: #064e3b;
  --bad: #f87171;
  --bad-bg: #450a0a;
  --warn: #fbbf24;
  --warn-bg: #451a03;

  --t1: #60a5fa;
  --t2: #34d399;
  --t3: #fbbf24;
  --t4: #f472b6;

  --shadow: 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.6);
}

*, *::before, *::after{box-sizing:border-box}
body{
  margin:0;
  font-family: var(--body);
  color: var(--ink);
  font-size: 18px;
  line-height: 1.45;
  background-color: var(--paper);
  background-image: 
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}

.wrap{
  max-width: 1240px;
  margin: 0 auto;
  padding: 16px 20px 60px;
}

button{
  font-family: inherit;
  cursor: pointer;
  border: 0;
  background: transparent;
  transition: all 0.15s ease;
}
button:focus-visible{
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* ==========================================================================
   Header & Navigation
   ========================================================================== */
.site-head{
  border-bottom: 2px solid var(--margin);
  padding-bottom: 20px;
  margin-bottom: 24px;
}
.head-top{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}
.brand-group{
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand-badge{
  width: 58px;
  height: 58px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--accent), var(--das));
  color: #fff;
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-size: 28px;
  box-shadow: 0 4px 0 rgba(27,47,91,.15);
  flex-shrink: 0;
}
.brand-titles h1{
  margin: 0;
  font-family: var(--display);
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 400;
  letter-spacing: .5px;
  line-height: 1.1;
  color: var(--ink);
}
.brand-titles h1 span{
  background: linear-gradient(transparent 55%, var(--marker) 55%);
  padding-inline: 4px;
}
.brand-titles p{
  margin: 4px 0 0;
  color: var(--ink-soft);
  font-size: 16px;
}
.top-actions{
  display: flex;
  gap: 8px;
}
.circle-btn{
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 18px;
  box-shadow: 0 2px 0 var(--line);
}
.circle-btn:hover{
  background: var(--card-hover);
  border-color: var(--accent);
}
.hub-link{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  background: var(--card-2);
  border: 2px solid var(--line);
  color: var(--ink-soft);
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
}
.hub-link:hover{
  border-color: var(--accent);
  color: var(--ink);
}

/* Control Pills */
.controls-bar{
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  box-shadow: var(--shadow);
}
.ctl-col{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ctl-label{
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-soft);
}
.pills{
  display: flex;
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-pill);
  padding: 3px;
  gap: 3px;
}
.pill{
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 15px;
  font-weight: 700;
  color: var(--ink-soft);
  white-space: nowrap;
}
.pill:hover{
  color: var(--ink);
}
.pill[aria-pressed="true"]{
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 2px 0 rgba(0,0,0,.15);
}
.pill.level-einfach[aria-pressed="true"]{ background: var(--einfach); }
.pill.level-mittel[aria-pressed="true"]{ background: var(--mittel); }
.pill.level-schwer[aria-pressed="true"]{ background: var(--schwer); }

/* Banner */
.info-banner{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  padding: 10px 18px;
  background: var(--card-2);
  border-left: 5px solid var(--accent);
  border-radius: var(--radius-sm);
  font-size: 15px;
  color: var(--ink-soft);
}
.info-banner b{ color: var(--ink); }

/* ==========================================================================
   Hero: Interaktiver Schau-Zahlenstrahl
   ========================================================================== */
.hero-zahlenstrahl{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  margin-bottom: 28px;
  box-shadow: var(--shadow);
}
.hero-head{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.hero-head h2{
  font-family: var(--display);
  font-size: 24px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.hero-tip{
  font-size: 14px;
  color: var(--ink-soft);
  background: var(--card-2);
  padding: 4px 12px;
  border-radius: var(--radius-pill);
}
.svg-scroll-wrap{
  width: 100%;
  overflow-x: auto;
  padding: 8px 0;
}
.svg-zahlenstrahl{
  min-width: 760px;
  width: 100%;
  display: block;
}
.hero-hotspot{
  cursor: pointer;
  transition: all .15s ease;
}
.hero-hotspot:hover text{
  font-weight: 700;
  fill: var(--accent);
}
.hero-hotspot:hover circle, .hero-hotspot:hover line{
  stroke: var(--accent);
  stroke-width: 4px;
}
.hero-explainer{
  margin-top: 14px;
  background: var(--card-2);
  border: 2px dashed var(--line);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.hero-explainer-text{
  font-size: 16px;
  color: var(--ink);
}
.hero-explainer-text b{
  color: var(--accent);
}

/* ==========================================================================
   Home Activity Cards Grid (Die 3 Kern-Übungen)
   ========================================================================== */
.act-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 22px;
  margin-bottom: 34px;
}
.act-card{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 24px 22px;
  display: flex;
  flex-direction: column;
  text-align: left;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.act-card:hover{
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: var(--shadow-lg);
}
.act-card::before{
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
}
.act-card[data-act="flashcard"]::before{ background: var(--accent); }
.act-card[data-act="matching"]::before{ background: var(--das); }
.act-card[data-act="cloze"]::before{ background: var(--mittel); }

.act-card-top{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.act-card h3{
  margin: 0;
  font-family: var(--display);
  font-size: 26px;
  color: var(--ink);
}
.act-icon-box{
  width: 52px;
  height: 52px;
  border-radius: var(--radius-md);
  background: var(--card-2);
  display: grid;
  place-items: center;
  font-size: 26px;
  flex-shrink: 0;
}
.act-desc{
  margin: 0 0 18px;
  color: var(--ink-soft);
  font-size: 16px;
  flex-grow: 1;
}
.act-card-bottom{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 14px;
  border-top: 2px solid var(--line);
}
.act-tag{
  font-size: 13px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: var(--card-2);
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.start-btn-label{
  font-family: var(--display);
  font-size: 18px;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* ==========================================================================
   In-Game Header Bar & Team-Modus
   ========================================================================== */
.gbar{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  margin-bottom: 22px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 10px;
  z-index: 20;
}
.back-btn{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  box-shadow: 0 2px 0 var(--line);
}
.back-btn:active{ transform: translateY(2px); box-shadow: none; }
.back-btn:hover{ border-color: var(--accent); }

.gbar-title h2{
  margin: 0;
  font-family: var(--display);
  font-size: 24px;
}
.gbar-title p{
  margin: 0;
  font-size: 14px;
  color: var(--ink-soft);
}

.timer-box{
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-2);
  border: 2px solid var(--line);
  padding: 6px 14px;
  border-radius: var(--radius-pill);
}
.timer-val{
  font-family: var(--display);
  font-size: 24px;
  min-width: 3ch;
  text-align: center;
}
.timer-val.urgent{
  color: var(--bad);
  animation: pulseUrgent .8s infinite;
}
@keyframes pulseUrgent{
  0%, 100%{ transform: scale(1); }
  50%{ transform: scale(1.12); }
}
.mini-btn{
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 700;
}

/* Teams Bar */
.teams-bar{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}
.team-chip{
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  box-shadow: var(--shadow);
}
.team-chip.active{
  border-color: var(--tc);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 25%, transparent);
}
.team-title{
  font-weight: 700;
  color: var(--tc);
  font-size: 16px;
}
.team-sc{
  font-family: var(--display);
  font-size: 24px;
  min-width: 2ch;
  text-align: center;
}
.pm-btn{
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 2px solid var(--line);
  background: var(--card-2);
  font-family: var(--display);
  font-size: 18px;
  display: grid;
  place-items: center;
}
.pm-btn:hover{
  background: var(--tc);
  color: #fff;
  border-color: var(--tc);
}

.solo-bar{
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 10px 18px;
  margin-bottom: 20px;
  font-size: 16px;
}
.solo-bar b{
  font-family: var(--display);
  font-size: 20px;
  color: var(--accent);
}

/* ==========================================================================
   Activity 1: Flashcards (Karteikarten)
   ========================================================================== */
.flash-wrap{
  perspective: 1200px;
  min-height: 420px;
  margin-bottom: 24px;
}
.flash-card{
  position: relative;
  width: 100%;
  min-height: 420px;
  text-align: center;
  transition: transform .6s cubic-bezier(.4,0,.2,1);
  transform-style: preserve-3d;
  cursor: pointer;
}
.flash-card.flipped{
  transform: rotateY(180deg);
}
.flash-face{
  position: absolute;
  inset: 0;
  min-height: 420px;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  border-radius: var(--radius-lg);
  padding: 34px 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: var(--card);
  border: 3px solid var(--line);
  box-shadow: var(--shadow-lg);
  box-sizing: border-box;
}
.flash-card:not(.flipped) .flash-back {
  visibility: hidden;
  pointer-events: none;
}
.flash-card.flipped .flash-front {
  visibility: hidden;
  pointer-events: none;
}
.flash-prompt{
  font-size: 17px;
  color: var(--ink-soft);
  max-width: 520px;
  margin: 16px 0 18px;
  padding: 10px 16px;
  background: var(--card-2);
  border: 1px dashed var(--line);
  border-radius: var(--radius-md);
  font-style: italic;
}
.flash-back{
  transform: rotateY(180deg);
  background: var(--card-2);
  border-color: var(--accent);
}
.art-chip{
  font-family: var(--display);
  font-size: 18px;
  padding: 3px 12px;
  border-radius: var(--radius-pill);
  margin-bottom: 8px;
}
.art-chip.der{ background: rgba(36,99,201,.15); color: var(--der); border: 2px solid var(--der); }
.art-chip.die{ background: rgba(209,59,59,.15); color: var(--die); border: 2px solid var(--die); }
.art-chip.das{ background: rgba(29,148,88,.15); color: var(--das); border: 2px solid var(--das); }
.art-chip.verb{ background: rgba(124,58,237,.15); color: #7c3aed; border: 2px solid #7c3aed; }
.art-chip.adj{ background: rgba(217,119,6,.15); color: var(--mittel); border: 2px solid var(--mittel); }

.flash-word{
  font-family: var(--display);
  font-size: clamp(34px, 5vw, 54px);
  margin-bottom: 6px;
  line-height: 1.15;
}
.flash-plural{
  font-size: 16px;
  color: var(--ink-soft);
  margin-bottom: 16px;
}
.flash-symbol{
  font-family: var(--display);
  font-size: 22px;
  background: var(--card-2);
  padding: 8px 18px;
  border-radius: var(--radius-md);
  border: 2px dashed var(--line);
  color: var(--accent);
  margin-bottom: 20px;
}
.speak-btn{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-pill);
  padding: 6px 14px;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  box-shadow: 0 2px 0 var(--line);
}
.speak-btn:hover{
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.flash-hint{
  position: absolute;
  bottom: 16px;
  font-size: 14px;
  color: var(--ink-muted);
}
.flash-def{
  font-size: clamp(19px, 2.5vw, 26px);
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 16px;
  max-width: 38ch;
  line-height: 1.4;
}
.flash-ex{
  font-size: 17px;
  background: var(--card);
  padding: 12px 18px;
  border-radius: var(--radius-md);
  border-left: 5px solid var(--das);
  margin-bottom: 14px;
  max-width: 90%;
  text-align: left;
}
.flash-tip{
  font-size: 15px;
  background: var(--marker);
  color: var(--marker-ink);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-weight: 700;
}

.act-btns{
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  align-items: center;
  margin-top: 20px;
}
.btn{
  border: 2px solid var(--line);
  background: var(--card);
  border-radius: var(--radius-md);
  padding: 12px 22px;
  font-family: var(--display);
  font-size: 19px;
  box-shadow: 0 3px 0 var(--line);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:active{ transform: translateY(2px); box-shadow: none; }
.btn.primary{ background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.btn.success{ background: var(--das); color: #fff; border-color: var(--das); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.btn.warn{ background: var(--mittel); color: #fff; border-color: var(--mittel); box-shadow: 0 3px 0 rgba(0,0,0,.2); }

/* ==========================================================================
   Activity 2: Matching Activity (Paare finden)
   ========================================================================== */
.matching-board{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
  margin: 20px 0;
}
.match-card{
  min-height: 120px;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all .15s ease;
  user-select: none;
}
.match-card:hover:not(.matched){
  transform: translateY(-2px);
  border-color: var(--accent);
}
.match-card.word-card{
  background: #fdfdf9;
  border-color: #cbd5e1;
}
.match-card.def-card{
  background: #f8fafc;
  font-size: 16px;
  line-height: 1.35;

      osc.frequency.setValueAtTime(440, now); // A4
      osc.frequency.exponentialRampToValueAtTime(554.37, now + 0.1); // C#5
      osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.22); // E5
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if(type === 'wrong'){
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.linearRampToValueAtTime(170, now + 0.25);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if(type === 'click'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if(type === 'fanfare'){
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + idx * 0.12);
        g.gain.setValueAtTime(0.2, now + idx * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
        o.start(now + idx * 0.12);
        o.stop(now + idx * 0.12 + 0.35);
      });
    }
  } catch(e) {}
}

// Deutsche Sprachausgabe (Web Speech API)
function speakGerman(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function filterVocabByLevel(level){
  if(!level || level === 'all') return DATA.vocab;
  return DATA.vocab.filter(v => v.level === level);
}

  } else if(S.view === "flashcard"){
    renderFlashcardView(app);
  } else if(S.view === "matching"){

}

function renderLexikonGrid(){
  return `

function renderLexikonCards(){
  const q = S.lexikonSearch;
  const filtered = DATA.vocab.filter(v => {
    if(!q) return true;
    return v.word.toLowerCase().includes(q) ||
           v.def.toLowerCase().includes(q) ||
           v.example.toLowerCase().includes(q);
  });

  if(filtered.length === 0){
    return `<div style="grid-column:1/-1; text-align:center; padding:20px; color:var(--ink-soft);">Kein Begriff gefunden für "${q}".</div>`;
  }

  return filtered.map(v => `
    <div class="lex-card">
      <div class="lex-card-top">
        <span class="art-chip ${getArticleClass(v.article)}">${v.article}</span>
        <span class="act-tag" style="font-size:11px;">${v.levelLabel}</span>
      </div>
      <div class="lex-word">${v.word}</div>
      <div style="font-size:13px; color:var(--ink-soft);">${v.plural}</div>
      <div class="lex-def">${v.def}</div>
      <div class="lex-ex">„${v.example}“</div>
      <button class="speak-btn" style="align-self:flex-start; margin-top:auto;" onclick="speakGerman('${v.article} ${v.word}')">🔊 Vorlesen</button>
    </div>
  `).join("");
}

function getArticleClass(art){
  if(art === 'der') return 'der';
  if(art === 'die') return 'die';
  if(art === 'das') return 'das';
  if(art.includes('Verb')) return 'verb';
  return 'adj';
}

function initMatching(){
  const pool = filterVocabByLevel(S.level);
  let pairCount = 6;
  if(S.level === 'einfach') pairCount = 4;
  else if(S.level === 'schwer') pairCount = 8;

  const chosen = shuffle(pool).slice(0, Math.min(pairCount, pool.length));

  const cards = [];
  chosen.forEach(item => {
    cards.push({
      id: item.id + '_word',
      pairId: item.id,
      type: 'word',
      text: `${item.article} ${item.word}`,
      symbol: item.symbol
    });
    cards.push({
      id: item.id + '_def',
      pairId: item.id,
      type: 'def',
      text: item.matchingShort || item.def,
      symbol: ''
    });
  });

  S.matching.pairs = shuffle(cards);
  S.matching.selectedCard = null;
  S.matching.matchedCount = 0;
  S.matching.moves = 0;
  S.matching.finished = false;
  S.matching.startTime = Date.now();
}

function renderMatchingView(app){
  const totalPairs = S.matching.pairs.length / 2;
  const isFinished = S.matching.matchedCount >= totalPairs;

  app.innerHTML = `
    <header class="gbar">
      <button class="back-btn" id="exit-btn">← Zur Übersicht</button>
      <div class="gbar-title">
        <h2>🧩 Paare finden • Begriffs-Zuordnung</h2>
        <p>Finde passende Paare: Fachwort ➔ Erklärung • Stufe: <b>${S.level.toUpperCase()}</b></p>
      </div>
      <div>
        <button class="btn" id="match-restart-btn">🔄 Neue Paare</button>
      </div>
    </header>

    ${S.mode === 'team' ? renderTeamsBar() : renderSoloBar()}

    <main>
      <div class="match-stats">
        <div>Gefundene Paare: <b>${S.matching.matchedCount} / ${totalPairs}</b></div>
        <div>Züge: <b>${S.matching.moves}</b></div>
        <div>Stufe: <b>${S.level.toUpperCase()}</b></div>
      </div>

      ${!isFinished ? `
        <div class="matching-board">
          ${S.matching.pairs.map(card => {
            const isSelected = S.matching.selectedCard && S.matching.selectedCard.id === card.id;
            const isMatched = card.matched;
            return `
              <div class="match-card ${card.type === 'word' ? 'word-card' : 'def-card'} ${isSelected ? 'selected' : ''} ${isMatched ? 'matched' : ''}" 
                   data-cid="${card.id}" 
                   onclick="handleMatchCardClick('${card.id}')">
                ${card.type === 'word' ? `
                  <div style="font-family:var(--display); font-size:22px; color:var(--ink);">${card.text}</div>
                  ${card.symbol ? `<div style="font-size:14px; color:var(--accent); margin-top:4px;">${card.symbol}</div>` : ''}
                ` : `
                  <div style="color:var(--ink-soft); font-weight:600;">${card.text}</div>
                `}
              </div>
            `;
          }).join("")}
        </div>
      ` : `
        <div style="text-align:center; background:var(--card); border:3px solid var(--ok); border-radius:var(--radius-lg); padding:40px 24px; box-shadow:var(--shadow-lg);">
          <div style="font-size:64px; margin-bottom:10px;">🎉 ⭐⭐⭐</div>
          <h2 style="font-family:var(--display); font-size:36px; color:var(--ok); margin:0 0 10px;">Klasse gemacht! Alle Paare gefunden!</h2>
          <p style="font-size:18px; color:var(--ink-soft); margin-bottom:24px;">Du hast alle ${totalPairs} Paare in <b>${S.matching.moves} Zügen</b> gelöst.</p>
          <div class="act-btns">
            <button class="btn success" onclick="initMatching(); render();">Nochmal mit neuen Paaren spielen 🔄</button>
            <button class="btn" onclick="S.view='home'; render();">Zurück zur Hauptseite</button>
          </div>
        </div>
      `}
    </main>
  `;

  document.getElementById('exit-btn').onclick = () => { S.view = 'home'; playSfx('click'); render(); };
  document.getElementById('match-restart-btn').onclick = () => { initMatching(); playSfx('click'); render(); };
}

function handleMatchCardClick(cid){
  const card = S.matching.pairs.find(c => c.id === cid);
  if(!card || card.matched) return;

  if(!S.matching.selectedCard){
    // Erste Karte ausgewählt
    S.matching.selectedCard = card;
    playSfx('click');
    render();
  } else {
    if(S.matching.selectedCard.id === card.id) return; // gleiche Karte

    S.matching.moves++;
    const first = S.matching.selectedCard;

    if(first.pairId === card.pairId && first.type !== card.type){
      // Treffer!
      first.matched = true;
      card.matched = true;
      S.matching.matchedCount++;
      S.matching.selectedCard = null;
      awardPoints(1);
      playSfx('correct');

      const totalPairs = S.matching.pairs.length / 2;
      if(S.matching.matchedCount >= totalPairs){
        setTimeout(() => { playSfx('fanfare'); }, 300);
      }
      render();
    } else {
      // Falsches Paar
      playSfx('wrong');
      const el1 = document.querySelector(`[data-cid="${first.id}"]`);
      const el2 = document.querySelector(`[data-cid="${card.id}"]`);
      if(el1) el1.classList.add('wrong');
      if(el2) el2.classList.add('wrong');

      setTimeout(() => {
        S.matching.selectedCard = null;
        rotateTurn();
        render();
      }, 700);
    }
  }
}

// --------------------------------------------------------------------------
// 3. LÜCKENTEXT ACTIVITY
// --------------------------------------------------------------------------
function initCloze(){
  S.cloze.selectedBlankId = null;
  S.cloze.userAnswers = {};
  S.cloze.checked = false;
  S.cloze.singleIdx = 0;
}

function renderClozeView(app){
  let clozeStories = DATA.cloze;
  if(S.level !== 'all'){
    const filtered = DATA.cloze.filter(c => c.level === S.level);
    if(filtered.length > 0) clozeStories = filtered;
  }
  const story = clozeStories[S.cloze.activeStoryIdx % clozeStories.length];

  app.innerHTML = `
    <header class="gbar">
      <button class="back-btn" id="exit-btn">← Zur Übersicht</button>
      <div class="gbar-title">
        <h2>✍️ Lückentext-Training</h2>
        <p>${story.title} • Stufe: <b>${story.level.toUpperCase()}</b></p>
      </div>
      <div>
        <button class="btn" id="cloze-switch-btn" title="Anderen Text wählen">📖 Nächster Text (${(S.cloze.activeStoryIdx % clozeStories.length) + 1}/${clozeStories.length})</button>
      </div>
    </header>

    ${S.mode === 'team' ? renderTeamsBar() : renderSoloBar()}

    <main style="max-width:860px; margin:0 auto;">
      <div class="cloze-box">
        <div class="cloze-head">
          <div class="cloze-title">${story.title}</div>
          <span class="act-tag" style="background:${story.level === 'einfach' ? 'var(--einfach-bg)' : story.level === 'mittel' ? 'var(--mittel-bg)' : 'var(--schwer-bg)'}; color:${story.level === 'einfach' ? 'var(--einfach)' : story.level === 'mittel' ? 'var(--mittel)' : 'var(--schwer)'}">
            ${story.level.toUpperCase()}
          </span>
        </div>

        ${story.type === 'single' ? renderSingleCloze(story) : renderStoryCloze(story)}
      </div>
    </main>
  `;

  document.getElementById('exit-btn').onclick = () => { S.view = 'home'; playSfx('click'); render(); };
  document.getElementById('cloze-switch-btn').onclick = () => {
    S.cloze.activeStoryIdx++;
    initCloze();
    playSfx('click');
    render();
  };
}

// Level Einfach: Einzelsätze mit Klickchips
function renderSingleCloze(story){
  const item = story.items[S.cloze.singleIdx % story.items.length];
  const parts = item.sentence.split('[' + item.answer + ']');
  const isChecked = S.cloze.checked;
  const userAns = S.cloze.userAnswers[S.cloze.singleIdx];

  return `
    <div style="font-size:24px; line-height:1.7; margin-bottom:24px;">
      Satz ${ (S.cloze.singleIdx % story.items.length) + 1 } von ${ story.items.length }:
      <div style="background:var(--card-2); padding:20px; border-radius:var(--radius-md); border-left:5px solid var(--accent); margin-top:10px;">
        ${parts[0]} <span class="cloze-blank filled ${isChecked ? (userAns === item.answer ? 'correct' : 'incorrect') : ''}">${userAns || '__________'}</span> ${parts[1]}
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <div style="font-size:14px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;">Wähle das passende Wort:</div>
      <div class="single-options">
        ${shuffle(item.options).map(opt => {
          let cls = "";
          if(isChecked){
            if(opt === item.answer) cls = "correct";
            else if(opt === userAns) cls = "wrong";
          }
          return `
            <button class="single-opt-btn ${cls}" onclick="handleSingleClozeChoice('${opt}', '${item.answer}')" ${isChecked ? 'disabled' : ''}>
              ${opt}
            </button>
          `;
        }).join("")}
      </div>
    </div>

    ${isChecked ? `
      <div class="act-btns">
        <button class="btn primary" onclick="nextSingleCloze(${story.items.length})">Nächster Satz →</button>
      </div>
    ` : ''}
  `;
}

function handleSingleClozeChoice(chosen, answer){
  S.cloze.userAnswers[S.cloze.singleIdx] = chosen;
  S.cloze.checked = true;
  const isCorrect = chosen === answer;

  if(isCorrect){
    playSfx('correct');
    awardPoints(1);
    S.soloStats.correct++;
    S.soloStats.total++;
    S.soloStats.streak++;
  } else {
    playSfx('wrong');
    S.soloStats.total++;
    S.soloStats.streak = 0;
  }
  render();
}

function nextSingleCloze(total){
  S.cloze.singleIdx = (S.cloze.singleIdx + 1) % total;
  S.cloze.checked = false;
  rotateTurn();
  render();
}

// Level Mittel & Schwer: Zusammenhängender Text mit Wortbank
function renderStoryCloze(story){
  let text = story.storyText;
  const isChecked = S.cloze.checked;

  story.blanks.forEach((b, i) => {
    const val = S.cloze.userAnswers[i] || '';
    const isSelected = S.cloze.selectedBlankId === i;
    let cls = val ? 'filled' : '';
    if(isChecked){
      cls += (val.trim().toLowerCase() === b.trim().toLowerCase() ? ' correct' : ' incorrect');
    }
    const span = `<span class="cloze-blank ${cls} ${isSelected ? 'selected' : ''}" onclick="selectBlank(${i})">${val || `(${i+1}) _____`}</span>`;
    text = text.replace('[' + b + ']', span);
  });

  return `
    <div class="cloze-text-area">
      ${text}
    </div>

    <div class="word-bank-box">
      <div class="word-bank-title">🗃️ Wortspeicher (Klicke zuerst auf eine Lücke, dann auf das Wort):</div>
      <div class="word-bank-chips">
        ${shuffle(story.wordBank).map(word => {
          const isUsed = Object.values(S.cloze.userAnswers).includes(word);
          return `
            <button class="bank-chip ${isUsed ? 'used' : ''}" onclick="insertWordIntoBlank('${word}')">
              ${word}
            </button>
          `;
        }).join("")}
      </div>
    </div>

    <div class="act-btns">
      ${!isChecked ? `
        <button class="btn success" onclick="checkStoryCloze()">Lücken überprüfen ✓</button>
        <button class="btn" onclick="initCloze(); render();">Zurücksetzen ↺</button>
      ` : `
        <button class="btn primary" onclick="initCloze(); render();">Nochmal versuchen 🔄</button>
        <button class="btn" onclick="S.cloze.activeStoryIdx++; initCloze(); render();">Nächster Text →</button>
      `}
    </div>
  `;
}

function selectBlank(idx){
  S.cloze.selectedBlankId = idx;
  playSfx('click');
  render();
}

function insertWordIntoBlank(word){
  if(S.cloze.selectedBlankId === null){
    // Finde erste freie Lücke
    const freeIdx = [0,1,2,3,4,5,6].find(i => !S.cloze.userAnswers[i]);
    if(freeIdx !== undefined) S.cloze.selectedBlankId = freeIdx;
    else S.cloze.selectedBlankId = 0;
  }
  S.cloze.userAnswers[S.cloze.selectedBlankId] = word;
  S.cloze.selectedBlankId = null;
  playSfx('click');
  render();
}

function checkStoryCloze(){
  S.cloze.checked = true;
  let correctCount = 0;
  let story = DATA.cloze[S.cloze.activeStoryIdx % DATA.cloze.length];

  story.blanks.forEach((b, i) => {
    const val = (S.cloze.userAnswers[i] || '').trim().toLowerCase();
    if(val === b.trim().toLowerCase()) correctCount++;
  });

  if(correctCount === story.blanks.length){
    playSfx('fanfare');
    awardPoints(correctCount);
  } else if(correctCount > 0){
    playSfx('correct');
    awardPoints(correctCount);
  } else {
    playSfx('wrong');
  }
  render();
}

// --------------------------------------------------------------------------
// TEAMS & SCORING
// --------------------------------------------------------------------------
function renderTeamsBar(){
  return `
    <div class="teams-bar">
      ${S.teams.slice(0, S.numTeams).map((t, i) => `
        <div class="team-chip ${i === S.activeTeamIdx ? 'active' : ''}" style="--tc:${t.color}">
          <button class="team-title" onclick="setActiveTeam(${i})">${t.name}</button>
          <div class="team-sc" id="tsc-${i}">${t.score}</div>
          <button class="pm-btn" onclick="adjustScore(${i}, 1)">+</button>
          <button class="pm-btn" onclick="adjustScore(${i}, -1)">−</button>
        </div>
      `).join("")}
      <div style="font-size:13px; color:var(--ink-soft); align-self:center; margin-left:auto;">
        👉 Klicke ein Team an, um die Punkte zu vergeben
      </div>
    </div>
  `;
}

function renderSoloBar(){
  return `
    <div class="solo-bar">
      <div>Punkte: <b>${S.soloStats.correct}</b></div>
      <div>Fragen gesamt: <b>${S.soloStats.total}</b></div>
      <div>Serie: <b>${S.soloStats.streak} 🔥</b></div>
    </div>
  `;
}

function setActiveTeam(idx){
  S.activeTeamIdx = idx;
  playSfx('click');
  render();
}

function adjustScore(idx, delta){
  S.teams[idx].score = Math.max(0, S.teams[idx].score + delta);
  if(delta > 0) playSfx('correct');
  const el = document.getElementById('tsc-' + idx);
  if(el) el.textContent = S.teams[idx].score;
}

function awardPoints(pts){
  if(S.mode === 'team'){
    adjustScore(S.activeTeamIdx, pts);
  }
}

function rotateTurn(){
  if(S.mode === 'team' && S.numTeams > 1){
    S.activeTeamIdx = (S.activeTeamIdx + 1) % S.numTeams;
  }
}

// --------------------------------------------------------------------------
// TIMER
// --------------------------------------------------------------------------
function resetTimer(){
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  S.timerRemaining = S.timerSetting;
}

// --------------------------------------------------------------------------
// THEME & SOUND
// --------------------------------------------------------------------------
function toggleTheme(){
  S.theme = S.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', S.theme);
  playSfx('click');
  render();
}

function toggleSound(){
  S.sound = !S.sound;
  render();
}

// Keyboard listener (Leertaste für Flashcard)
window.addEventListener('keydown', (e) => {
  if(e.code === 'Space' && S.view === 'flashcard' && e.target.tagName !== 'INPUT'){
    e.preventDefault();
    const fc = document.getElementById('flash-card');
    if(fc) fc.click();
  }
});

// Boot
document.documentElement.setAttribute('data-theme', S.theme);
render();
</script>
</body>
</html>
