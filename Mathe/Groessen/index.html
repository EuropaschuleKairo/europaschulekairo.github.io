<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mein Größen-Wortschatz • Schätzen &amp; Umrechnen • Klasse 5</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper: #fbfcfe;
  --grid: #dbe6f4;
  --margin: #e8a0a0;
  --ink: #1b2f5b;
  --ink-soft: #4b5d82;
  --ink-muted: #7b8ea6;
  --line: #c9d6ea;
  --card: #ffffff;
  --card-2: #f1f5fb;
  --card-hover: #eaf1fa;

  --accent: #0284c7;
  --accent-ink: #ffffff;
  --marker: #fde047;
  --marker-ink: #1b2f5b;

  /* Artikel-Farben (Standard DaZ / Grundschule & Sek I) */
  --der: #2563eb;
  --die: #dc2626;
  --das: #16a34a;
  --verb: #7c3aed;
  --adj: #ea580c;

  /* Stufen-Farben */
  --einfach: #16a34a;
  --einfach-bg: #dcfce7;
  --mittel: #d97706;
  --mittel-bg: #fef3c7;
  --schwer: #7c3aed;
  --schwer-bg: #f3e8ff;

  --ok: #16a34a;
  --ok-bg: #dcfce7;
  --bad: #dc2626;
  --bad-bg: #fee2e2;
  --warn: #d97706;
  --warn-bg: #fef3c7;

  /* Teams */
  --t1: #2563eb; /* Löwen */
  --t2: #16a34a; /* Delphine */
  --t3: #d97706; /* Adler */
  --t4: #db2777; /* Füchse */

  --shadow: 0 2px 0 rgba(27,47,91,.1), 0 8px 24px rgba(27,47,91,.06);
  --shadow-lg: 0 6px 0 rgba(27,47,91,.15), 0 14px 32px rgba(27,47,91,.1);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;

  --display: "Lilita One", system-ui, sans-serif;
  --body: "Andika", "Segoe UI", system-ui, sans-serif;
}

:root[data-theme="dark"]{
  color-scheme: dark;
  --paper: #0f172a;
  --grid: #1e293b;
  --margin: #5c2d3a;
  --ink: #f1f5f9;
  --ink-soft: #94a3b8;
  --ink-muted: #64748b;
  --line: #334155;
  --card: #1e293b;
  --card-2: #283548;
  --card-hover: #334155;

  --accent: #38bdf8;
  --accent-ink: #0f172a;
  --marker: #fbbf24;
  --marker-ink: #0f172a;

  --der: #60a5fa;
  --die: #f87171;
  --das: #34d399;
  --verb: #c084fc;
  --adj: #fb923c;

  --einfach: #34d399;
  --einfach-bg: #064e3b;
  --mittel: #fbbf24;
  --mittel-bg: #78350f;
  --schwer: #c084fc;
  --schwer-bg: #581c87;

  --ok: #34d399;
  --ok-bg: #064e3b;
  --bad: #f87171;
  --bad-bg: #450a0a;
  --warn: #fbbf24;
  --warn-bg: #451a03;

  --t1: #60a5fa;
  --t2: #34d399;
  --t3: #fbbf24;
  --t4: #f472b6;

  --shadow: 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.6);
}

*, *::before, *::after{box-sizing:border-box}
body{
  margin:0;
  font-family: var(--body);
  color: var(--ink);
  font-size: 18px;
  line-height: 1.45;
  background-color: var(--paper);
  background-image: 
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}

.wrap{
  max-width: 1240px;
  margin: 0 auto;
  padding: 16px 20px 60px;
}

button{
  font-family: inherit;
  cursor: pointer;
  border: 0;
  background: transparent;
  transition: all 0.15s ease;
}
button:focus-visible{
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* Header */
.site-head{
  border-bottom: 2px solid var(--margin);
  padding-bottom: 20px;
  margin-bottom: 24px;
}
.head-top{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}
.brand-group{
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand-badge{
  width: 58px;
  height: 58px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, #0284c7, #16a34a);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-size: 26px;
  box-shadow: 0 4px 0 rgba(27,47,91,.15);
  flex-shrink: 0;
}
.brand-titles h1{
  margin: 0;
  font-family: var(--display);
  font-size: clamp(26px, 4vw, 42px);
  font-weight: 400;
  letter-spacing: .5px;
  line-height: 1.15;
  color: var(--ink);
}
.brand-titles h1 span{
  background: linear-gradient(transparent 55%, var(--marker) 55%);
  padding-inline: 4px;
}
.brand-titles p{
  margin: 4px 0 0;
  color: var(--ink-soft);
  font-size: 16px;
}
.top-actions{
  display: flex;
  align-items: center;
  gap: 8px;
}
.circle-btn{
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 18px;
  box-shadow: 0 2px 0 var(--line);
}
.circle-btn:hover{
  background: var(--card-hover);
  border-color: var(--accent);
}
.hub-link{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  background: var(--card-2);
  border: 2px solid var(--line);
  color: var(--ink-soft);
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
}
.hub-link:hover{
  border-color: var(--accent);
  color: var(--ink);
}

/* Controls Bar */
.controls-bar{
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  box-shadow: var(--shadow);
}
.ctl-col{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ctl-label{
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-soft);
}
.pills{
  display: flex;
  flex-wrap: wrap;
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-pill);
  padding: 3px;
  gap: 3px;
}
.pill{
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-soft);
  white-space: nowrap;
}
.pill:hover{
  color: var(--ink);
}
.pill[aria-pressed="true"]{
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 2px 0 rgba(0,0,0,.15);
}
.pill.level-einfach[aria-pressed="true"]{ background: var(--einfach); }
.pill.level-mittel[aria-pressed="true"]{ background: var(--mittel); }
.pill.level-schwer[aria-pressed="true"]{ background: var(--schwer); }

.info-banner{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  padding: 10px 18px;
  background: var(--card-2);
  border-left: 5px solid var(--accent);
  border-radius: var(--radius-sm);
  font-size: 15px;
  color: var(--ink-soft);
}
.info-banner b{ color: var(--ink); }

/* HERO: Interaktives Größen-Labor */
.hero-labor{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  margin-bottom: 30px;
  box-shadow: var(--shadow);
}
.hero-head{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.hero-head h2{
  margin: 0;
  font-family: var(--display);
  font-size: 24px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
.hero-tab-btns{
  display: flex;
  gap: 8px;
}
.tab-btn{
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  font-weight: 700;
  font-size: 14px;
  background: var(--card-2);
  border: 2px solid var(--line);
  color: var(--ink-soft);
}
.tab-btn.active{
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.benchmarks-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.bench-card{
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 12px;
  text-align: center;
  cursor: pointer;
  transition: all .15s ease;
}
.bench-card:hover{
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.bench-card.active{
  border-color: var(--accent);
  background: var(--card);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
}
.bench-icon{
  font-size: 32px;
  margin-bottom: 6px;
}
.bench-val{
  font-family: var(--display);
  font-size: 22px;
  color: var(--accent);
  line-height: 1.1;
}
.bench-name{
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
  margin-top: 4px;
}
.bench-sub{
  font-size: 12px;
  color: var(--ink-soft);
}

.hero-explainer{
  background: var(--card-2);
  border: 2px dashed var(--line);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.hero-expl-text{
  font-size: 16px;
  color: var(--ink);
  flex: 1 1 300px;
}
.hero-expl-text b{ color: var(--accent); }

/* Umrechnungs-Treppe Widget */
.treppe-wrap{
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.unit-cat-pills{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.unit-flow-box{
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px;
  overflow-x: auto;
}
.unit-flow-row{
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 600px;
  gap: 12px;
}
.unit-node{
  background: var(--card);
  border: 3px solid var(--accent);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  text-align: center;
  min-width: 90px;
  box-shadow: var(--shadow);
}
.unit-node-sym{
  font-family: var(--display);
  font-size: 26px;
  color: var(--accent);
}
.unit-node-name{
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
}
.unit-arrow-box{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.arrow-factor{
  font-family: var(--display);
  font-size: 13px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}
.factor-mul{
  background: #dcfce7;
  color: #16a34a;
}
.factor-div{
  background: #fee2e2;
  color: #dc2626;
}
.arrow-sym{
  font-size: 18px;
  color: var(--ink-soft);
}

.converter-tool{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 18px;
}
.conv-input{
  font-family: var(--display);
  font-size: 22px;
  padding: 8px 12px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  width: 140px;
  background: var(--paper);
  color: var(--ink);
}
.conv-select{
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  padding: 8px 12px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
}
.conv-res-strip{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  flex: 1 1 300px;
}
.conv-res-chip{
  background: var(--card-2);
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  font-size: 15px;
}
.conv-res-chip b{
  font-family: var(--display);
  color: var(--accent);
}

/* 4 Kern-Aktivitäten Cards Grid */
.act-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 20px;
  margin-bottom: 34px;
}
.act-card{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  text-align: left;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  transition: transform .18s, border-color .18s, box-shadow .18s;
  cursor: pointer;
}
.act-card:hover{
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: var(--shadow-lg);
}
.act-card::before{
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
}
.act-card[data-act="flashcard"]::before{ background: var(--accent); }
.act-card[data-act="matching"]::before{ background: var(--das); }
.act-card[data-act="cloze"]::before{ background: var(--mittel); }
.act-card[data-act="quiz"]::before{ background: var(--verb); }

.act-card-top{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.act-card h3{
  margin: 0;
  font-family: var(--display);
  font-size: 24px;
  color: var(--ink);
}
.act-icon-box{
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  background: var(--card-2);
  display: grid;
  place-items: center;
  font-size: 24px;
  flex-shrink: 0;
}
.act-desc{
  margin: 0 0 16px;
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 1.4;
  flex-grow: 1;
}
.act-card-bottom{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 12px;
  border-top: 2px solid var(--line);
}
.act-tag{
  font-size: 13px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: var(--card-2);
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.start-btn-label{
  font-family: var(--display);
  font-size: 17px;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* In-Game Header & Controls */
.gbar{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  margin-bottom: 22px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 10px;
  z-index: 20;
}
.back-btn{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  box-shadow: 0 2px 0 var(--line);
}
.back-btn:active{ transform: translateY(2px); box-shadow: none; }
.back-btn:hover{ border-color: var(--accent); }

.gbar-title h2{
  margin: 0;
  font-family: var(--display);
  font-size: 24px;
}
.gbar-title p{
  margin: 0;
  font-size: 14px;
  color: var(--ink-soft);
}

.timer-box{
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-2);
  border: 2px solid var(--line);
  padding: 6px 14px;
  border-radius: var(--radius-pill);
}
.timer-val{
  font-family: var(--display);
  font-size: 22px;
  min-width: 3ch;
  text-align: center;
}
.timer-val.urgent{
  color: var(--bad);
  animation: pulseUrgent .8s infinite;
}
@keyframes pulseUrgent{
  0%, 100%{ transform: scale(1); }
  50%{ transform: scale(1.12); }
}

/* Teams Bar */
.teams-bar{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}
.team-chip{
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  box-shadow: var(--shadow);
}
.team-chip.active{
  border-color: var(--tc);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 25%, transparent);
}
.team-title{
  font-weight: 700;
  color: var(--tc);
  font-size: 16px;
}
.team-sc{
  font-family: var(--display);
  font-size: 24px;
  min-width: 2ch;
  text-align: center;
}
.pm-btn{
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 2px solid var(--line);
  background: var(--card-2);
  font-family: var(--display);
  font-size: 18px;
  display: grid;
  place-items: center;
}
.pm-btn:hover{
  background: var(--tc);
  color: #fff;
  border-color: var(--tc);
}

.solo-bar{
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 10px 18px;
  margin-bottom: 20px;
  font-size: 16px;
}
.solo-bar b{
  font-family: var(--display);
  font-size: 20px;
  color: var(--accent);
}

/* Activity 1: Flashcards */
.flash-wrap{
  perspective: 1200px;
  min-height: 420px;
  margin-bottom: 24px;
}
.flash-card{
  width: 100%;
  min-height: 420px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.2,.85,.4,1.1);
  cursor: pointer;
}
.flash-card.flipped{
  transform: rotateY(180deg);
}
.flash-face{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-height: 420px;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  padding: 34px 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border-radius: var(--radius-lg);
  background: var(--card);
  border: 3px solid var(--line);
  box-shadow: var(--shadow-lg);
  box-sizing: border-box;
}
.flash-card:not(.flipped) .flash-back {
  visibility: hidden;
  pointer-events: none;
}
.flash-card.flipped .flash-front {
  visibility: hidden;
  pointer-events: none;
}
.flash-back{
  transform: rotateY(180deg);
  background: var(--card-2);
  border-color: var(--accent);
}
.flash-prompt{
  font-size: 17px;
  color: var(--ink-soft);
  max-width: 520px;
  margin: 16px 0 18px;
  padding: 10px 16px;
  background: var(--card-2);
  border: 1px dashed var(--line);
  border-radius: var(--radius-md);
  font-style: italic;
}
.flash-word{
  font-family: var(--display);
  font-size: clamp(34px, 5vw, 50px);
  color: var(--ink);
  line-height: 1.1;
  margin: 12px 0 6px;
}
.flash-plural{
  font-size: 18px;
  color: var(--ink-soft);
  font-weight: 600;
  margin-bottom: 16px;
}
.flash-symbol{
  font-size: 26px;
  color: var(--accent);
  margin-bottom: 20px;
}
.flash-def{
  font-size: 21px;
  color: var(--ink);
  line-height: 1.5;
  margin-bottom: 14px;
}
.flash-ex{
  font-size: 16px;
  color: var(--ink-soft);
  font-style: italic;
  margin-bottom: 12px;
}
.flash-tip{
  background: var(--mittel-bg);
  color: var(--ink);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 15px;
  margin-top: 10px;
  max-width: 600px;
}

.art-chip{
  display: inline-block;
  padding: 4px 14px;
  border-radius: var(--radius-pill);
  font-size: 15px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 8px;
}
.art-chip.der{ background: #dbeafe; color: var(--der); border: 2px solid var(--der); }
.art-chip.die{ background: #fee2e2; color: var(--die); border: 2px solid var(--die); }
.art-chip.das{ background: #dcfce7; color: var(--das); border: 2px solid var(--das); }
.art-chip.verb{ background: #f3e8ff; color: var(--verb); border: 2px solid var(--verb); }
.art-chip.adj{ background: #ffedd5; color: var(--adj); border: 2px solid var(--adj); }

.act-btns{
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 20px;
}
.btn{
  font-family: var(--display);
  font-size: 17px;
  padding: 12px 24px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 3px 0 var(--line);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:hover{
  border-color: var(--accent);
  background: var(--card-hover);
}
.btn:active{
  transform: translateY(2px);
  box-shadow: none;
}
.btn.primary{
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 3px 0 rgba(0,0,0,.2);
}
.btn.success{
  background: var(--ok);
  color: #fff;
  border-color: var(--ok);
  box-shadow: 0 3px 0 rgba(0,0,0,.2);
}
.btn.warn{
  background: var(--warn);
  color: #fff;
  border-color: var(--warn);
  box-shadow: 0 3px 0 rgba(0,0,0,.2);
}

.speak-btn{
  background: var(--card-2);
  border: 2px solid var(--line);
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-soft);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.speak-btn:hover{
  border-color: var(--accent);
  color: var(--ink);
}

/* Activity 2: Matching */
.matching-board{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.match-card{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-md);
  padding: 18px 16px;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all .16s ease;
}
.match-card:hover{
  transform: translateY(-3px);
  border-color: var(--accent);
}
.match-card.selected{
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--card));
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent);
}
.match-card.matched{
  border-color: var(--ok);
  background: var(--ok-bg);
  opacity: .55;
  pointer-events: none;
  transform: none;
}
.match-card.wrong{
  border-color: var(--bad);
  background: var(--bad-bg);
  animation: shake .4s;
}
@keyframes shake{
  0%, 100%{ transform: translateX(0); }
  25%{ transform: translateX(-8px); }
  75%{ transform: translateX(8px); }
}

.match-stats{
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  background: var(--card-2);
  padding: 12px 18px;
  border-radius: var(--radius-md);
  margin-bottom: 20px;
  font-size: 16px;
}
.match-stats b{ color: var(--accent); }

/* Activity 3: Cloze */
.cloze-box{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.cloze-head{
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--line);
}
.cloze-title{
  font-family: var(--display);
  font-size: 24px;
  color: var(--ink);
}
.cloze-story-text{
  font-size: 20px;
  line-height: 1.85;
  color: var(--ink);
  margin-bottom: 24px;
}
.cloze-blank{

  padding: 2px 12px;

  background: var(--card-2);

  font-weight: 700;
  color: var(--accent);
  text-align: center;
  cursor: pointer;
  margin: 0 4px;
}
.cloze-blank.filled{

  background: color-mix(in srgb, var(--accent) 15%, var(--card));
}
.cloze-blank.selected{
  box-shadow: 0 0 0 3px var(--accent);
}
.cloze-blank.correct{
  background: var(--ok-bg);
  border-color: var(--ok);
  color: var(--ok);
}
.cloze-blank.incorrect{
  background: var(--bad-bg);
  border-color: var(--bad);
  color: var(--bad);
}

.word-bank{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  background: var(--card-2);
  border: 2px dashed var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 24px;
}
.bank-chip{
  padding: 8px 16px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-pill);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  box-shadow: 0 2px 0 var(--line);
  cursor: pointer;
}
.bank-chip:hover{
  border-color: var(--accent);
  color: var(--accent);
}
.bank-chip.used{
  opacity: .35;
  pointer-events: none;
}

/* Activity 4: Quiz */
.quiz-card{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.quiz-q-num{

  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-soft);
  margin-bottom: 8px;
}
.quiz-question{
  font-family: var(--display);
  font-size: 24px;
  color: var(--ink);
  line-height: 1.35;
  margin-bottom: 22px;
}
.quiz-options{
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 22px;
}
.quiz-opt{
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  text-align: left;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);

  align-items: center;
  gap: 14px;
  cursor: pointer;

.quiz-opt:hover{

  background: var(--card-hover);
}
.quiz-opt.correct{
  background: var(--ok-bg);
  border-color: var(--ok);
  color: var(--ok);
}
.quiz-opt.wrong{
  background: var(--bad-bg);
  border-color: var(--bad);
  color: var(--bad);
}
.quiz-feedback{
  background: var(--card-2);
  border-left: 5px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 16px;
  font-size: 16px;
  margin-top: 18px;
}

.lexikon-sec{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow);
}
.lexikon-head{
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
}
.lexikon-head h3{
  margin: 0;
  font-family: var(--display);
  font-size: 24px;
}
.lex-search{
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--line);
  font-family: inherit;
  font-size: 15px;
  background: var(--paper);
  color: var(--ink);
  width: 220px;
}
.lex-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}
.lex-card{
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.lex-word-row{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.lex-word{
  font-family: var(--display);
  font-size: 20px;
  color: var(--ink);
}

@media print{
  body{ background: #fff; }
  .site-head .controls-bar, .site-head .top-actions, .act-grid, .hero-labor, button{
    display: none !important;
  }
  .lex-grid{ grid-template-columns: 1fr 1fr; }
}

/* ==========================================================================
   WEB AUDIO SOUND SYNTHESIZER
   ========================================================================== */
let audioCtx = null;
function playSfx(type){
  if(!S.sound) return;
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if(type === 'correct'){
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(554.37, now + 0.1);
      osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.22);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if(type === 'wrong'){
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.linearRampToValueAtTime(170, now + 0.25);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if(type === 'click'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if(type === 'fanfare'){
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);
        o.frequency.setValueAtTime(freq, now + idx * 0.12);
        g.gain.setValueAtTime(0.2, now + idx * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
        o.start(now + idx * 0.12);
        o.stop(now + idx * 0.12 + 0.35);
      });
    }
  } catch(e) {}
}

function speakGerman(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/[•\(\)\[\]\<\>]/g, ' ').replace(/\s+/g, ' ');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'de-DE';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function filterVocabByLevel(level){
  if(!level || level === 'all') return DATA.vocab;
  return DATA.vocab.filter(v => v.level === level);
}

function getArticleClass(art){
  if(art === 'der') return 'der';
  if(art === 'die') return 'die';
  if(art === 'das') return 'das';
  if(art.includes('Verb')) return 'verb';
  return 'adj';
}

function toggleTheme(){
  S.theme = S.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', S.theme);
  playSfx('click');
  render();
}

function toggleSound(){
  S.sound = !S.sound;
  playSfx('click');
  render();
}

function resetTimer(){
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  S.timerRemaining = S.timerSetting;
}

function startTimerIfNeeded(){
  if(S.timerSetting <= 0) return;
  clearInterval(S.timerInterval);
  S.timerRemaining = S.timerSetting;
  S.timerRunning = true;
  S.timerInterval = setInterval(() => {
    S.timerRemaining--;
    if(S.timerRemaining <= 0){
      clearInterval(S.timerInterval);
      S.timerRunning = false;
      playSfx('wrong');
    }
    const tel = document.getElementById('timer-num');
    if(tel){
      tel.textContent = S.timerRemaining + 's';
      if(S.timerRemaining <= 5) tel.classList.add('urgent');
      else tel.classList.remove('urgent');
    }
  }, 1000);
}

function awardPoints(pts){
  if(S.mode === 'team'){
    S.teams[S.activeTeamIdx].score += pts;
  } else {
    S.soloStats.stars += pts;
  }
}

function rotateTurn(){
  if(S.mode === 'team'){
    S.activeTeamIdx = (S.activeTeamIdx + 1) % S.numTeams;
  }
}

  if(S.view === "home") renderHome(app);

  else if(S.view === "matching") renderMatchingView(app);

}

function getUnitInfo(u){
  const map = {
    km: { article: "der", name: "Kilometer" },
    m: { article: "der", name: "Meter" },
    dm: { article: "der", name: "Dezimeter" },
    cm: { article: "der", name: "Zentimeter" },
    mm: { article: "der", name: "Millimeter" },
    t: { article: "die", name: "Tonne" },
    kg: { article: "das", name: "Kilogramm" },
    g: { article: "das", name: "Gramm" },
    mg: { article: "das", name: "Milligramm" },
    d: { article: "der", name: "Tag" },
    h: { article: "die", name: "Stunde" },
    min: { article: "die", name: "Minute" },
    s: { article: "die", name: "Sekunde" },
    "€": { article: "der", name: "Euro" },
    ct: { article: "der", name: "Cent" }
  };
  return map[u] || { article: "", name: u };
}

function getUnitFullName(u){
  const info = getUnitInfo(u);
  return info.article ? `${info.article} ${info.name}` : info.name;
}

function calculateConversions(val, fromUnit, cat){
  const num = parseFloat(val) || 0;
  if(cat === "laenge"){
    // Standard: Meter
    const toMeter = { km: 1000, m: 1, dm: 0.1, cm: 0.01, mm: 0.001 };
    const meters = num * toMeter[fromUnit];
    return [
      { unit: "km", val: formatNumber(meters / 1000) },
      { unit: "m", val: formatNumber(meters) },
      { unit: "dm", val: formatNumber(meters * 10) },
      { unit: "cm", val: formatNumber(meters * 100) },
      { unit: "mm", val: formatNumber(meters * 1000) }
    ];
  } else if(cat === "gewicht"){
    // Standard: Kilogramm
    const toKg = { t: 1000, kg: 1, g: 0.001, mg: 0.000001 };
    const kgs = num * toKg[fromUnit];
    return [
      { unit: "t", val: formatNumber(kgs / 1000) },
      { unit: "kg", val: formatNumber(kgs) },
      { unit: "g", val: formatNumber(kgs * 1000) },
      { unit: "mg", val: formatNumber(kgs * 1000000) }
    ];
  } else if(cat === "zeit"){
    // Standard: Sekunden
    const toSec = { d: 86400, h: 3600, min: 60, s: 1 };
    const sec = num * toSec[fromUnit];
    return [
      { unit: "d", val: formatNumber(sec / 86400) },
      { unit: "h", val: formatNumber(sec / 3600) },
      { unit: "min", val: formatNumber(sec / 60) },
      { unit: "s", val: formatNumber(sec) }
    ];
  } else if(cat === "geld"){
    const toCent = { "€": 100, ct: 1 };
    const cent = num * toCent[fromUnit];
    return [
      { unit: "€", val: formatNumber(cent / 100) },
      { unit: "ct", val: formatNumber(cent) }
    ];
  }
  return [];
}

function formatNumber(n){
  if(n === 0) return "0";
  if(Math.abs(n) >= 1000000 || (Math.abs(n) < 0.001 && n !== 0)){
    return n.toLocaleString('de-DE', { maximumFractionDigits: 6 });
  }
  return n.toLocaleString('de-DE', { maximumFractionDigits: 3 });
}

/* ==========================================================================

   ========================================================================== */
function initMatching(){
  const pool = filterVocabByLevel(S.level);
  let pairCount = 6;
  if(S.level === 'einfach') pairCount = 4;
  else if(S.level === 'schwer') pairCount = 8;

  const chosen = shuffle(pool).slice(0, Math.min(pairCount, pool.length));
  const cards = [];
  chosen.forEach(item => {
    cards.push({
      id: item.id + '_word',
      pairId: item.id,
      type: 'word',
      text: `${item.article} ${item.word}`,
      symbol: item.symbol
    });
    cards.push({
      id: item.id + '_def',
      pairId: item.id,
      type: 'def',
      text: item.matchingShort || item.def,
      symbol: ''
    });
  });

  S.matching.pairs = shuffle(cards);
  S.matching.selectedCard = null;
  S.matching.matchedCount = 0;
  S.matching.moves = 0;
  S.matching.finished = false;
}

function renderMatchingView(app){
  const totalPairs = S.matching.pairs.length / 2;
  const isFinished = S.matching.matchedCount >= totalPairs;

  app.innerHTML = `
    <header class="gbar">
      <button class="back-btn" id="exit-btn">← Zur Übersicht</button>
      <div class="gbar-title">
        <h2>🧩 Paare finden • Begriffs-Zuordnung</h2>

      </div>

      ${!isFinished ? `
        <div class="matching-board">

            const isMatched = card.matched;
            return `
              <div class="match-card ${card.type === 'word' ? 'word-card' : 'def-card'} ${isSelected ? 'selected' : ''} ${isMatched ? 'matched' : ''}" 
                   data-cid="${card.id}" 
                   onclick="handleMatchCardClick('${card.id}')">

                  <div style="font-family:var(--display); font-size:22px; color:var(--ink);">${card.text}</div>
                  ${card.symbol ? `<div style="font-size:14px; color:var(--accent); margin-top:4px;">${card.symbol}</div>` : ''}
                ` : `
                  <div style="color:var(--ink-soft); font-weight:600; font-size:16px;">${card.text}</div>
                `}
              </div>
            `;
          }).join("")}
        </div>
      ` : `
        <div style="text-align:center; background:var(--card); border:3px solid var(--ok); border-radius:var(--radius-lg); padding:40px 24px; box-shadow:var(--shadow-lg);">
          <div style="font-size:64px; margin-bottom:10px;">🎉 ⭐⭐⭐</div>
          <h2 style="font-family:var(--display); font-size:36px; color:var(--ok); margin:0 0 10px;">Klasse gemacht! Alle Paare gefunden!</h2>
          <p style="font-size:18px; color:var(--ink-soft); margin-bottom:24px;">Du hast alle ${totalPairs} Paare in <b>${S.matching.moves} Zügen</b> gemeistert.</p>

function handleMatchCardClick(cid){
  const card = S.matching.pairs.find(c => c.id === cid);
  if(!card || card.matched) return;

  if(!S.matching.selectedCard){
    S.matching.selectedCard = card;
    playSfx('click');
    render();
  } else {
    if(S.matching.selectedCard.id === card.id) return;

    S.matching.moves++;
    const first = S.matching.selectedCard;

    if(first.pairId === card.pairId && first.type !== card.type){
      first.matched = true;
      card.matched = true;
      S.matching.matchedCount++;
      S.matching.selectedCard = null;
      awardPoints(1);
      playSfx('correct');

      const totalPairs = S.matching.pairs.length / 2;
      if(S.matching.matchedCount >= totalPairs){
        setTimeout(() => { playSfx('fanfare'); }, 300);
      }
      render();
    } else {
      playSfx('wrong');
      const el1 = document.querySelector(`[data-cid="${first.id}"]`);
      const el2 = document.querySelector(`[data-cid="${card.id}"]`);
      if(el1) el1.classList.add('wrong');
      if(el2) el2.classList.add('wrong');

      setTimeout(() => {
        S.matching.selectedCard = null;
        rotateTurn();
        render();
      }, 700);
    }
  }
}

  S.cloze.checked = true;
  const userAns = S.cloze.userAnswers[S.cloze.singleIdx];
  if(userAns === correct){
    awardPoints(1);
    playSfx('correct');

    playSfx('wrong');

  render();

  S.cloze.singleIdx = (S.cloze.singleIdx + 1) % total;
  S.cloze.checked = false;
  rotateTurn();
  render();

function renderStoryCloze(story){
  let rawText = story.storyText;
  const isChecked = S.cloze.checked;

  story.blanks.forEach((ans, bIdx) => {
    const userVal = S.cloze.userAnswers[bIdx];
    const isSelected = S.cloze.selectedBlankId === bIdx;
    let cls = "cloze-blank";
    if(userVal) cls += " filled";
    if(isSelected) cls += " selected";
    if(isChecked){
      if(userVal === ans) cls += " correct";
      else cls += " incorrect";
    }

    const placeholder = `<span class="${cls}" onclick="handleBlankClick(${bIdx})">${userVal || '____' + (bIdx + 1) + '____'}</span>`;
    rawText = rawText.replace('[' + ans + ']', placeholder);
  });

  const usedAnswers = Object.values(S.cloze.userAnswers);

  return `
    <div class="cloze-story-text">
      ${rawText}
    </div>

    ${!isChecked ? `
      <div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span class="ctl-label">Wortbank (Klicke auf eine Lücke im Text und dann auf das Wort):</span>
          <button class="speak-btn" onclick="speakGerman('${story.storyText.replace(/\[/g,'').replace(/\]/g,'')}')">🔊 Text vorlesen</button>
        </div>
        <div class="word-bank">
          ${story.wordBank.map(w => {
            const isUsed = usedAnswers.includes(w);
            return `<button class="bank-chip ${isUsed ? 'used' : ''}" onclick="insertWordIntoBlank('${w}')">${w}</button>`;
          }).join("")}
        </div>
      </div>
    ` : `
      <div style="background:var(--card-2); padding:16px 20px; border-radius:var(--radius-md); border-left:5px solid var(--accent); margin-bottom:20px;">
        <b>Auswertung:</b> Grün = richtig eingesetzt • Rot = überprüfe die Stelle noch einmal!
      </div>
    `}

    <div class="act-btns">
      ${!isChecked ? `
        <button class="btn primary" onclick="checkStoryCloze()">Lösungen prüfen ✓</button>
        <button class="btn" onclick="initCloze(); render();">Zurücksetzen 🔄</button>
      ` : `
        <button class="btn success" onclick="initCloze(); S.cloze.activeStoryIdx++; render();">Nächster Merktext →</button>
        <button class="btn" onclick="initCloze(); render();">Nochmal probieren 🔄</button>
      `}
    </div>
  `;
}

function handleBlankClick(bIdx){
  if(S.cloze.checked) return;
  S.cloze.selectedBlankId = bIdx;
  playSfx('click');
  render();
}

function insertWordIntoBlank(word){
  if(S.cloze.checked) return;
  if(S.cloze.selectedBlankId === null){
    const story = DATA.cloze[S.cloze.activeStoryIdx % DATA.cloze.length];
    for(let i = 0; i < story.blanks.length; i++){
      if(!S.cloze.userAnswers[i]){
        S.cloze.selectedBlankId = i;
        break;
      }
    }
  }

  if(S.cloze.selectedBlankId !== null){
    S.cloze.userAnswers[S.cloze.selectedBlankId] = word;
    playSfx('click');

    const story = DATA.cloze[S.cloze.activeStoryIdx % DATA.cloze.length];
    let nextEmpty = null;
    for(let i = S.cloze.selectedBlankId + 1; i < story.blanks.length; i++){
      if(!S.cloze.userAnswers[i]){ nextEmpty = i; break; }
    }
    S.cloze.selectedBlankId = nextEmpty;
    render();
  }
}

function checkStoryCloze(){
  const story = DATA.cloze[S.cloze.activeStoryIdx % DATA.cloze.length];
  let correctCount = 0;
  story.blanks.forEach((ans, bIdx) => {
    if(S.cloze.userAnswers[bIdx] === ans) correctCount++;
  });

  S.cloze.checked = true;
  awardPoints(correctCount);
  if(correctCount === story.blanks.length){
    playSfx('fanfare');
  } else if(correctCount > 0){
    playSfx('correct');
  } else {
    playSfx('wrong');
  }
  render();
}

/* ==========================================================================
   ÜBUNG 4: PRAXIS & STOLPERSTELLEN-QUIZ
   ========================================================================== */
function initQuiz(){
  S.quiz.idx = 0;
  S.quiz.selectedOption = null;
  S.quiz.confirmed = false;
  S.quiz.score = 0;
  // Zufällige Verteilung der Antwortmöglichkeiten für jede Frage (nie immer oben!)
  S.quiz.deck = DATA.quiz.map(q => {
    const pairs = q.options.map((opt, i) => ({ opt, isCorrect: i === q.ans }));
    const shuffledPairs = shuffle(pairs);
    return {
      q: q.q,
      options: shuffledPairs.map(p => p.opt),
      ans: shuffledPairs.findIndex(p => p.isCorrect),
      calc: q.calc || '',
      exp: q.exp
    };
  });
}

function renderQuizView(app){
  if(!S.quiz.deck || !S.quiz.deck.length) initQuiz();
  const deck = S.quiz.deck;
  const total = deck.length;
  const isFinished = S.quiz.idx >= total;
  const q = !isFinished ? deck[S.quiz.idx] : null;

  app.innerHTML = `
    <header class="gbar">
      <button class="back-btn" id="exit-btn">← Zur Übersicht</button>
      <div class="gbar-title">
        <h2>🎯 Praxis- &amp; Stolperstellen-Training</h2>
        <p>${!isFinished ? `Frage <b>${S.quiz.idx + 1}</b> von <b>${total}</b>` : 'Abschluss-Auswertung'}</p>
      </div>
      <div>
        <button class="btn" onclick="initQuiz(); render();">🔄 Neustart</button>
      </div>
    </header>

    ${S.mode === 'team' ? renderTeamsBar() : renderSoloBar()}

    <main style="max-width:820px; margin:0 auto;">
      ${!isFinished ? `
        <div class="quiz-card">
          <div class="quiz-q-num">Aufgabe ${S.quiz.idx + 1} von ${total}</div>
          <div class="quiz-question">${q.q}</div>

          <div class="quiz-options">
            ${q.options.map((opt, oIdx) => {
              let cls = "quiz-opt";
              if(S.quiz.confirmed){
                if(oIdx === q.ans) cls += " correct";
                else if(oIdx === S.quiz.selectedOption) cls += " wrong";
              } else if(S.quiz.selectedOption === oIdx){
                cls += " selected";
              }
              return `
                <button class="${cls}" onclick="handleQuizSelect(${oIdx})">
                  <span style="font-family:var(--display); font-size:20px; color:var(--accent); min-width:28px;">${String.fromCharCode(65 + oIdx)}.</span>
                  <span style="display:flex; flex-direction:column; align-items:flex-start; text-align:left; flex:1;">
                    <span style="font-size:17px; font-weight:700;">${opt}</span>
                    ${S.quiz.confirmed && oIdx === q.ans && q.calc ? `
                      <span class="quiz-calc-tag" style="margin-top:6px; font-size:13px; font-weight:700; color:var(--ok); background:var(--ok-bg); padding:3px 8px; border-radius:6px; border:1px solid var(--ok);">
                        🧮 ${q.calc}
                      </span>
                    ` : ''}
                  </span>
                </button>
              `;
            }).join("")}
          </div>

          ${S.quiz.confirmed ? `
            <div class="quiz-feedback">
              <div style="font-size:17px; margin-bottom:8px;">
                <b>${S.quiz.selectedOption === q.ans ? '✓ Sehr gut gelöst!' : '✕ Das war leider nicht richtig.'}</b>
              </div>
              ${q.calc ? `
                <div style="background:var(--card); border-left:4px solid var(--accent); padding:10px 14px; border-radius:6px; margin-bottom:10px; font-size:15px; color:var(--ink);">
                  <b>🧮 Rechnung / Lösungsweg:</b> <span style="font-family:monospace; font-weight:700; color:var(--accent);">${q.calc}</span>
                </div>
              ` : ''}
              <div style="font-size:15px; color:var(--ink); line-height:1.5;">
                <b>💡 Erklärung:</b> ${q.exp}
              </div>
            </div>
          ` : ''}

          <div class="act-btns">
            ${!S.quiz.confirmed ? `
              <button class="btn primary" ${S.quiz.selectedOption === null ? 'disabled style="opacity:.5"' : ''} onclick="confirmQuizAnswer()">Antwort einloggen ✓</button>
            ` : `
              <button class="btn primary" onclick="nextQuizQuestion()">Nächste Frage →</button>
            `}
          </div>
        </div>
      ` : `
        <div style="text-align:center; background:var(--card); border:3px solid var(--ok); border-radius:var(--radius-lg); padding:40px 24px; box-shadow:var(--shadow-lg);">
          <div style="font-size:64px; margin-bottom:10px;">🏆 ⭐⭐⭐</div>
          <h2 style="font-family:var(--display); font-size:36px; color:var(--ok); margin:0 0 10px;">Hervorragend! Quiz abgeschlossen!</h2>
          <p style="font-size:20px; color:var(--ink-soft); margin-bottom:24px;">Du hast <b>${S.quiz.score} von ${total} Aufgaben</b> richtig beantwortet.</p>
          <div class="act-btns">
            <button class="btn success" onclick="initQuiz(); render();">Quiz wiederholen 🔄</button>
            <button class="btn" onclick="S.view='home'; render();">Zurück zur Hauptseite</button>
          </div>
        </div>
      `}
    </main>
  `;

  document.getElementById('exit-btn').onclick = () => { S.view = 'home'; resetTimer(); playSfx('click'); render(); };
}

function handleQuizSelect(oIdx){
  if(S.quiz.confirmed) return;
  if(S.quiz.selectedOption === oIdx){
    confirmQuizAnswer();
    return;
  }
  S.quiz.selectedOption = oIdx;
  playSfx('click');
  render();
}

function confirmQuizAnswer(){
  if(S.quiz.selectedOption === null || S.quiz.confirmed) return;
  const q = (S.quiz.deck && S.quiz.deck[S.quiz.idx]) || DATA.quiz[S.quiz.idx];
  S.quiz.confirmed = true;

  if(S.quiz.selectedOption === q.ans){
    S.quiz.score++;
    awardPoints(1);
    playSfx('correct');
  } else {
    playSfx('wrong');
  }
  render();
}

function nextQuizQuestion(){
  S.quiz.idx++;
  S.quiz.selectedOption = null;
  S.quiz.confirmed = false;
  rotateTurn();
  render();
  const total = (S.quiz.deck ? S.quiz.deck.length : DATA.quiz.length);
  if(S.quiz.idx >= total) playSfx('fanfare');
}

/* ==========================================================================
   WORTSPEICHER (LEXIKON)
   ========================================================================== */
function renderLexikonGrid(){
  return `<div class="lex-grid" id="lex-grid-box">${renderLexikonCardsHtml()}</div>`;
}

function renderLexikonCardsHtml(){
  const query = S.lexikonSearch.toLowerCase();
  const pool = DATA.vocab.filter(v => {
    if(query){
      const match = v.word.toLowerCase().includes(query) ||
                    v.def.toLowerCase().includes(query) ||
                    v.example.toLowerCase().includes(query) ||
                    (v.matchingShort && v.matchingShort.toLowerCase().includes(query));
      if(!match) return false;
    }
    return true;
  });

  if(pool.length === 0){
    return `<div style="grid-column: 1 / -1; padding:20px; text-align:center; color:var(--ink-soft);">Kein Begriff für „${query}“ gefunden.</div>`;
  }

  return pool.map(item => `
    <div class="lex-card">
      <div class="lex-word-row">
        <div>
          <span class="art-chip ${getArticleClass(item.article)}" style="font-size:12px; padding:2px 8px;">${item.article}</span>
          <span class="lex-word">${item.word}</span>
        </div>
        <button class="circle-btn" style="width:32px; height:32px; font-size:14px;" onclick="speakGerman('${item.article} ${item.word}. ${item.def}')" title="Vorlesen">🔊</button>
      </div>
      <div style="font-size:14px; color:var(--ink-soft); font-weight:600;">${item.plural}</div>
      ${item.symbol ? `<div style="font-size:13px; color:var(--accent); font-weight:700;">${item.symbol}</div>` : ''}
      <div style="font-size:15px; color:var(--ink); line-height:1.45;">${item.def}</div>
      <div style="font-size:13px; color:var(--ink-soft); font-style:italic;">„${item.example}“</div>
      ${item.tip ? `<div style="font-size:12px; background:var(--card); padding:6px 10px; border-radius:6px; border:1px solid var(--line);">💡 ${item.tip}</div>` : ''}
    </div>
  `).join("");
}

/* ==========================================================================
   SHARED UI BARS: TIMER & TEAMS
   ========================================================================== */
function renderTimerBox(){
  if(S.timerSetting <= 0) return '';
  return `
    <div class="timer-box">
      <span>⏳</span>
      <span class="timer-val ${S.timerRemaining <= 5 ? 'urgent' : ''}" id="timer-num">${S.timerRemaining}s</span>
    </div>
  `;
}

function renderTeamsBar(){
  return `
    <div class="teams-bar">
      ${S.teams.slice(0, S.numTeams).map((t, idx) => `
        <div class="team-chip ${idx === S.activeTeamIdx ? 'active' : ''}" style="--tc:${t.color};">
          <span class="team-title">${t.name}</span>
          <div class="team-sc">${t.score}</div>
          <button class="pm-btn" onclick="t.score++; playSfx('click'); render();">+</button>
        </div>
      `).join("")}
    </div>
  `;
}

function renderSoloBar(){
  return `
    <div class="solo-bar">
      <div>Sterne: <b>⭐ ${S.soloStats.stars}</b></div>
      <div>Serie: <b>🔥 ${S.soloStats.streak}</b></div>
      <div>Karten/Aufgaben geübt: <b>${S.soloStats.total}</b></div>
    </div>
  `;
}

// Initialisierung
window.addEventListener('DOMContentLoaded', () => {
  render();
});
</script>
</body>
</html>
