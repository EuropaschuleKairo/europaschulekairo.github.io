<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mein Maßstabs-Wortschatz • Maßstab &amp; Längen berechnen • Klasse 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --paper: #fbfcfe;
  --grid: #e2e8f0;
  --margin: #e8a0a0;
  --ink: #1e1b4b;
  --ink-soft: #475569;
  --ink-muted: #64748b;
  --line: #cbd5e1;
  --card: #ffffff;
  --card-2: #f8fafc;
  --card-hover: #f1f5f9;

  --accent: #7c3aed;
  --accent-hover: #6d28d9;
  --accent-soft: #ede9fe;
  --accent-ink: #ffffff;
  --marker: #fef08a;
  --marker-ink: #1e1b4b;

  /* DaZ Artikelfarben - kräftig und barrierefrei */
  --der: #1d4ed8;
  --die: #b91c1c;
  --das: #15803d;
  --verb: #7c3aed;
  --adj: #c2410c;

  /* Stufen */
  --einfach: #15803d;
  --einfach-bg: #dcfce7;
  --mittel: #b45309;
  --mittel-bg: #fef3c7;
  --schwer: #6d28d9;
  --schwer-bg: #f3e8ff;

  --ok: #15803d;
  --ok-bg: #dcfce7;
  --bad: #b91c1c;
  --bad-bg: #fee2e2;
  --warn: #b45309;
  --warn-bg: #fef3c7;

  /* Teams */
  --t1: #1d4ed8; /* Löwen */
  --t2: #15803d; /* Delphine */
  --t3: #b45309; /* Adler */
  --t4: #be185d; /* Füchse */

  --shadow: 0 2px 0 rgba(30,27,75,.08), 0 8px 24px rgba(30,27,75,.06);
  --shadow-lg: 0 6px 0 rgba(30,27,75,.12), 0 14px 32px rgba(30,27,75,.1);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;

  --display: "Lilita One", system-ui, sans-serif;
  --body: "Andika", "Segoe UI", system-ui, sans-serif;
}

:root[data-theme="dark"]{
  --paper: #0f172a;
  --grid: #1e293b;
  --margin: #5c2d3a;
  --ink: #f8fafc;
  --ink-soft: #94a3b8;
  --ink-muted: #64748b;
  --line: #334155;
  --card: #1e293b;
  --card-2: #243248;
  --card-hover: #334155;

  --accent: #a78bfa;
  --accent-hover: #c4b5fd;
  --accent-soft: #2e1065;
  --accent-ink: #0f172a;
  --marker: #facc15;
  --marker-ink: #0f172a;

  --der: #3b82f6;
  --die: #ef4444;
  --das: #22c55e;
  --verb: #c084fc;
  --adj: #fb923c;

  --einfach: #22c55e;
  --einfach-bg: #064e3b;
  --mittel: #fbbf24;
  --mittel-bg: #78350f;
  --schwer: #c084fc;
  --schwer-bg: #581c87;

  --ok: #22c55e;
  --ok-bg: #064e3b;
  --bad: #ef4444;
  --bad-bg: #450a0a;
  --warn: #fbbf24;
  --warn-bg: #451a03;

  --t1: #60a5fa;
  --t2: #34d399;
  --t3: #fbbf24;
  --t4: #f472b6;

  --shadow: 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.6);
}

*, *::before, *::after{box-sizing:border-box}
body{
  margin:0;
  font-family: var(--body);
  color: var(--ink);
  font-size: 18px;
  line-height: 1.5;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  min-height: 100vh;
  padding: 16px 12px 60px;
}

@media (min-width: 768px){
  body{ padding: 28px 24px 80px; font-size: 19px; }
}

.wrap{
  max-width: 1060px;
  margin: 0 auto;
}

/* Kopfbereich */
.site-head{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
}
.head-top{
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  padding-bottom: 16px;
  border-bottom: 2px dashed var(--line);
}
.brand-group{
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand-badge{
  font-size: 42px;
  line-height: 1;
  background: var(--accent-soft);
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 18px;
  border: 2px solid var(--accent);
}
.brand-titles h1{
  font-family: var(--display);
  font-size: clamp(24px, 4.2vw, 36px);
  color: var(--ink);
  margin: 0;
  line-height: 1.15;
}
.brand-titles h1 span{
  color: var(--accent);
}
.brand-titles p{
  margin: 4px 0 0;
  color: var(--ink-soft);
  font-size: 15px;
  font-weight: 700;
}
.top-actions{
  display: flex;
  align-items: center;
  gap: 10px;
}
.hub-link{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card-2);
  border: 2px solid var(--line);
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  color: var(--ink);
  text-decoration: none;
  font-weight: 700;
  font-size: 15px;
  transition: all .2s;
}
.hub-link:hover{
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}
.circle-btn{
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .2s;
}
.circle-btn:hover{
  border-color: var(--accent);
  transform: translateY(-2px);
}

/* Controls Bar */
.controls-bar{
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  padding-top: 16px;
  align-items: center;
  justify-content: space-between;
}
.ctl-col{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ctl-label{
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.pills{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.pill{
  border: 2px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: all .15s;
}
.pill:hover{
  border-color: var(--accent);
}
.pill[aria-pressed="true"]{
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.pill.level-einfach[aria-pressed="true"]{ background: var(--einfach); border-color: var(--einfach); color: #fff; }
.pill.level-mittel[aria-pressed="true"]{ background: var(--mittel); border-color: var(--mittel); color: #fff; }
.pill.level-schwer[aria-pressed="true"]{ background: var(--schwer); border-color: var(--schwer); color: #fff; }

.info-banner{
  margin-top: 14px;
  background: var(--accent-soft);
  border: 2px solid var(--accent);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  font-size: 15px;
  color: var(--ink);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

/* HERO SECTION: Interaktives Maßstabs-Labor */
.hero-massstab{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 28px;
}
.hero-head{
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 20px;
  border-bottom: 2px solid var(--line);
  padding-bottom: 16px;
}
.hero-head h2{
  font-family: var(--display);
  font-size: clamp(22px, 3.5vw, 28px);
  margin: 0;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-tabs{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.hero-tab{
  font-family: inherit;
  font-weight: 700;
  font-size: 14px;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  cursor: pointer;
  transition: all .2s;
}
.hero-tab:hover{
  border-color: var(--accent);
}
.hero-tab.active{
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}

/* Hero Content Styles */
.hero-content{
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px;
}
.scale-explainer-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  align-items: center;
}
.scale-visual-stage{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.scale-visual-svg{
  width: 100%;
  max-height: 220px;
  margin: 0 auto;
  display: block;
}
.scale-formula-box{
  background: var(--accent-soft);
  border: 2px solid var(--accent);
  border-radius: var(--radius-md);
  padding: 16px;
}
.scale-ratio-badge{
  display: inline-block;
  font-family: var(--display);
  font-size: 32px;
  color: var(--accent);
  background: var(--card);
  padding: 4px 18px;
  border-radius: var(--radius-md);
  border: 2px solid var(--accent);
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.scale-explain-list{
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 15px;
}
.scale-explain-list li{
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.scale-explain-list li b{
  color: var(--ink);
}

.scale-presets-bar{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 2px dashed var(--line);
}
.scale-preset-btn{
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  transition: all .15s;
}
.scale-preset-btn:hover{
  border-color: var(--accent);
  color: var(--accent);
}
.scale-preset-btn.active{
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* Calculator Boxes */
.calc-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 20px;
}
.calc-inputs-card{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.calc-field{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.calc-field label{
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-soft);
}
.calc-field input, .calc-field select{
  font-family: inherit;
  font-size: 16px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  font-weight: 700;
}
.calc-field input:focus, .calc-field select:focus{
  outline: none;
  border-color: var(--accent);
}
.calc-steps-card{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.calc-step{
  background: var(--card-2);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 10px 14px;
  font-size: 15px;
}
.calc-step-num{
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
}
.calc-step-math{
  font-family: monospace;
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  margin-top: 2px;
}
.calc-result-box{
  background: var(--einfach-bg);
  border: 2px solid var(--einfach);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  color: var(--ink);
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Maßstabsleiste Interaktiv */
.scalebar-interactive-box{
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px;
  text-align: center;
}
.scalebar-wrapper{
  background: var(--card-2);
  border: 2px dashed var(--line);
  border-radius: var(--radius-md);
  padding: 30px 20px;
  position: relative;
  margin: 16px 0;
  overflow-x: auto;
}
.virtual-ruler{
  background: #fef08a;
  color: #713f12;
  border: 2px solid #ca8a04;
  border-radius: 6px;
  padding: 8px 12px;
  display: inline-block;
  margin-top: 14px;
  box-shadow: var(--shadow);
  font-family: monospace;
  font-weight: bold;
}
:root[data-theme="dark"] .virtual-ruler{
  background: #854d0e;
  color: #fef08a;
  border-color: #eab308;
}

/* ACTIVITY CARDS GRID */
.act-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 20px;
  margin-bottom: 28px;
}
.act-card{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.act-card::before{
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  background: var(--accent);
}
.act-card:hover{
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: var(--shadow-lg);
}
.act-card-top{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.act-tag{
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.act-icon-box{
  font-size: 32px;
  background: var(--accent-soft);
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--accent);
}
.act-desc{
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 1.45;
  margin: 0 0 16px;
  flex-grow: 1;
}
.act-card-bottom{
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  border-top: 2px solid var(--line);
  padding-top: 12px;
}

/* ACTIVITY FULL VIEW CONTAINERS */
.activity-container{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 30px;
}
.act-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--line);
  margin-bottom: 20px;
}
.act-title-box{
  display: flex;
  align-items: center;
  gap: 14px;
}
.back-btn{
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
}
.back-btn:hover{
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.act-header h2{
  font-family: var(--display);
  font-size: clamp(22px, 3.5vw, 28px);
  margin: 0;
  color: var(--ink);
}

/* GAME BAR (SOLO & TEAMS) */
.game-bar{
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.teams-list{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.team-badge{
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-weight: 700;
  font-size: 14px;
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
}
.team-badge.active{
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
  background: var(--accent-soft);
}
.solo-stats{
  display: flex;
  align-items: center;
  gap: 16px;
  font-weight: 700;
  font-size: 15px;
}

/* FLASHCARDS */
.flash-wrap{
  max-width: 620px;
  margin: 0 auto;
}
.flash-card-scene{
  perspective: 1000px;
  cursor: pointer;
  margin-bottom: 20px;
}
.flash-card{
  width: 100%;
  min-height: 380px;
  position: relative;
  transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
}
.flash-card.is-flipped{
  transform: rotateY(180deg);
}
.flash-face{
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  backface-visibility: hidden;
  border-radius: var(--radius-lg);
  border: 3px solid var(--line);
  background: var(--card);
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.flash-face.back{
  transform: rotateY(180deg);
  background: var(--card-2);
}
.flash-top{
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.article-pill{
  font-family: var(--display);
  font-size: 16px;
  padding: 4px 14px;
  border-radius: var(--radius-pill);
  font-weight: bold;
  letter-spacing: .5px;
}
.article-der{ background: #dbeafe; color: var(--der); border: 2px solid #93c5fd; }
.article-die{ background: #fee2e2; color: var(--die); border: 2px solid #fca5a5; }
.article-das{ background: #dcfce7; color: var(--das); border: 2px solid #86efac; }
.article-verb{ background: #f3e8ff; color: var(--verb); border: 2px solid #d8b4fe; }
.article-adj{ background: #ffedd5; color: var(--adj); border: 2px solid #fdba74; }

.flash-word-title{
  font-family: var(--display);
  font-size: clamp(30px, 5.5vw, 42px);
  color: var(--ink);
  text-align: center;
  margin: 14px 0 6px;
}
.flash-word-plural{
  text-align: center;
  font-size: 17px;
  color: var(--ink-soft);
  font-weight: 700;
}
.flash-flip-hint{
  text-align: center;
  font-size: 14px;
  color: var(--ink-muted);
  font-weight: 700;
}
.flash-def{
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  margin-bottom: 12px;
}
.flash-example{
  background: var(--card);
  border-left: 4px solid var(--accent);
  padding: 10px 14px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 15px;
  font-style: italic;
  margin-bottom: 12px;
}
.flash-tip{
  background: var(--marker);
  color: var(--marker-ink);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 700;
}
.flash-actions{
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-top: 14px;
}
.flash-btn{
  font-family: inherit;
  font-weight: 700;
  font-size: 16px;
  padding: 12px 24px;
  border-radius: var(--radius-pill);
  border: 2px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all .2s;
}
.flash-btn.repeat{
  background: var(--bad-bg);
  color: var(--bad);
  border-color: var(--bad);
}
.flash-btn.known{
  background: var(--ok-bg);
  color: var(--ok);
  border-color: var(--ok);
}
.flash-btn:hover{
  transform: translateY(-2px);
}
.speak-btn{
  background: var(--card-2);
  border: 2px solid var(--line);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.speak-btn:hover{
  border-color: var(--accent);
  color: var(--accent);
}

/* MATCHING GAME (PAARE FINDEN) */
.matching-stats{
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 18px;
}
.match-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
}
.match-card{
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius-md);
  padding: 18px;
  min-height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  box-shadow: var(--shadow);
  user-select: none;
}
.match-card:hover{
  transform: translateY(-2px);
  border-color: var(--accent);
}
.match-card.selected{
  border-color: var(--accent);
  background: var(--accent-soft);
  transform: scale(1.02);
}
.match-card.matched{
  background: var(--einfach-bg);
  border-color: var(--einfach);
  color: var(--einfach);
  opacity: 0.65;
  cursor: default;
  transform: none;
}
.match-card.wrong{
  animation: shake 0.4s ease-in-out;
  background: var(--bad-bg);
  border-color: var(--bad);
}
@keyframes shake{
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* CLOZE VIEW (LÜCKENTEXT) */
.cloze-story-select{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.cloze-story-btn{
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  cursor: pointer;
  transition: all .15s;
}
.cloze-story-btn.active{
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.cloze-card{
  background: var(--card-2);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 24px;
  font-size: 18px;
  line-height: 1.9;
  margin-bottom: 22px;
}
.cloze-blank{
  display: inline-block;
  min-width: 110px;
  padding: 2px 10px;
  margin: 0 4px;
  border-bottom: 3px solid var(--accent);
  background: var(--card);
  font-weight: 700;
  text-align: center;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s;
}
.cloze-blank.active{
  border-color: var(--ink);
  outline: 2px solid var(--accent);
  background: var(--accent-soft);
}
.cloze-blank.correct{
  background: var(--einfach-bg);
  border-color: var(--einfach);
  color: var(--einfach);
}
.cloze-blank.wrong{
  background: var(--bad-bg);
  border-color: var(--bad);
  color: var(--bad);
}
.word-bank-box{
  background: var(--card);
  border: 2px dashed var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 20px;
}
.word-bank-title{
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.word-bank-chips{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.bank-chip{
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--line);
  background: var(--card-2);
  color: var(--ink);
  cursor: pointer;
  transition: all .15s;
}
.bank-chip:hover{
  border-color: var(--accent);
  background: var(--accent-soft);
}
.cloze-actions{
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}
.primary-btn{
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  padding: 10px 24px;
  border-radius: var(--radius-pill);
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  transition: all .2s;
}
.primary-btn:hover{
  background: var(--accent-hover);
  transform: translateY(-2px);
}

/* QUIZ VIEW */
.quiz-card{
  background: var(--card-2);

  margin-bottom: 22px;

  font-weight: 700;

.quiz-opt-btn.correct{
  background: var(--einfach-bg);
  border-color: var(--einfach);
  color: var(--einfach);
}
.quiz-opt-btn.wrong{
  background: var(--bad-bg);
  border-color: var(--bad);
  color: var(--bad);
}

function getArticleClass(v){
  const art = (v.article || "").toLowerCase().trim();
  if(art === "der") return "article-der";
  if(art === "die") return "article-die";
  if(art === "das") return "article-das";
  if(v.category === "verb") return "article-verb";
  if(v.category === "adjektiv") return "article-adj";
  return "article-das";
}

let audioCtx = null;
function playSfx(type){
  if(!S.sound) return;
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if(type === 'correct'){
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(554.37, now + 0.1);
      osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.22);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if(type === 'wrong'){
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.linearRampToValueAtTime(170, now + 0.25);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if(type === 'click'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if(type === 'fanfare'){
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, now + idx * 0.1);
        g.gain.setValueAtTime(0.2, now + idx * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(now + idx * 0.1);
        o.stop(now + idx * 0.1 + 0.3);
      });
    }
  } catch(e){}
}

function speakGerman(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function filterVocabByLevel(lvl){
  if(!lvl || lvl === 'all') return DATA.vocab;
  return DATA.vocab.filter(v => v.level === lvl);
}

function addScore(points){
  if(S.mode === 'team'){
    S.teams[S.activeTeamIdx].score += points;
    S.activeTeamIdx = (S.activeTeamIdx + 1) % S.numTeams;
  } else {
    S.soloStats.correct += points;
    S.soloStats.streak++;
    if(S.soloStats.streak % 3 === 0) S.soloStats.stars++;
  }
}

          </div>

      </div>
    </div>
  `;
}

function renderRealisticRulerSvg(cfg, measCm, isAttached){
  const startX = 75;
  const cmPx = 76;
  const numCms = cfg.numCms;
  const rulerTop = isAttached ? 82 : 124;
  const rulerHeight = 84;
  const rulerWidth = (numCms + 2.4) * cmPx;
  const svgWidth = 660;
  const svgHeight = isAttached ? 200 : 236;
  const barY = 36;
  const barH = 14;

  let svg = `<svg viewBox="0 0 ${svgWidth} ${svgHeight}" style="width:100%; max-width:640px; height:auto; display:block; margin:0 auto;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="rulerWoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fffbeb"/>
        <stop offset="35%" stop-color="#fef3c7"/>
        <stop offset="85%" stop-color="#fde68a"/>
        <stop offset="100%" stop-color="#fcd34d"/>
      </linearGradient>
      <filter id="rulerDropShadow" x="-3%" y="-5%" width="106%" height="118%">
        <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-opacity="0.22"/>
      </filter>
    </defs>

    <!-- 1. MAßSTABSLEISTE (KARTEN-LEISTE) -->
    <g id="scalebar-layer">
      <text x="${startX}" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="var(--ink-soft)">
        🗺️ KARTEN-MAßSTABSLEISTE
      </text>`;

  // Alternierende Balkenabschnitte
  for(let i = 0; i < numCms; i++){
    const bx = startX + i * cmPx;
    const isDark = (i % 2 === 0);
    const fill = isDark ? "var(--ink)" : "#ffffff";
    svg += `
      <rect x="${bx}" y="${barY}" width="${cmPx}" height="${barH}" fill="${fill}" stroke="var(--ink)" stroke-width="1.8"/>
      <line x1="${bx}" y1="${barY - 8}" x2="${bx}" y2="${barY + barH + 4}" stroke="var(--ink)" stroke-width="2"/>
      <text x="${bx}" y="${barY - 12}" text-anchor="middle" font-family="monospace, system-ui" font-size="13" font-weight="bold" fill="var(--ink)">
        ${i * cfg.valPerCm}
      </text>`;
  }

  // Letzter Teilstrich mit Einheit
  const endX = startX + numCms * cmPx;
  svg += `
      <line x1="${endX}" y1="${barY - 8}" x2="${endX}" y2="${barY + barH + 4}" stroke="var(--ink)" stroke-width="2"/>
      <text x="${endX}" y="${barY - 12}" text-anchor="middle" font-family="monospace, system-ui" font-size="13" font-weight="bold" fill="var(--ink)">
        ${numCms * cfg.valPerCm} ${cfg.unit}
      </text>
    </g>`;

  // 2. MESS-HIGHLIGHT & HILFSLINIEN (Zwischen 0 und gemessenem cm)
  const measX = startX + measCm * cmPx;
  const measTotal = measCm * cfg.valPerCm;
  const bracketY = isAttached ? 66 : 74;

  svg += `
    <g id="measurement-guide">
      <!-- Transparenter Highlight-Korridor -->
      <rect x="${startX}" y="${barY - 4}" width="${measCm * cmPx}" height="${rulerTop - barY + 44}" fill="var(--accent)" fill-opacity="0.12" rx="4"/>

      <!-- Senkrechte Hilfslinien: 0-Punkt & Messpunkt -->
      <line x1="${startX}" y1="24" x2="${startX}" y2="${rulerTop + 44}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="${measX}" y1="24" x2="${measX}" y2="${rulerTop + 44}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>

      <!-- Maßpfeil zwischen 0 und Messpunkt -->
      <line x1="${startX}" y1="${bracketY}" x2="${measX}" y2="${bracketY}" stroke="var(--accent)" stroke-width="2.5"/>
      <polygon points="${startX},${bracketY} ${startX + 6},${bracketY - 4} ${startX + 6},${bracketY + 4}" fill="var(--accent)"/>
      <polygon points="${measX},${bracketY} ${measX - 6},${bracketY - 4} ${measX - 6},${bracketY + 4}" fill="var(--accent)"/>
      <text x="${(startX + measX) / 2}" y="${bracketY - 8}" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="var(--accent)">
        ${measCm} cm = ${measTotal} ${cfg.unit}
      </text>
    </g>`;

  // 3. REALISTISCHES SCHUL-LINEAL (direkt angelegt an die Unterkante der Leiste)
  const rulerStartX = startX - 25;
  svg += `
    <g id="realistic-ruler" filter="url(#rulerDropShadow)">
      <!-- Linealkörper (Acryl / Holzoptik mit Fase) -->
      <rect x="${rulerStartX}" y="${rulerTop}" width="${rulerWidth}" height="${rulerHeight}" rx="6" fill="url(#rulerWoodGrad)" stroke="#b45309" stroke-width="2"/>
      <line x1="${rulerStartX + 4}" y1="${rulerTop + 3}" x2="${rulerStartX + rulerWidth - 4}" y2="${rulerTop + 3}" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>

      <!-- Markierung / Zeiger am Nullpunkt -->
      <polygon points="${startX},${rulerTop - 6} ${startX - 5},${rulerTop - 12} ${startX + 5},${rulerTop - 12}" fill="#dc2626"/>
      <text x="${startX}" y="${rulerTop - 15}" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">
        0-PUNKT
      </text>`;

  // Millimeter- und Zentimeter-Teilstriche auf dem Lineal
  for(let c = 0; c <= numCms + 2; c++){
    const cx = startX + c * cmPx;
    if(cx > rulerStartX + rulerWidth - 14) break;

    // Centimeter-Strich (Länge 24px)
    svg += `
      <line x1="${cx}" y1="${rulerTop}" x2="${cx}" y2="${rulerTop + 24}" stroke="#78350f" stroke-width="2"/>
      <text x="${cx}" y="${rulerTop + 44}" text-anchor="middle" font-family="monospace, system-ui" font-size="16" font-weight="bold" fill="#78350f">
        ${c}
      </text>`;

    // Millimeterstriche (1mm bis 9mm)
    if(c < numCms + 2){
      for(let m = 1; m < 10; m++){
        const mx = cx + m * (cmPx / 10.0);
        if(m === 5){
          // 5 mm Halbzentimeter-Strich
          svg += `<line x1="${mx}" y1="${rulerTop}" x2="${mx}" y2="${rulerTop + 15}" stroke="#78350f" stroke-width="1.4"/>`;
        } else {
          // 1 mm Teilstriche
          svg += `<line x1="${mx}" y1="${rulerTop}" x2="${mx}" y2="${rulerTop + 9}" stroke="#92400e" stroke-width="0.9"/>`;
        }
      }
    }
  }

  // Lineal-Beschriftung
  svg += `
      <text x="${startX + (numCms + 1.2) * cmPx}" y="${rulerTop + 44}" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#78350f">
        cm
      </text>
      <text x="${startX + 140}" y="${rulerTop + 68}" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e" letter-spacing="1.5">
        📏 SCHÜLER-LINEAL (Präzise mm- &amp; cm-Skala)
      </text>
    </g>
  </svg>`;

  return svg;
}

function startActivity(act){
  playSfx('click');
  S.view = act;
  if(act === 'flashcard'){
    S.flash.deck = shuffle(filterVocabByLevel(S.level));
    S.flash.idx = 0;
    S.flash.flipped = false;
  } else if(act === 'matching'){
    initMatchingGame();
  } else if(act === 'cloze'){
    S.cloze.storyIdx = 0;
    S.cloze.activeBlankId = 0;
    S.cloze.userAnswers = {};
    S.cloze.checked = false;
  } else if(act === 'quiz'){
    S.quiz.idx = 0;
    S.quiz.score = 0;
    initQuizQuestion();
  }
  render();
}

function exitToHome(){
  playSfx('click');
  S.view = 'home';
  S.showLexikon = false;
  render();
}

    <div class="activity-container">
      <div class="act-header">
        <div class="act-title-box">
          <button class="back-btn" onclick="exitToHome()">← Zurück</button>
          <h2>🎴 Flashcards • Fachbegriffe üben</h2>
        </div>
        <div style="font-size:16px; font-weight:700; color:var(--ink-soft);">
          Karte ${S.flash.idx + 1} von ${S.flash.deck.length}
        </div>
      </div>

      ${renderGameBar()}

      <div class="flash-wrap">
        <div class="flash-card-scene" onclick="flipFlashCard()">
          <div class="flash-card ${S.flash.flipped ? 'is-flipped' : ''}">
            <!-- VORDERSEITE -->
            <div class="flash-face front">
              <div class="flash-top">
                <span class="article-pill ${getArticleClass(cur)}">${cur.article ? cur.article.toUpperCase() : cur.category.toUpperCase()}</span>
                <span class="act-tag">${cur.levelLabel}</span>
              </div>
              <div class="flash-word">
                <div class="flash-word-title">${cur.word}</div>
                <div class="flash-word-plural">${cur.plural || ''}</div>
              </div>
              <div class="flash-flip-hint">
                🔄 Zum Umdrehen auf die Karte tippen
              </div>
            </div>

            <!-- RÜCKSEITE -->
            <div class="flash-face back">
              <div class="flash-top">
                <span class="act-tag" style="color:var(--accent);">Bedeutung &amp; Rechenregel</span>
                <button class="speak-btn" onclick="event.stopPropagation(); speakGerman('${cur.word}. ${cur.def}')">🔊 Vorlesen</button>
              </div>
              <div>
                <div class="flash-def">${cur.def}</div>
                <div class="flash-example">„${cur.example}“</div>
                <div class="flash-tip">💡 Tipp: ${cur.tip}</div>
              </div>
              <div style="text-align:center; font-size:14px; color:var(--ink-soft); font-weight:700;">
                Symbol: ${cur.symbol}
              </div>
            </div>
          </div>
        </div>

        <div class="flash-actions">
          <button class="flash-btn repeat" onclick="rateFlashCard(false)">
            🔄 Noch nicht sicher
          </button>
          <button class="flash-btn known" onclick="rateFlashCard(true)">
            ✓ Gewusst (+1 Pkt)
          </button>
        </div>
      </div>
    </div>
  `;
}

function flipFlashCard(){
  S.flash.flipped = !S.flash.flipped;
  playSfx('click');
  const card = document.querySelector('.flash-card');
  if(card) card.classList.toggle('is-flipped', S.flash.flipped);
}

function rateFlashCard(known){
  if(known){
    playSfx('correct');
    addScore(1);
  } else {
    playSfx('wrong');
  }

  S.flash.flipped = false;
  S.flash.idx = (S.flash.idx + 1) % S.flash.deck.length;
  render();
}

/* ==========================================================================
   2. MATCHING GAME (PAARE FINDEN)
   ========================================================================== */
function initMatchingGame(){
  const pool = shuffle(filterVocabByLevel(S.level)).slice(0, 8);
  const cards = [];

  pool.forEach(item => {
    cards.push({
      id: item.id,
      type: 'word',
      text: item.word,
      article: item.article,
      category: item.category,
      matched: false
    });
    cards.push({
      id: item.id,
      type: 'def',
      text: item.matchingShort,
      matched: false
    });
  });

  S.matching.pairs = shuffle(cards);
  S.matching.selectedCard = null;
  S.matching.matchedCount = 0;
  S.matching.moves = 0;
  S.matching.finished = false;
  render();
}

function renderMatchingView(app){
  app.innerHTML = `
    <div class="activity-container">
      <div class="act-header">
        <div class="act-title-box">
          <button class="back-btn" onclick="exitToHome()">← Zurück</button>
          <h2>🧩 Paare finden • Fachbegriffe &amp; Bedeutungen</h2>
        </div>
        <button class="pill" onclick="initMatchingGame()">🔄 Neu mischen</button>
      </div>

      ${renderGameBar()}

      <div class="matching-stats">
        <span>Gefundene Paare: <b>${S.matching.matchedCount / 2} von ${S.matching.pairs.length / 2}</b></span>
        <span>Züge: <b>${S.matching.moves}</b></span>
      </div>

      <div class="match-grid">
        ${S.matching.pairs.map((c, idx) => `
          <div class="match-card ${c.matched ? 'matched' : ''} ${S.matching.selectedCard === idx ? 'selected' : ''}" onclick="clickMatchCard(${idx})">
            <div>
              ${c.type === 'word' && c.article ? `<span class="article-pill ${getArticleClass(c)}" style="font-size:12px; margin-bottom:6px; display:inline-block;">${c.article}</span><br>` : ''}
              <span>${c.text}</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function clickMatchCard(idx){
  const card = S.matching.pairs[idx];
  if(card.matched || S.matching.selectedCard === idx) return;

  playSfx('click');

  if(S.matching.selectedCard === null){
    S.matching.selectedCard = idx;
    render();
  } else {
    S.matching.moves++;
    const firstIdx = S.matching.selectedCard;
    const first = S.matching.pairs[firstIdx];

    if(first.id === card.id && first.type !== card.type){
      // MATCH!
      first.matched = true;
      card.matched = true;
      S.matching.selectedCard = null;
      S.matching.matchedCount += 2;
      playSfx('correct');
      addScore(2);

      if(S.matching.matchedCount === S.matching.pairs.length){
        playSfx('fanfare');
        setTimeout(() => {
          alert(`🏆 Fantastisch! Du hast alle ${S.matching.pairs.length / 2} Paare in ${S.matching.moves} Zügen gefunden!`);
        }, 300);
      }
      render();
    } else {
      // FEHLER
      playSfx('wrong');
      const cards = document.querySelectorAll('.match-card');
      if(cards[firstIdx]) cards[firstIdx].classList.add('wrong');
      if(cards[idx]) cards[idx].classList.add('wrong');

      setTimeout(() => {
        S.matching.selectedCard = null;
        render();
      }, 700);
    }
  }
}

/* ==========================================================================
   3. CLOZE VIEW (LÜCKENTEXT)
   ========================================================================== */
function getClozeWordBank(idx){
  if(!S.cloze.shuffledBanks) S.cloze.shuffledBanks = {};
  if(!S.cloze.shuffledBanks[idx]){
    S.cloze.shuffledBanks[idx] = shuffle([...DATA.cloze[idx].wordBank]);
  }
  return S.cloze.shuffledBanks[idx];
}

function renderClozeView(app){
  const story = DATA.cloze[S.cloze.storyIdx];

  app.innerHTML = `
    <div class="activity-container">
      <div class="act-header">
        <div class="act-title-box">
          <button class="back-btn" onclick="exitToHome()">← Zurück</button>
          <h2>✍️ Merktexte • Lückentext aus dem Lehrwerk</h2>
        </div>
        <div style="font-weight:700; color:var(--ink-soft); font-size:15px;">
          Text ${S.cloze.storyIdx + 1} von ${DATA.cloze.length}
        </div>
      </div>

      ${renderGameBar()}

      <div class="cloze-story-select">
        ${DATA.cloze.map((s, idx) => `
          <button class="cloze-story-btn ${idx === S.cloze.storyIdx ? 'active' : ''}" onclick="selectClozeStory(${idx})">
            ${s.title}
          </button>
        `).join('')}
      </div>

      <div class="cloze-card">
        <div style="font-size:14px; font-weight:700; color:var(--accent); text-transform:uppercase; margin-bottom:8px;">
          ${story.subtitle}
        </div>
        <div>
          ${renderClozeStoryText(story)}
        </div>
      </div>

      <div class="word-bank-box">
        <div class="word-bank-title">Wortbank (Tippe auf ein Wort, um es in die markierte Lücke einzusetzen):</div>
        <div class="word-bank-chips">
          ${getClozeWordBank(S.cloze.storyIdx).map(w => `
            <button class="bank-chip" onclick="insertWordIntoBlank('${w}')">${w}</button>
          `).join('')}
        </div>
      </div>

      <div class="cloze-actions">
        <button class="pill" onclick="resetCloze()">↺ Zurücksetzen</button>
        <button class="primary-btn" onclick="checkClozeAnswers()">✓ Antworten prüfen</button>
      </div>

      ${S.cloze.checked ? `
        <div style="margin-top:16px; background:var(--card-2); border-left:4px solid var(--accent); padding:12px 16px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; font-size:15px;">
          <b>Erklärung:</b> ${story.explanation}
        </div>
      ` : ''}
    </div>
  `;
}

function renderClozeStoryText(story){
  let html = story.template;
  story.blanks.forEach((b, idx) => {
    const userVal = S.cloze.userAnswers[idx] || "";
    let statusClass = "";
    if(S.cloze.checked){
      statusClass = (userVal.toLowerCase() === b.toLowerCase()) ? "correct" : "wrong";
    } else if(S.cloze.activeBlankId === idx){
      statusClass = "active";
    }

    const span = `<span class="cloze-blank ${statusClass}" onclick="selectBlank(${idx})">${userVal ? userVal : '_____'}</span>`;
    html = html.replace(`{blank${idx}}`, span);
  });
  return html;
}

function selectClozeStory(idx){
  S.cloze.storyIdx = idx;
  S.cloze.activeBlankId = 0;
  S.cloze.userAnswers = {};
  S.cloze.checked = false;
  playSfx('click');
  render();
}

function selectBlank(idx){
  S.cloze.activeBlankId = idx;
  playSfx('click');
  render();
}

function insertWordIntoBlank(word){
  if(S.cloze.activeBlankId === null){
    const story = DATA.cloze[S.cloze.storyIdx];
    for(let i = 0; i < story.blanks.length; i++){
      if(!S.cloze.userAnswers[i]){
        S.cloze.activeBlankId = i;
        break;
      }
    }
  }
  if(S.cloze.activeBlankId === null) return;

  S.cloze.userAnswers[S.cloze.activeBlankId] = word;
  playSfx('click');

  const story = DATA.cloze[S.cloze.storyIdx];
  const nextEmpty = story.blanks.findIndex((_, i) => i > S.cloze.activeBlankId && !S.cloze.userAnswers[i]);
  S.cloze.activeBlankId = nextEmpty !== -1 ? nextEmpty : null;

  render();
}

function resetCloze(){
  S.cloze.userAnswers = {};
  S.cloze.activeBlankId = 0;
  S.cloze.checked = false;
  if(!S.cloze.shuffledBanks) S.cloze.shuffledBanks = {};
  S.cloze.shuffledBanks[S.cloze.storyIdx] = shuffle([...DATA.cloze[S.cloze.storyIdx].wordBank]);
  playSfx('click');
  render();
}

function checkClozeAnswers(){
  const story = DATA.cloze[S.cloze.storyIdx];
  let correctCount = 0;

  story.blanks.forEach((b, idx) => {
    if((S.cloze.userAnswers[idx] || "").toLowerCase() === b.toLowerCase()){
      correctCount++;
    }
  });

  S.cloze.checked = true;

  if(correctCount === story.blanks.length){
    playSfx('fanfare');
    addScore(story.blanks.length * 2);
    alert(`🎉 Perfekt gelöst! Alle ${correctCount} Lücken sind fehlerfrei ausgefüllt!`);
  } else {
    playSfx(correctCount > 0 ? 'correct' : 'wrong');
    addScore(correctCount);
  }
  render();
}

/* ==========================================================================
   4. QUIZ VIEW (STOLPERSTELLEN)
   ========================================================================== */
function initQuizQuestion(){
  const q = DATA.quiz[S.quiz.idx];
  S.quiz.shuffledOptions = shuffle(q.options.map((opt, i) => ({ ...opt, origIdx: i })));
  S.quiz.wrongAttempts = [];
  S.quiz.selectedOption = null;
  S.quiz.solved = false;
}

function formatQuizExplanation(text){
  if(!text) return "";
  const lines = text.split(/\\n|\r?\n/);
  return lines.map((rawLine, idx) => {
    const line = rawLine.trim();
    if(!line) return "";
    if(idx === 0 && line.includes('💡')){
      return `<div style="font-weight:700; color:var(--accent); font-size:16px; margin-bottom:6px;">${line}</div>`;
    }
    if(line.startsWith('•')){
      return `<div style="padding-left:14px; margin:4px 0;">${line}</div>`;
    }
    return `<div style="margin:4px 0;">${line}</div>`;
  }).join('');
}

function renderQuizView(app){
  const q = DATA.quiz[S.quiz.idx];
  if(!S.quiz.shuffledOptions || S.quiz.shuffledOptions.length === 0){
    initQuizQuestion();
  }

  app.innerHTML = `
    <div class="activity-container">
      <div class="act-header">
        <div class="act-title-box">
          <button class="back-btn" onclick="exitToHome()">← Zurück</button>
          <h2>🎯 Maßstabs-Quiz &amp; Stolperstellen</h2>
        </div>
        <div style="font-weight:700; color:var(--ink-soft);">
          Aufgabe ${S.quiz.idx + 1} von ${DATA.quiz.length} • Punkte: ${S.quiz.score}
        </div>
      </div>

      ${renderGameBar()}

      <div class="quiz-card">
        <div class="quiz-q-num">Aufgabe ${S.quiz.idx + 1}</div>
        <h3 class="quiz-q-title">${q.title}</h3>
        <div class="quiz-q-text">${q.text}</div>

        <div class="quiz-options">
          ${S.quiz.shuffledOptions.map((opt, optIdx) => {
            const isWrong = S.quiz.wrongAttempts.includes(optIdx);
            const isCorrect = S.quiz.solved && S.quiz.selectedOption === optIdx;
            let stateClass = "";
            let icon = "○";
            let disabledAttr = "";

            if(isCorrect){
              stateClass = "correct";
              icon = "✓";
              disabledAttr = "disabled";
            } else if(isWrong){
              stateClass = "wrong";
              icon = "✗";
              disabledAttr = "disabled";
            } else if(S.quiz.solved){
              disabledAttr = "disabled";
            }

            return `
              <button class="quiz-opt-btn ${stateClass}" onclick="answerQuiz(${optIdx})" ${disabledAttr}>
                <span style="font-size:20px; font-weight:bold;">${icon}</span>
                <span>${opt.text}</span>
              </button>
            `;
          }).join('')}
        </div>

        ${!S.quiz.solved && S.quiz.wrongAttempts.length > 0 ? `
          <div class="quiz-hint-box">
            <span>🤔</span>
            <span>Noch nicht ganz richtig! Überlege noch einmal genau und wähle eine andere Antwort.</span>
          </div>
        ` : ''}

        ${S.quiz.solved ? `
          <div class="quiz-explanation">
            ${formatQuizExplanation(q.explanation)}
          </div>
          <div style="margin-top:18px; text-align:right;">
            <button class="primary-btn" onclick="nextQuizQuestion()">
              ${S.quiz.idx + 1 < DATA.quiz.length ? 'Nächste Aufgabe ➔' : 'Quiz beenden 🏆'}
            </button>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function answerQuiz(optIdx){
  if(S.quiz.solved) return;
  const opt = S.quiz.shuffledOptions[optIdx];

  if(opt.correct){
    // Richtige Antwort ausgewählt!
    playSfx('correct');
    S.quiz.solved = true;
    S.quiz.selectedOption = optIdx;

    // Punktevergabe: 2 Punkte beim 1. Versuch, 1 Punkt wenn vorher Fehler
    const points = S.quiz.wrongAttempts.length === 0 ? 2 : 1;
    S.quiz.score += points;
    addScore(points);
  } else {
    // Falsche Antwort ausgewählt: Als falsch markieren, Erklärung noch NICHT zeigen!
    playSfx('wrong');
    if(!S.quiz.wrongAttempts.includes(optIdx)){
      S.quiz.wrongAttempts.push(optIdx);
    }
  }
  render();
}

function nextQuizQuestion(){
  playSfx('click');
  if(S.quiz.idx + 1 < DATA.quiz.length){
    S.quiz.idx++;
    initQuizQuestion();
    render();
  } else {
    playSfx('fanfare');
    alert(`🎉 Großartig! Du hast alle Stolperstellen geknackt und ${S.quiz.score} von ${DATA.quiz.length * 2} Punkten erreicht!`);
    exitToHome();
  }
}

/* ==========================================================================
   5. LEXIKON / WORTSPEICHER
   ========================================================================== */
function openLexikon(){
  playSfx('click');
  S.showLexikon = true;
  render();
}

function renderLexikonView(app){
  const term = S.lexikonSearch.toLowerCase();
  const list = DATA.vocab.filter(v => {
    const matchCat = (S.lexikonCategory === 'all' || v.category === S.lexikonCategory);
    const matchSearch = v.word.toLowerCase().includes(term) || v.def.toLowerCase().includes(term) || (v.example && v.example.toLowerCase().includes(term));
    return matchCat && matchSearch;
  });

  app.innerHTML = `
    <div class="activity-container">
      <div class="act-header">
        <div class="act-title-box">
          <button class="back-btn" onclick="exitToHome()">← Zurück</button>
          <h2>📚 Fachlexikon &amp; Wortspeicher (Maßstab)</h2>
        </div>
        <div style="font-weight:700; color:var(--ink-soft);">
          ${list.length} Begriffe
        </div>
      </div>

      <div class="lexikon-head">
        <input type="text" class="lex-search-input" placeholder="🔍 Begriff oder Erklärung suchen..." value="${S.lexikonSearch}" oninput="searchLexikon(this.value)">
        <div class="pills">
          <button class="pill ${S.lexikonCategory === 'all' ? 'level-einfach' : ''}" onclick="setLexCategory('all')">Alle (${DATA.vocab.length})</button>
          <button class="pill ${S.lexikonCategory === 'nomen' ? 'level-einfach' : ''}" onclick="setLexCategory('nomen')">Nomen (der/die/das)</button>
          <button class="pill ${S.lexikonCategory === 'verb' ? 'level-einfach' : ''}" onclick="setLexCategory('verb')">Verben</button>
          <button class="pill ${S.lexikonCategory === 'adjektiv' ? 'level-einfach' : ''}" onclick="setLexCategory('adjektiv')">Adjektive</button>
        </div>
      </div>

      <div class="lex-grid">
        ${list.map(v => `
          <div class="lex-card">
            <div>
              <div class="lex-card-top">
                <span class="article-pill ${getArticleClass(v)}">${v.article ? v.article.toUpperCase() : v.category.toUpperCase()}</span>
                <button class="speak-btn" onclick="speakGerman('${v.word}. ${v.def}')">🔊 Vorlesen</button>
              </div>
              <div class="lex-word">${v.word}</div>
              <div class="lex-plural">${v.plural || ''}</div>
              <div class="lex-def" style="margin-top:8px;">${v.def}</div>
              <div style="font-style:italic; font-size:14px; color:var(--ink-soft); margin-top:6px;">„${v.example}“</div>
            </div>
            <div class="lex-tip">💡 Tipp: ${v.tip}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function searchLexikon(q){
  S.lexikonSearch = q;
  render();
}

function setLexCategory(cat){
  S.lexikonCategory = cat;
  playSfx('click');
  render();
}

function toggleTheme(){
  S.theme = (S.theme === 'dark' ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', S.theme);
  playSfx('click');
  render();
}

function toggleSound(){
  S.sound = !S.sound;
  playSfx('click');
  render();
}

// Initialer Start
window.addEventListener("DOMContentLoaded", () => {
  render();
});
</script>
</body>
</html>
