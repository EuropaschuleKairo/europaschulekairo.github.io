<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StyleArena: Stylistic Devices in English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap">
<style>
:root{
  --paper:#f8f6f0; /* Plain soft off-white background */
  --ink:#1f1914; --ink-soft:#615549; --line:#dcd5c7;
  --card:#ffffff; --card-2:#f0ebe0;
  --accent:#892034; --accent-ink:#ffffff;
  --marker:#fde880; --marker-ink:#1f1914;
  --ok:#1b6b3e; --ok-bg:#e7f5ed; --bad:#a32828; --bad-bg:#fde8e8; --warn:#ab6106; --warn-bg:#fdf2df;
  --t1:#1e3a5f; --t2:#892034; --t3:#205e3b; --t4:#622a68;
  --step1:#1e3a5f; --step2:#205e3b; --step3:#622a68;
  --shadow:0 3px 12px rgba(31,25,20,.05), 0 1px 3px rgba(31,25,20,.03);
  --display:"Playfair Display","Cinzel",Georgia,"Times New Roman",serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#14171e;
    --ink:#f2ede4; --ink-soft:#a39b8c; --line:#2f3747;
    --card:#1c212b; --card-2:#242a38;
    --accent:#d67d3e; --accent-ink:#12151b;
    --marker:#e5b842; --marker-ink:#12151b;
    --ok:#34d399; --ok-bg:#093826; --bad:#f87171; --bad-bg:#3d0d12; --warn:#fbbf24; --warn-bg:#3d2407;
    --t1:#7aa2f7; --t2:#f7768e; --t3:#73daca; --t4:#bb9af7;
    --step1:#7aa2f7; --step2:#73daca; --step3:#bb9af7;
    --shadow:0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#14171e;
  --ink:#f2ede4; --ink-soft:#a39b8c; --line:#2f3747;
  --card:#1c212b; --card-2:#242a38;
  --accent:#d67d3e; --accent-ink:#12151b;
  --marker:#e5b842; --marker-ink:#12151b;
  --ok:#34d399; --ok-bg:#093826; --bad:#f87171; --bad-bg:#3d0d12; --warn:#fbbf24; --warn-bg:#3d2407;
  --t1:#7aa2f7; --t2:#f7768e; --t3:#73daca; --t4:#bb9af7;
  --step1:#7aa2f7; --step2:#73daca; --step3:#bb9af7;
  --shadow:0 4px 16px rgba(0,0,0,.35);
}

html,body{min-height:100%; box-sizing:border-box}
body{
  margin:0; font-family:var(--body); color:var(--ink); font-size:18px; line-height:1.55;
  background-color:var(--paper);
  background-image:none !important; /* Plain off-white, no lines */
}
.wrap{max-width:1320px; margin:0 auto; padding-inline:clamp(16px,3vw,40px); padding-block:20px 48px}
button{font-family:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3,h4{margin:0; text-wrap:balance}

/* Home */
.home-head{
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px 32px;
  padding-block:12px 24px; border-bottom:2px solid var(--line); margin-bottom:28px;
}
.brand h1{
  font-family:var(--display); font-weight:700; font-size:clamp(32px,4.5vw,54px); letter-spacing:.5px; line-height:1.15;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand h1 span{background:linear-gradient(transparent 58%, var(--marker) 58%); padding-inline:6px}
.brand p{margin:10px 0 0; color:var(--ink-soft); max-width:70ch; font-size:17.5px}
.uk-flag{
  border-radius:4px; box-shadow:0 2px 6px rgba(0,0,0,.22); vertical-align:middle; display:inline-block; flex:none;
}
.steps-overview{
  display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center;
}
.step-badge{
  font-size:13px; font-weight:700; padding:5px 14px; border-radius:999px;
  display:inline-flex; align-items:center; gap:6px; letter-spacing:.02em; font-family:var(--body);
}
.step-badge.s1{background:color-mix(in srgb, var(--step1) 12%, var(--card)); color:var(--step1); border:1.5px solid var(--step1)}
.step-badge.s2{background:color-mix(in srgb, var(--step2) 12%, var(--card)); color:var(--step2); border:1.5px solid var(--step2)}
.step-badge.s3{background:color-mix(in srgb, var(--step3) 12%, var(--card)); color:var(--step3); border:1.5px solid var(--step3)}
.scope-indicator{
  font-size:13.5px; font-weight:700; color:var(--accent); background:var(--card); border:1.5px solid var(--accent);
  padding:4px 14px; border-radius:999px; display:inline-flex; align-items:center; gap:6px;
}

.settings{display:flex; flex-wrap:wrap; gap:16px; align-items:center}
.seg{display:flex; flex-direction:column; gap:6px}
.seg-label{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); font-weight:700; font-family:var(--display)}
.seg-btns{display:flex; background:var(--card); border:2px solid var(--line); border-radius:12px; padding:3px; gap:3px}
.seg-btns button{border:0; background:transparent; padding:7px 14px; border-radius:9px; font-size:15px; font-weight:700}
.seg-btns button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

.games{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:20px}
.gcard{
  display:flex; flex-direction:column; gap:12px; text-align:left; background:var(--card);
  border:2px solid var(--line); border-top:5px solid var(--accent); border-radius:14px; padding:22px 20px 18px;
  box-shadow:var(--shadow); transition:transform .18s, border-color .18s, box-shadow .18s; position:relative; overflow:hidden;
}
.gcard:hover{
  transform:translateY(-3px); border-color:var(--accent);
  box-shadow:0 8px 24px rgba(31,25,20,.1);
}
.gcard[data-step="1"]{border-top-color:var(--step1)}
.gcard[data-step="2"]{border-top-color:var(--step2)}
.gcard[data-step="3"]{border-top-color:var(--step3)}

.gcard .top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.gcard h2{font-family:var(--display); font-weight:700; font-size:25px; letter-spacing:.2px}
.gcard p{margin:0; color:var(--ink-soft); font-size:16px; line-height:1.45}
.gcard .meta{margin-top:auto; display:flex; gap:6px; flex-wrap:wrap; padding-top:4px}
.chip{
  font-size:12px; font-weight:700; padding:4px 11px; border-radius:99px;
  background:var(--card-2); color:var(--ink-soft); border:1px solid var(--line);
}
.chip.s1{background:var(--step1); color:#fff; border-color:transparent}
.chip.s2{background:var(--step2); color:#fff; border-color:transparent}
.chip.s3{background:var(--step3); color:#fff; border-color:transparent}
.chip.k{background:var(--marker); color:var(--marker-ink); border-color:transparent}
.chip.accessible{background:#e3f2fd; color:#1565c0; border-color:#90caf9}
.chip.advanced{background:#f3e5f5; color:#7b1fa2; border-color:#ce93d8}

/* Communicative Game Badge Icons */
.gicon{
  padding:5px 11px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center;
  gap:6px; font-family:var(--display); font-size:14px; font-weight:700;
  background:var(--card-2); color:var(--ink); flex:none; border:1.5px solid var(--line);
  letter-spacing:.02em; white-space:nowrap;
}
.gicon .gi-sym{font-size:18px}
.gicon .gi-txt{font-size:13px; text-transform:uppercase; letter-spacing:.05em}

/* Catalog Drawer / Table */
.catalog-section{
  margin-top:28px; background:var(--card); border:2px solid var(--line); border-radius:16px;
  padding:20px 24px; box-shadow:var(--shadow);
}
.catalog-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px}
.catalog-head h3{font-family:var(--display); font-size:24px; color:var(--accent)}
.catalog-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px}
.cat-card{
  background:var(--card-2); border:1.5px solid var(--line); border-radius:12px; padding:14px 16px;
  text-align:left; display:flex; flex-direction:column; gap:6px;
}
.cat-card .ctop{display:flex; justify-content:space-between; align-items:center; gap:8px}
.cat-card h4{font-family:var(--display); font-size:19px; color:var(--ink)}
.cat-card .cdef{font-size:14.5px; color:var(--ink); line-height:1.4}
.cat-card .cex{font-size:14px; font-style:italic; color:var(--ink-soft); margin-top:auto; padding-top:4px; border-top:1px dashed var(--line)}

.note{
  margin-top:28px; background:var(--card); border:2px dashed var(--line); border-radius:14px;
  padding:18px 22px; color:var(--ink-soft); font-size:16.5px; line-height:1.55; box-shadow:0 2px 6px rgba(0,0,0,.03);
}
.note b{color:var(--ink)}

/* Gameplay Bar */
.gbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10; display:flex; flex-wrap:wrap;
  align-items:center; gap:12px 18px; padding-block:12px; background:var(--paper);
  border-bottom:2px solid var(--line); margin-bottom:16px;
}
.gbar h2{font-family:var(--display); font-weight:700; font-size:28px; flex:1 1 auto; display:flex; align-items:center; gap:10px}
.btn{
  border:2px solid var(--line); background:var(--card); border-radius:12px; padding:9px 16px;
  font-size:17px; font-weight:700; box-shadow:0 2px 0 var(--line); transition:background .1s, transform .1s;
}
.btn:active{transform:translateY(2px); box-shadow:none}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.big{font-size:19px; padding:12px 26px; border-radius:14px}
.btn.accent3{background:var(--step3); color:#fff; border-color:var(--step3)}
.timer{display:flex; align-items:center; gap:6px}
.timer .t{font-family:var(--display); font-size:30px; min-width:3ch; text-align:center; font-variant-numeric:tabular-nums}
.timer .t.run{color:var(--accent)} .timer .t.end{color:var(--bad); animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:scale(1)} to{transform:scale(1.15)}}

/* Teams */
.teams{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px}
.team{
  display:flex; align-items:center; gap:8px; background:var(--card); border:2px solid var(--line);
  border-left:6px solid var(--tc); border-radius:12px; padding:7px 12px 7px 14px;
  box-shadow:0 2px 6px rgba(0,0,0,.03);
}
.team.active{border-color:var(--tc); box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 25%, transparent)}
.team .nm{font-weight:700; color:var(--tc); font-size:17.5px; background:none; border:0; padding:0; text-align:left; font-family:var(--display)}
.team .sc{font-family:var(--display); font-size:28px; min-width:2ch; text-align:center; font-variant-numeric:tabular-nums}
.team .pm{width:36px; height:36px; border-radius:10px; border:2px solid var(--line); background:var(--card-2); font-size:20px; font-weight:700}
.team .pm.plus{background:var(--tc); color:#fff; border-color:var(--tc)}
.turn{font-size:15px; color:var(--ink-soft); align-self:center}


.solo-team{padding:8px 18px; border-left-color:var(--accent); font-weight:700}
.solo-hint{font-size:15px; color:var(--ink-soft); font-style:italic; align-self:center}

/* Stage */
.stage{
  background:var(--card); border:2px solid var(--line); border-radius:20px; box-shadow:0 6px 24px rgba(31,25,20,.06);
  min-height:min(55vh,520px); padding:clamp(20px,3.5vw,44px); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:22px; text-align:center; position:relative;
}
.stage .how{position:absolute; top:14px; left:20px; right:20px; font-size:15px; color:var(--ink-soft); text-align:left}
.stage .stage-step{position:absolute; top:14px; right:20px; display:flex; gap:6px}
.counter{position:absolute; bottom:12px; right:20px; font-size:14px; color:var(--ink-soft)}
.controls{
  position:sticky; bottom:0; z-index:9; display:flex; flex-wrap:wrap; justify-content:center;
  gap:12px; margin-top:12px; padding-block:10px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--paper);
}

/* Help Drawer */
.help{
  margin-top:18px; background:var(--card); border:2px dashed var(--accent); border-radius:16px; padding:16px 22px;
}
.help h3{font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin-bottom:8px; font-family:var(--display)}
.help ul{margin:0; padding-left:1.2em; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:6px 28px; font-size:17.5px}

/* Content Elements */
.huge{font-family:var(--display); font-weight:700; font-size:clamp(38px,6.5vw,78px); line-height:1.1; overflow-wrap:anywhere}
.quote-box{
  font-size:clamp(22px,3vw,36px); line-height:1.4; font-style:italic; max-width:38ch; font-weight:600;
  position:relative; padding-inline:16px;
}
.quote-box::before{content:"“"; color:var(--accent); font-size:1.5em; line-height:0; vertical-align:-.3em; margin-right:4px; font-family:Georgia,serif}
.quote-box::after{content:"”"; color:var(--accent); font-size:1.5em; line-height:0; vertical-align:-.3em; margin-left:4px; font-family:Georgia,serif}
.author-tag{font-size:17px; font-style:normal; font-weight:400; color:var(--ink-soft); margin-top:8px; font-family:var(--display); letter-spacing:.03em}
.large{font-weight:700; font-size:clamp(24px,3.4vw,38px); line-height:1.3; max-width:32ch}
.mid{font-size:clamp(19px,2.3vw,26px); line-height:1.4; max-width:40ch}
.muted{color:var(--ink-soft)}
.mark{background:var(--marker); color:var(--marker-ink); border-radius:6px; padding:2px 8px; font-weight:700}
.reveal{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.97); opacity:.3} to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none} .gcard{transition:none}}

/* Clues */
.clues{display:flex; flex-direction:column; gap:12px; width:100%; max-width:920px}
.clue{
  display:flex; gap:14px; align-items:flex-start; text-align:left; background:var(--card-2);
  border-radius:14px; padding:14px 18px; font-size:clamp(19px,2.3vw,26px);
}
.clue .n{font-family:var(--display); font-weight:700; color:var(--accent); font-size:1.15em; flex:none; width:1.4em}
.clue.hidden{color:transparent; background:repeating-linear-gradient(45deg,var(--card-2) 0 12px,transparent 12px 24px); border:2px dashed var(--line)}
.clue.hidden .n{color:var(--ink-soft)}
.pts{font-size:16px; color:var(--ink-soft); font-weight:700; font-family:var(--display)}

/* Verdict & Explanations */
.verdict{font-family:var(--display); font-size:clamp(34px,5vw,60px); padding:6px 28px; border-radius:18px; font-weight:700}
.verdict.ok{color:var(--ok); background:var(--ok-bg)}
.verdict.no{color:var(--bad); background:var(--bad-bg)}
.fix{font-size:clamp(19px,2.3vw,26px); max-width:42ch; line-height:1.4}
.fix b{color:var(--ok)}

/* Interactive Sentence Tiles */
.tiles{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:1050px}
.tile{
  font-size:clamp(18px,2.2vw,28px); font-weight:700; padding:10px 18px; border-radius:12px;
  border:3px solid var(--line); background:var(--card-2); box-shadow:0 3px 0 var(--line); text-align:left;
}
.tile.used{visibility:hidden}
.answer-line{
  min-height:86px; width:100%; max-width:1100px; border-bottom:4px solid var(--ink-soft);
  display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:flex-end; padding-bottom:12px;
}
.answer-line .tile{background:var(--card); border-color:var(--accent)}
.answer-line.ok .tile{border-color:var(--ok); background:var(--ok-bg)}
.answer-line.alt .tile{border-color:var(--warn); background:var(--warn-bg)}
.fb{font-size:20px; font-weight:700; min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.alt{color:var(--warn)}

/* Models & Analysis Cards */
.model{
  background:var(--card-2); border-left:6px solid var(--accent); color:var(--ink);
  border-radius:16px; padding:18px 24px; font-size:clamp(19px,2.2vw,26px); max-width:48ch; text-align:left;
}
.model.ok{border-color:var(--ok); background:var(--ok-bg)}
.model.purple{border-color:var(--step3); background:color-mix(in srgb, var(--step3) 8%, var(--card))}
.model p{margin:6px 0}
.model .lb{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:700}
.model.purple .lb{color:var(--step3)}

/* Context & Quote Card */
.ctx-card{
  background:var(--card);
  border:2px solid var(--line);
  border-left:6px solid var(--accent);
  border-radius:14px;
  padding:16px 20px;
  text-align:left;
  margin-bottom:16px;
  width:100%;
  max-width:960px;
  box-shadow:0 4px 14px rgba(0,0,0,0.04);
}
.ctx-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px}
.ctx-header .lb{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--accent)}
.ctx-header .source{font-size:14px; font-weight:700; color:var(--ink-soft)}
.ctx-desc{font-size:16px; color:var(--ink); line-height:1.45; margin-bottom:10px}
.ctx-quote{
  font-family:var(--display);
  font-size:clamp(17px,2vw,21px);
  font-style:italic;
  color:var(--ink);
  background:var(--card-2);
  padding:12px 18px;
  border-radius:10px;
  border-left:4px solid var(--step1);
  margin:0;
  line-height:1.45;
}
.ctx-quote mark{background:#fef08a; padding:2px 5px; border-radius:4px; font-weight:700; font-style:normal}

/* Assembled Sentence Preview Box */
.sentence-preview{
  width:100%;
  max-width:960px;
  background:#fff;
  border:2px solid var(--step3);
  border-radius:14px;
  padding:18px 22px;
  text-align:left;
  font-size:clamp(19px,2.2vw,24px);
  line-height:1.5;
  color:var(--ink);
  box-shadow:0 4px 14px rgba(0,0,0,0.04);
  margin-bottom:16px;
  position:relative;
}
.sp-chunk{padding:2px 6px; border-radius:6px; font-weight:600; display:inline}
.sp-1{color:var(--step1); background:color-mix(in srgb, var(--step1) 12%, transparent)}
.sp-2{color:var(--t2); background:color-mix(in srgb, var(--t2) 12%, transparent)}
.sp-3{color:var(--step2); background:color-mix(in srgb, var(--step2) 12%, transparent)}
.sp-4{color:var(--step3); background:color-mix(in srgb, var(--step3) 12%, transparent)}
.sp-blank{color:var(--ink-soft); font-style:italic; border-bottom:2px dashed var(--line)}

/* Evaluation feedback box */
.eval-card{
  width:100%;
  max-width:960px;
  border-radius:14px;
  padding:16px 20px;
  text-align:left;
  margin-bottom:16px;
}
.eval-ok{
  background:var(--ok-bg);
  border:2px solid var(--ok);
}
.eval-err{
  background:#fff7ed;
  border:2px solid #ea580c;
}
.eval-card .eval-title{
  font-weight:700;
  font-size:18px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.eval-err .eval-title{color:#c2410c}
.eval-ok .eval-title{color:#15803d}
.eval-list{margin:0; padding-left:20px; font-size:16px; line-height:1.5}
.eval-list li{margin-bottom:6px}

/* Sentence Builder 4-Slot Grid */
.builder-grid{
  display:flex;
  flex-direction:column;
  gap:14px;
  width:100%;
  max-width:960px;
  text-align:left;
  margin-bottom:18px;
}
.builder-slot{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  transition:border-color .15s ease;
}
.builder-slot.active{border-color:var(--accent)}
.slot-title{
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.07em;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.slot-badge{
  font-size:11px;
  padding:3px 8px;
  border-radius:6px;
  font-weight:700;
  color:#fff;
}
.sbadge-1{background:var(--step1)}
.sbadge-2{background:var(--t2)}
.sbadge-3{background:var(--step2)}
.sbadge-4{background:var(--step3)}

.slot-options{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.opt-btn{
  display:flex;
  align-items:flex-start;
  gap:10px;
  width:100%;
  text-align:left;
  background:var(--card-2);
  border:2px solid var(--line);
  border-radius:10px;
  padding:10px 14px;
  font-family:inherit;
  font-size:16px;
  line-height:1.4;
  color:var(--ink);
  cursor:pointer;
  transition:all .15s ease;
}
.opt-btn:hover{background:#fff; border-color:var(--accent)}
.opt-btn.chosen{
  background:#fff;
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);
  font-weight:600;
}
.opt-radio{
  display:inline-block;
  width:18px;
  height:18px;
  border:2px solid var(--line);
  border-radius:50%;
  margin-top:2px;
  flex-shrink:0;
  position:relative;
}
.opt-btn.chosen .opt-radio{
  border-color:var(--accent);
  background:var(--accent);
  box-shadow:inset 0 0 0 3px #fff;
}

.chip.easy{background:#dcfce7; color:#15803d; border:1px solid #86efac}
.chip.advanced{background:#dbeafe; color:#1d4ed8; border:1px solid #93c5fd}
.chip.pro{background:#f3e8ff; color:#7e22ce; border:1px solid #d8b4fe}
.chip.accessible{background:#dcfce7; color:#15803d; border:1px solid #86efac}

/* Gestures */
.gestures{display:flex; flex-wrap:wrap; gap:14px; justify-content:center}
.gest{border:3px solid currentColor; border-radius:16px; padding:10px 20px; min-width:140px}
.gest b{display:block; font-family:var(--display); font-weight:700; font-size:32px}
.gest span{font-size:16px; color:var(--ink)}

@media (max-width:640px){
  body{font-size:16px}
  .stage{min-height:420px; padding:16px}
  .help ul{font-size:16px}
}
</style>

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = a => {
  const c = a.slice();
  for(let i = c.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function mixed(p){
  let m; let tries = 0;
  do {
    m = shuffle(p);
    tries++;
  } while(tries < 25 && m.every((x, i) => x === p[i]));
  return m;
}

  app.querySelectorAll("[data-scope]").forEach(b => b.onclick = () => {
    S.scope = b.dataset.scope;
    store.set("sa-scope", S.scope);
    renderHome();
  });
  app.querySelectorAll("[data-tier]").forEach(b => b.onclick = () => {
    S.tier = b.dataset.tier;
    store.set("sa-tier", S.tier);
    renderHome();
  });
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
    S.nTeams = +b.dataset.n;
    if(S.nTeams === 1){
      S.names[0] = "Solo Scholar";
      S.active = 0;
    } else {
      S.names[0] = "House Shakespeare";
    }
    store.set("sa-teams", S.nTeams);
    renderHome();
  });
  app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => startGame(b.dataset.g));

  const togCat = document.getElementById("tog-cat");
  if(togCat){
    togCat.onclick = () => {
      S.showCatalog = !S.showCatalog;
      renderHome();
    };
  }
}

/* ==========================================================================
   VIEW: GAME
   ========================================================================== */
function startGame(id){
  S.game = GAMES.find(g => g.id === id);
  S.view = "game";
  S.count = 0;
  if(S.game.gen){
    S.deck = null;
  } else {
    S.deck = S.game.deck();
    S.idx = -1;
  }
  nextItem(true);
  window.scrollTo(0, 0);
}

function nextItem(first){
  if(!first && S.nTeams > 1){
    S.active = (S.active + 1) % S.nTeams;
  } else if(S.nTeams === 1){
    S.active = 0;
  }
  S.step = 0;
  S.count++;
  if(S.game.gen){
    S.item = S.game.gen();
  } else {
    S.idx++;
    if(S.idx >= S.deck.length){
      S.deck = S.game.deck();
      S.idx = 0;
    }
    S.item = S.deck[S.idx];
    if(S.game.id === "puzzle"){
      S.item.sel = [];
      S.item.mix = mixed(S.item.p);
    }
  }
  renderGame();
}

function maxStep(){
  return S.game.steps || 1;
}

function renderGame(){
  const g = S.game;
  const teams = Array.from({ length: S.nTeams }, (_, i) => `
    <div class="team ${i === S.active ? 'active' : ''}" style="--tc:${TEAMCOL[i]}">
      <button class="nm" data-act="${i}" title="Set active house">${S.names[i]}</button>
      <button class="pm" data-minus="${i}" aria-label="${S.names[i]} minus 1">−</button>
      <span class="sc" aria-live="polite">${S.scores[i]}</span>
      <button class="pm plus" data-plus="${i}" aria-label="${S.names[i]} plus 1">+</button>
    </div>
  `).join("");

  const ms = maxStep();
  const total = g.gen ? "" : `Card ${S.idx + 1} of ${S.deck.length}`;

  app.innerHTML = `
    <div class="gbar">
      <button class="btn" id="home">← Overview</button>
      <h2>${UK_FLAG} <span>${g.name}</span></h2>
      <div class="timer">
        <button class="btn" data-t="30">30 s</button>
        <button class="btn" data-t="60">60 s</button>
        <span class="t ${S.timer ? 'run' : ''} ${S.tleft === 0 && S.timerDone ? 'end' : ''}" id="tdisp">
          ${S.timer || S.timerDone ? S.tleft : '–'}
        </span>
      </div>
      <button class="btn" id="fs" title="Fullscreen">⛶</button>
    </div>

    <div class="teams ${S.nTeams === 1 ? 'solo-bar' : ''}">
      ${S.nTeams === 1 ? `
        <div class="team active solo-team" style="--tc:var(--accent)">
          <span class="nm">👤 Solo Practice</span>
          <button class="pm" data-minus="0" aria-label="Minus 1">−</button>
          <span class="sc" aria-live="polite">${S.scores[0]} pts</span>
          <button class="pm plus" data-plus="0" aria-label="Plus 1">+</button>
        </div>
        <span class="turn solo-hint">🎯 <b>Self-Paced Practice:</b> Solve challenges alone and track your score!</span>
      ` : `
        ${teams}
        <span class="turn">Active Turn: <b style="color:${TEAMCOL[S.active]}">${S.names[S.active]}</b></span>
      `}
    </div>

    <section class="stage" id="stage">
      <div class="how">${g.how}</div>
      <div class="stage-step"><span class="chip ${g.step === '1' ? 's1' : g.step === '2' ? 's2' : 's3'}">${g.tag}</span></div>
      ${g.render(S.item, S.step)}
      <div class="counter">${total}</div>
    </section>

    <div class="controls">
      ${S.step < ms ? `
        <button class="btn big primary" id="rev">
          ${g.id === "riddle" && S.step < 2 ? "Next Clue" : g.id === "riddle" ? "Reveal Device" : "Reveal Answer"}
        </button>
      ` : ""}
      <button class="btn big ${S.step >= ms ? 'primary' : ''}" id="next">Next Card →</button>
      <button class="btn big" id="hlp">${S.help ? "Hide Sentence Help" : "Show Sentence Help"}</button>
    </div>

    ${S.help ? `
      <aside class="help">
        <h3>Academic Sentence Scaffolding & Analytical Phrases</h3>
        <ul>
          ${g.help.map(h => `<li>${esc(h)}</li>`).join("")}
          <li><b>Analytical verbs:</b> illustrates, underscores, accentuates, evokes, exposes, crystalizes.</li>
          <li><b>Effect on reader:</b> prompts the reader to reflect on …, evokes empathy for …, exposes hypocrisy.</li>
        </ul>
      </aside>
    ` : ""}
  `;

  bindGame();
}

function bindGame(){
  const $ = id => document.getElementById(id);
  $("home").onclick = () => { stopTimer(); S.view = "home"; renderHome(); };
  $("next").onclick = () => nextItem(false);
  const r = $("rev");
  if(r) r.onclick = () => { S.step++; renderGame(); };
  $("hlp").onclick = () => { S.help = !S.help; renderGame(); };
  $("fs").onclick = () => {
    try {
      if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    } catch(e){}
  };

  app.querySelectorAll("[data-plus]").forEach(b => b.onclick = () => { S.scores[+b.dataset.plus]++; renderGame(); });
  app.querySelectorAll("[data-minus]").forEach(b => b.onclick = () => {
    const i = +b.dataset.minus;
    S.scores[i] = Math.max(0, S.scores[i] - 1);
    renderGame();
  });
  app.querySelectorAll("[data-act]").forEach(b => b.onclick = () => { S.active = +b.dataset.act; renderGame(); });
  app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => startTimer(+b.dataset.t));

  if(S.game.id === "puzzle"){
    app.querySelectorAll("[data-tile]").forEach(b => b.onclick = () => {
      const i = +b.dataset.tile;
      if(!S.item.sel.includes(i)){
        S.item.sel.push(i);
        renderGame();
      }
    });
    app.querySelectorAll("[data-back]").forEach(b => b.onclick = () => {
      S.item.sel.splice(+b.dataset.back, 1);
      renderGame();
    });
    const rs = app.querySelector("[data-reset]");
    if(rs) rs.onclick = () => { S.item.sel = []; renderGame(); };
  }

  if(S.game.id === "studio"){
    const it = S.item;
    // Difficulty filter
    app.querySelectorAll("[data-sblvl]").forEach(btn => {
      btn.onclick = () => {
        S.sbLevel = btn.dataset.sblvl;
        store.set("sa-sblevel", S.sbLevel);
        S.deck = S.game.deck();
        S.idx = 0;
        S.item = S.deck[0] || null;
        renderGame();
        window.scrollTo(0, 0);
      };
    });

    // Slot choices
    app.querySelectorAll("[data-sb-slot]").forEach(btn => {
      btn.onclick = () => {
        const slotIdx = +btn.dataset.sbSlot;
        const optIdx = +btn.dataset.sbOpt;
        it.choices[slotIdx] = optIdx;
        it.checked = false;
        renderGame();
      };
    });

    // Check sentence
    const checkBtn = app.querySelector("[data-sb-check]");
    if(checkBtn){
      checkBtn.onclick = () => {
        it.checked = true;
        const allCorrect = it.slots.every((s, i) => it.choices[i] !== null && s.options[it.choices[i]].correct);
        if(allCorrect && it.status !== "correct"){
          it.status = "correct";
          S.scores[S.active] += 3;
          beep();
        } else if(!allCorrect){
          it.status = "incorrect";
        }
        renderGame();
      };
    }

    // Reset choices
    const resetBtn = app.querySelector("[data-sb-reset]");
    if(resetBtn){
      resetBtn.onclick = () => {
        it.choices = [null, null, null, null];
        it.checked = false;
        it.status = "untested";
        renderGame();
      };
    }

    // Reveal model
    const revealBtn = app.querySelector("[data-sb-reveal]");
    if(revealBtn){
      revealBtn.onclick = () => {
        it.revealed = !it.revealed;
        renderGame();
      };
    }

    // Copy sentence
    const copyBtn = $("copy-btn");
    const copyTarget = $("copy-target");
    if(copyBtn && copyTarget){
      copyBtn.onclick = () => {
        const txt = copyTarget.innerText.trim();
        navigator.clipboard.writeText(txt).then(() => {
          copyBtn.textContent = "✅ Copied to Clipboard!";
          setTimeout(() => { copyBtn.textContent = "📋 Copy Sentence"; }, 2000);
        }).catch(() => {});
      };
    }

    // Navigation
    const prevBtn = app.querySelector("[data-sb-prev]");
    if(prevBtn){
      prevBtn.onclick = () => {
        if(S.idx > 0){
          S.idx--;
          S.item = S.deck[S.idx];
          renderGame();
          window.scrollTo(0, 0);
        }
      };
    }
    const nextBtn = app.querySelector("[data-sb-next]");
    if(nextBtn){
      nextBtn.onclick = () => nextItem(false);
    }
  }}

/* ==========================================================================
   TIMER & AUDIO FEEDBACK
   ========================================================================== */
let actx = null;
function beep(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22, 0.44].forEach(t => {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.frequency.value = 880;
      o.connect(g);
      g.connect(actx.destination);
      g.gain.setValueAtTime(0.2, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t + 0.18);
      o.start(actx.currentTime + t);
      o.stop(actx.currentTime + t + 0.2);
    });
  } catch(e){}
}

function startTimer(sec){
  stopTimer();
  S.tleft = sec;
  S.timerDone = false;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  S.timer = setInterval(() => {
    S.tleft--;
    const d = document.getElementById("tdisp");
    if(S.tleft <= 0){
      S.tleft = 0;
      stopTimer();
      S.timerDone = true;
      beep();
    }
    if(d){
      d.textContent = S.tleft;
      d.className = "t " + (S.timer ? "run" : "end");
    }
  }, 1000);
  const d = document.getElementById("tdisp");
  if(d){ d.textContent = sec; d.className = "t run"; }
}

function stopTimer(){
  if(S.timer){
    clearInterval(S.timer);
    S.timer = null;
  }
}

/* ==========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================== */
document.addEventListener("keydown", e => {
  if(S.view !== "game") return;
  if(e.key === "ArrowRight"){
    nextItem(false);
  } else if(e.key === " "){
    e.preventDefault();
    if(S.step < maxStep()){
      S.step++;
      renderGame();
    }
  }
});

/* Init */
renderHome();


})();
</script>
</body>
</html>
