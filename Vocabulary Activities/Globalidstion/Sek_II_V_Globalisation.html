<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GlobalVocab Arena: Sek II Globalisation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg: #f6f8fb;
  --bg-card: #ffffff;
  --bg-card-subtle: #f0f4f9;
  --bg-card-hover: #eaf1fa;
  --ink: #0f1c2e;
  --ink-soft: #52637a;
  --ink-muted: #7d8ea6;
  --line: #d8e2ee;
  --line-strong: #baccdc;

  /* Globalisation Brand Theme */
  --globe-navy: #0d2a4a;
  --globe-blue: #1e5ba3;
  --globe-cyan: #0284c7;
  --eco-emerald: #107e54;
  --eco-light: #e6f7ef;
  --solar-amber: #d97706;
  --solar-light: #fef3c7;
  --alert-red: #c52222;
  --alert-light: #fde8e8;
  --purple-regal: #6d28d9;
  --purple-light: #f3e8ff;

  --accent: #1e5ba3;
  --accent-ink: #ffffff;

  /* Delegation Colors */
  --t1: #1e5ba3; /* Global Thinkers */
  --t2: #107e54; /* Eco Vanguard */
  --t3: #d97706; /* Solar Pioneers */
  --t4: #7c3aed; /* Future Citizens */

  /* Pedagogical Tiers */
  --tier1: #0284c7; /* Passive Recognition */
  --tier2: #107e54; /* Active Production */

  --shadow-sm: 0 2px 6px rgba(13,42,74, 0.05);
  --shadow-md: 0 6px 18px rgba(13,42,74, 0.08);
  --shadow-lg: 0 14px 34px rgba(13,42,74, 0.12);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;

  --font-display: "Outfit", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", system-ui, sans-serif;
  --font-mono: "Space Grotesk", monospace;
}

:root[data-theme="dark"]{
  color-scheme: dark;
  --bg: #090e17;
  --bg-card: #121a29;
  --bg-card-subtle: #192438;
  --bg-card-hover: #202d45;
  --ink: #f0f4fa;
  --ink-soft: #9db0c7;
  --ink-muted: #6f829c;
  --line: #22324b;
  --line-strong: #304464;

  --globe-navy: #152c4d;
  --globe-blue: #3b82f6;
  --globe-cyan: #38bdf8;
  --eco-emerald: #34d399;
  --eco-light: #064e3b;
  --solar-amber: #fbbf24;
  --solar-light: #78350f;
  --alert-red: #f87171;
  --alert-light: #7f1d1d;
  --purple-regal: #a78bfa;
  --purple-light: #4c1d95;

  --accent: #38bdf8;
  --accent-ink: #090e17;

  --t1: #60a5fa;
  --t2: #34d399;
  --t3: #fbbf24;
  --t4: #c084fc;

  --tier1: #38bdf8;
  --tier2: #34d399;

  --shadow-sm: 0 2px 6px rgba(0,0,0, 0.3);
  --shadow-md: 0 6px 20px rgba(0,0,0, 0.4);
  --shadow-lg: 0 16px 40px rgba(0,0,0, 0.55);
}

*, *::before, *::after{box-sizing:border-box}
body{
  margin:0;
  font-family: var(--font-body);
  color: var(--ink);
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(30, 91, 163, 0.05) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(16, 126, 84, 0.05) 0%, transparent 40%);
  background-attachment: fixed;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.wrap{
  max-width: 1280px;
  margin: 0 auto;
  padding: 16px 20px 60px;
}

button{
  font-family: inherit;
  cursor: pointer;
  border: 0;
  background: transparent;
  transition: all 0.15s ease;
}
button:focus-visible{
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* ==========================================================================
   Header & Navigation
   ========================================================================== */
.site-header{
  border-bottom: 2px solid var(--line);
  padding-bottom: 20px;
  margin-bottom: 24px;
}
.header-top{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}
.brand-wrap{
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-icon{
  width: 52px;
  height: 52px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--globe-blue), var(--eco-emerald));
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 26px;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}
.brand-titles h1{
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(24px, 3.5vw, 36px);
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-titles h1 span{
  background: linear-gradient(135deg, var(--globe-blue), var(--eco-emerald));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-titles p{
  margin: 2px 0 0;
  color: var(--ink-soft);
  font-size: 14px;
  font-weight: 500;
}

.top-actions{
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn{
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 18px;
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.icon-btn:hover{
  background: var(--bg-card-hover);
  border-color: var(--accent);
}

/* Control Pills & Filter Bars */
.controls-grid{
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: flex-end;
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  box-shadow: var(--shadow-sm);
}
.ctl-group{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ctl-label{
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
}
.pill-group{
  display: flex;
  background: var(--bg-card-subtle);
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  padding: 3px;
  gap: 2px;
}
.pill-btn{
  padding: 6px 13px;
  font-size: 13.5px;
  font-weight: 600;
  border-radius: var(--radius-pill);
  color: var(--ink-soft);
}
.pill-btn:hover{
  color: var(--ink);
}
.pill-btn[aria-pressed="true"]{
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}

/* Status Banner */
.status-banner{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  padding: 10px 16px;
  background: var(--bg-card-subtle);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--ink-soft);
}
.scope-tag{
  font-weight: 700;
  color: var(--ink);
}
.tier-badges{
  display: flex;
  gap: 8px;
}
.tier-badge{
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.tier-badge.t1{
  background: rgba(2, 132, 199, 0.12);
  color: var(--tier1);
  border: 1px solid var(--tier1);
}
.tier-badge.t2{
  background: rgba(16, 126, 84, 0.12);
  color: var(--tier2);
  border: 1px solid var(--tier2);
}

/* ==========================================================================
   Home: Activity Card Grid
   ========================================================================== */
.activities-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  margin-bottom: 36px;
}
.act-card{
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 22px;
  display: flex;
  flex-direction: column;
  text-align: left;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.act-card::before{
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
}
.act-card[data-tier="1"]::before{ background: var(--tier1); }
.act-card[data-tier="2"]::before{ background: var(--tier2); }

.act-card:hover{
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
}
.act-top{
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.act-icon{
  width: 46px;
  height: 46px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  font-size: 22px;
  flex-shrink: 0;
}
.act-card[data-tier="1"] .act-icon{ background: rgba(2, 132, 199, 0.12); color: var(--tier1); }
.act-card[data-tier="2"] .act-icon{ background: rgba(16, 126, 84, 0.12); color: var(--tier2); }

.act-title{
  margin: 0;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.25;
}
.act-desc{
  margin: 0 0 16px;
  font-size: 14.5px;
  color: var(--ink-soft);
  line-height: 1.45;
  flex-grow: 1;
}
.act-footer{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.act-chips{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip{
  font-size: 12px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  background: var(--bg-card-subtle);
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.chip.active-tier{
  background: rgba(16, 126, 84, 0.12);
  color: var(--tier2);
  border-color: var(--tier2);
}
.chip.passive-tier{
  background: rgba(2, 132, 199, 0.12);
  color: var(--tier1);
  border-color: var(--tier1);
}
.chip.count{
  font-family: var(--font-mono);
  font-weight: 700;
}
.act-play-btn{
  font-weight: 700;
  font-size: 13.5px;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* ==========================================================================
   Game Header Bar & Delegation Scoreboard
   ========================================================================== */
.gbar{
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px 18px;
  margin-bottom: 22px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  position: sticky;
  top: 10px;
  z-index: 20;
}
.gbar-left{
  display: flex;
  align-items: center;
  gap: 14px;
}
.back-btn{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--bg-card-subtle);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
}
.back-btn:hover{
  background: var(--bg-card-hover);
  border-color: var(--accent);
}
.gbar-title-wrap h2{
  margin: 0;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
}
.gbar-title-wrap p{
  margin: 0;
  font-size: 12.5px;
  color: var(--ink-soft);
}

.gbar-right{
  display: flex;
  align-items: center;
  gap: 14px;
}

/* Timer Display */
.timer-box{
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-card-subtle);
  border: 1.5px solid var(--line);
  padding: 6px 12px;
  border-radius: var(--radius-pill);
}
.timer-num{
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  min-width: 3ch;
  text-align: center;
}
.timer-num.urgent{
  color: var(--alert-red);
  animation: pulseUrgent 1s infinite;
}
@keyframes pulseUrgent{
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.timer-ctrl-btn{
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 12px;
}

/* Delegations / Teams Bar */
.teams-bar{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}
.team-badge{
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: 8px 14px;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s;
}
.team-badge.active{
  border-color: var(--t-col);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--t-col) 25%, transparent);
  transform: translateY(-2px);
}
.team-name{
  font-weight: 700;
  font-size: 14px;
  color: var(--t-col);
}
.team-score{
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 800;
  min-width: 2ch;
  text-align: center;
}
.pm-btn{
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--bg-card-subtle);
  font-weight: 800;
  font-size: 16px;
  display: grid;
  place-items: center;
  color: var(--ink);
}
.pm-btn:hover{
  background: var(--t-col);
  color: #fff;
  border-color: var(--t-col);
}
.solo-stats-box{
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 8px 18px;
  font-size: 14px;
}
.solo-stat b{
  font-family: var(--font-mono);
  font-size: 16px;
  color: var(--accent);
}

/* ==========================================================================
   Game Arena & Interactive Modules
   ========================================================================== */
.arena-card{
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  box-shadow: var(--shadow-md);
  max-width: 820px;
  margin: 0 auto;
  position: relative;
}

/* Flashcard Specific */
.flashcard-outer{
  perspective: 1000px;
  min-height: 380px;
  margin-bottom: 24px;
}
.flashcard-inner{
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 380px;
  text-align: center;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
  cursor: pointer;
}
.flashcard-inner.flipped{
  transform: rotateY(180deg);
}
.fc-face{
  position: absolute;
  width: 100%;
  height: 100%;
  min-height: 380px;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  border-radius: var(--radius-lg);
  padding: 36px 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: var(--bg-card);
  border: 2px solid var(--line-strong);
  box-shadow: var(--shadow-md);
  box-sizing: border-box;
}
.fc-back{
  transform: rotateY(180deg);
  background: var(--bg-card-subtle);
  border-color: var(--globe-blue);
}
.fc-topic-chip{
  position: absolute;
  top: 18px;
  left: 20px;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
}
.fc-hint-flip{
  position: absolute;
  bottom: 16px;
  font-size: 12.5px;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.fc-word{
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 42px);
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 8px;
}
.fc-phonetic{
  font-family: var(--font-mono);
  font-size: 16px;
  color: var(--globe-blue);
  margin-bottom: 16px;
}
.fc-pos{
  font-size: 13px;
  font-style: italic;
  color: var(--ink-soft);
  margin-bottom: 20px;
}
.fc-trans{
  font-family: var(--font-display);
  font-size: clamp(24px, 3.5vw, 34px);
  font-weight: 700;
  color: var(--eco-emerald);
  margin-bottom: 16px;
}
.fc-sentence{
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg-card);
  padding: 16px 20px;
  border-radius: var(--radius-md);
  border-left: 4px solid var(--globe-blue);
  margin: 12px 0;
  max-width: 90%;
}
.fc-family{
  font-size: 13.5px;
  color: var(--ink-soft);
  margin-top: 8px;
}

/* Audio button */
.speak-btn{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-card-subtle);
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-top: 8px;
}
.speak-btn:hover{
  background: var(--accent);
  color: var(--accent-ink);
}

/* Control Action Bar */
.arena-actions{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 24px;
}
.action-btn{
  padding: 12px 24px;
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow-sm);
}
.action-btn.primary{
  background: var(--accent);
  color: var(--accent-ink);
}
.action-btn.success{
  background: var(--eco-emerald);
  color: #fff;
}
.action-btn.secondary{
  background: var(--bg-card-subtle);
  color: var(--ink);
  border: 1.5px solid var(--line);
}
.action-btn.warn{
  background: var(--solar-amber);
  color: #fff;
}
.action-btn.danger{
  background: var(--alert-red);
  color: #fff;
}
.action-btn:hover{
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

/* Multiple Choice Grid */
.mc-grid{
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin: 24px 0;
}
@media (min-width: 600px){
  .mc-grid{ grid-template-columns: 1fr 1fr; }
}
.mc-opt{
  padding: 18px 20px;
  border-radius: var(--radius-md);
  background: var(--bg-card-subtle);
  border: 2px solid var(--line);
  text-align: left;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 12px;
}
.mc-opt:hover:not(:disabled){
  border-color: var(--accent);
  background: var(--bg-card-hover);
  transform: translateY(-2px);
}
.mc-opt.correct{
  background: var(--eco-light) !important;
  border-color: var(--eco-emerald) !important;
  color: var(--eco-emerald) !important;
}
.mc-opt.wrong{
  background: var(--alert-light) !important;
  border-color: var(--alert-red) !important;
  color: var(--alert-red) !important;
}
.mc-letter{
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-weight: 700;
  flex-shrink: 0;
}

/* Fact or Fake Movement Box */
.movement-box{
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 20px 0;
}
.gesture-card{
  background: var(--bg-card-subtle);
  border: 2px dashed var(--line);
  border-radius: var(--radius-md);
  padding: 14px 20px;
  text-align: center;
  flex: 1;
}
.gesture-card b{
  display: block;
  font-size: 18px;
  margin-bottom: 4px;
}
.gesture-card.true-card{ border-color: var(--eco-emerald); color: var(--eco-emerald); }
.gesture-card.false-card{ border-color: var(--alert-red); color: var(--alert-red); }

/* Speller / Cloze Input */
.cloze-input-wrap{
  margin: 24px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.speller-input{
  width: 100%;
  max-width: 520px;
  padding: 14px 20px;
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  border-radius: var(--radius-md);
  border: 2px solid var(--line);
  background: var(--bg-card);
  color: var(--ink);
}
.speller-input:focus{
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(30, 91, 163, 0.15);
}
.letter-tiles{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 550px;
}
.letter-tile{
  width: 38px;
  height: 42px;
  border-radius: var(--radius-sm);
  background: var(--bg-card-subtle);
  border: 1.5px solid var(--line);
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.letter-tile:hover{
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* Taboo Speaking Card */
.taboo-card{
  background: var(--bg-card);
  border: 3px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 32px;
  box-shadow: var(--shadow-lg);
  text-align: center;
  max-width: 540px;
  margin: 0 auto 24px;
}
.taboo-target-word{
  font-family: var(--font-display);
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 800;
  color: var(--globe-blue);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--line);
  margin-bottom: 20px;
}
.taboo-forbidden-box{
  background: var(--alert-light);
  border: 2px solid var(--alert-red);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 20px;
}
.taboo-forbidden-label{
  font-size: 12px;
  font-weight: 800;
  color: var(--alert-red);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}
.taboo-list{
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.taboo-list li{
  font-size: 18px;
  font-weight: 700;
  color: var(--alert-red);
  text-transform: uppercase;
}

/* Argumentation Studio Textarea */
.arg-textarea{
  width: 100%;
  min-height: 140px;
  padding: 16px;
  border-radius: var(--radius-md);
  border: 2px solid var(--line);
  background: var(--bg-card);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  resize: vertical;
}
.arg-textarea:focus{
  outline: none;
  border-color: var(--accent);
}
.target-colloc-tags{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 16px;
}
.colloc-tag{
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 13.5px;
  font-weight: 700;
  background: var(--bg-card-subtle);
  border: 1.5px solid var(--line);
  color: var(--ink-soft);
  transition: all 0.2s ease;
}
.colloc-tag.included{
  background: var(--eco-light);
  border-color: var(--eco-emerald);
  color: var(--eco-emerald);
}

/* ==========================================================================
   Catalog & Dictionary Section
   ========================================================================== */
.catalog-section{
  margin-top: 40px;
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
}
.catalog-head{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.catalog-head h3{
  margin: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.catalog-search-wrap{
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  width: 100%;
  margin-bottom: 20px;
}
.search-input{
  flex: 1 1 280px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--line);
  background: var(--bg-card-subtle);
  color: var(--ink);
  font-size: 15px;
}
.search-input:focus{
  outline: none;
  border-color: var(--accent);
}
.catalog-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}
.cat-item{
  background: var(--bg-card-subtle);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-md);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color 0.2s;
}
.cat-item:hover{
  border-color: var(--accent);
}
.cat-item-top{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.cat-item-word{
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
}
.cat-item-trans{
  font-size: 16px;
  font-weight: 600;
  color: var(--eco-emerald);
}
.cat-item-ex{
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.45;
  background: var(--bg-card);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--globe-blue);
}
.cat-item-meta{
  font-size: 12.5px;
  color: var(--ink-muted);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

/* Pedagogical Box */
.pedagogy-box{
  margin-top: 36px;
  background: var(--bg-card-subtle);
  border: 2px dashed var(--line-strong);
  border-radius: var(--radius-md);
  padding: 24px;
  font-size: 15px;
  line-height: 1.6;
}
.pedagogy-box h4{
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--globe-blue);
}

/* Print Styles */
@media print {
  .controls-grid, .site-header .top-actions, .activities-grid, .pedagogy-box, .catalog-search-wrap, button {
    display: none !important;
  }
  .catalog-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  body {
    background: #fff;
    color: #000;
  }
}
</style>

e national GDP of many developing nations.", "cloze_blank": "corporations"}, {"id": "v_048", "word": "abolition of", "rawWord": "abolition of", "phonetic": "", "translation": "Abschaffung", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "noun phrase", "example": "The American Civil War resulted in the abolition of slavery, but discrimination against ethnic minorities continues today.", "extraExamples": [], "definition": "giving up sth or putting an end to sth", "family": "abolition ➔ to abolish (v) ➔ abolitionist (adj, n)", "tip": "The action of formally putting an end to a system, practice, or institution.", "taboo": ["end", "cancel", "slavery", "repeal"], "cloze": "The international community pushed for the complete [abolition of] tariffs and protectionist trade barriers.", "cloze_blank": "abolition of"}, {"id": "v_049", "word": "to enable sb to do sth", "rawWord": "to enable sb to do sth", "phonetic": "", "translation": "es jdm. ermöglichen etw. zu tun", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb phrase", "example": "Social media has enabled us to stay in touch with friends all over the world.", "extraExamples": [], "definition": "to make sb able to do sth or to make sth possible that was difficult/impossible before", "family": "to enable (v) ➔ able (adj) ➔ ability (n)", "tip": "To give someone the authority or means to do something; make possible.", "taboo": ["allow", "help", "permit", "possible"], "cloze": "Advances in digital technology have [enabled] remote workers to collaborate seamlessly across opposite sides of the planet.", "cloze_blank": "enabled"}, {"id": "v_050", "word": "to secure", "rawWord": "to secure", "phonetic": "", "translation": "sichern", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb", "example": "Our candidate promises to secure jobs and lower taxes for small businesses.", "extraExamples": ["The soldiers secured the area that had been under attack."], "definition": "to obtain sth after a lot of effort; to protect", "family": "to secure (v) ➔ security (n) ➔ secure (adj)", "tip": "To succeed in obtaining or achieving something after effort; to make safe.", "taboo": ["protect", "safe", "lock", "guarantee"], "cloze": "Trade unions fight hard to [secure] fair working conditions and adequate healthcare for outsourced laborers.", "cloze_blank": "secure"}, {"id": "v_051", "word": "livelihood", "rawWord": "livelihood", "phonetic": "", "translation": "Lebensunterhalt", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb phrase", "example": "They depend on their tea stall for their livelihood. Without it they’d starve.", "extraExamples": [], "definition": "a way to earn money in order to live", "family": "livelihood (n) ➔ to live (v)", "tip": "To eliminate the means by which someone earns money to survive.", "taboo": ["income", "money", "survival", "ruin"], "cloze": "Farmers say that environmental restrictions on farming methods could [destroy the basis of their livelihood].", "cloze_blank": "destroy the basis of their livelihood"}, {"id": "v_052", "word": "to have access to sth", "rawWord": "to have access to sth", "phonetic": "", "translation": "auf etw. Zugriff haben; zu etw. Zugang haben", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb phrase", "example": "Even in the rural areas of North America, people have access to the Internet.", "extraExamples": ["Thanks to globalisation people have access to products and services they wouldn’t have had in previous centuries."], "definition": "My ID allows me to have access to the more secure facilities.", "family": "access (n) ➔ to access (v) ➔ accessible (adj)", "tip": "Collocation: have access to healthcare, education, information.", "taboo": ["reach", "use", "enter", "available"], "cloze": "Millions of children in developing nations still do not [have access to] clean drinking water or reliable internet.", "cloze_blank": "have access to"}, {"id": "v_053", "word": "subsidisation", "rawWord": "subsidisation", "phonetic": "", "translation": "Unterstützung; Subventionierung; Bezuschussung", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "noun", "example": "Some people favour the subsidisation of the agricultural sector while others say the government should use taxes to support the National Health Service.", "extraExamples": ["Subsidisation can take the form of a direct payment, an indirect payment, or a tax cut."], "definition": "Financial assistance given by government to support an industry or market.", "family": "subsidisation (n) ➔ to subsidise (v) ➔ subsidy (n)", "tip": "Financial assistance given by government to support an industry or market.", "taboo": ["government", "money", "aid", "grant"], "cloze": "Western [subsidisation] of domestic agriculture often distorts world market prices for farmers in poorer nations.", "cloze_blank": "subsidisation"}, {"id": "v_054", "word": "human trafficking", "rawWord": "human trafficking", "phonetic": "", "translation": "Menschenhandel", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "noun phrase", "example": "We are cracking down on international crime such as human trafficking.", "extraExamples": ["the crime of buying and selling people to profit from their forced labour, e.g. sex work"], "definition": "The unlawful act of transporting people typically for the purpose of forced labor or exploitation.", "family": "to traffic (v) ➔ trafficking (n) ➔ trafficker (n)", "tip": "The unlawful act of transporting people typically for the purpose of forced labor or exploitation.", "taboo": ["smuggling", "slave", "people", "crime"], "cloze": "Global law enforcement agencies are collaborating to eliminate the abhorrent crime of [human trafficking].", "cloze_blank": "human trafficking"}, {"id": "v_055", "word": "survival", "rawWord": "survival", "phonetic": "", "translation": "Überleben", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "noun phrase", "example": "To guarantee human survival, we must colonise other planets.", "extraExamples": ["The survival instinct is strong in most people, and they’ll do anything to live."], "definition": "Doctor Smith told me I had a 50/50 chance of survival.", "family": "survival (n) ➔ to survive (v)", "tip": "The continued existence of Homo sapiens on Earth.", "taboo": ["mankind", "people", "extinction", "live"], "cloze": "Climate change poses a serious threat to the [survival of the human species].", "cloze_blank": "survival of the human species"}, {"id": "v_056", "word": "vulnerable", "rawWord": "vulnerable", "phonetic": "", "translation": "verwundbar; gefährdet; verletzlich", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "adjective", "example": "The financial crisis resulted in a very vulnerable and unstable economy.", "extraExamples": ["Please be nice to her. Ever since the divorce she has been extremely vulnerable."], "definition": "Lat. vulnerare", "family": "vulnerable (adj) ➔ vulnerability (n) ➔ antonym: invulnerable", "tip": "vulnerable = at risk = defenceless", "taboo": ["weak", "danger", "harm", "defenseless"], "cloze": "Unskilled factory workers in developing nations are especially [vulnerable] to abrupt factory closures.", "cloze_blank": "vulnerable"}, {"id": "v_057", "word": "offshoring", "rawWord": "offshoring", "phonetic": "", "translation": "Offshoring; Verlagerung unternehmerischer Prozesse ins Ausland", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "noun", "example": "We believe that offshoring should be restricted so that corporations have to pay their fair share of taxes.", "extraExamples": [], "definition": "basing a business in another country to avoid paying more tax or other higher costs", "family": "offshoring (n) ➔ to offshore (v)", "tip": "The practice of basing some of a company's processes or services overseas.", "taboo": ["abroad", "relocate", "jobs", "outsourcing"], "cloze": "Many domestic manufacturing jobs were lost when corporations turned to [offshoring] to lower labor expenses.", "cloze_blank": "offshoring"}, {"id": "v_058", "word": "to undermine", "rawWord": "to undermine", "phonetic": "", "translation": "untergraben; unterminieren", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb", "example": "Stop scolding me in front of my students. You’re undermining my authority.", "extraExamples": ["Their actions were aimed at undermining state security."], "definition": "to weaken the position of sb else", "family": "to undermine (v) ➔ undermining (n/adj) ➔ to weaken = to compromise", "tip": "to undermine = to weaken = to compromise", "taboo": ["weaken", "sabotage", "damage", "authority"], "cloze": "Unchecked corporate monopolies can [undermine] the democratic authority of elected sovereign governments.", "cloze_blank": "undermine"}, {"id": "v_059", "word": "to afford", "rawWord": "to afford", "phonetic": "", "translation": "sich etw. leisten", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb", "example": "Because he didn’t earn much money, Zach couldn’t afford a new car.", "extraExamples": [], "definition": "to have enough money to spend/buy sth", "family": "to afford (v) ➔ affordable (adj)", "tip": "Have enough money to pay for; provide or supply.", "taboo": ["money", "buy", "pay", "cost"], "cloze": "Without public healthcare subsidies, impoverished families cannot [afford] life-saving prescription medicines.", "cloze_blank": "afford"}, {"id": "v_060", "word": "tax evasion", "rawWord": "tax evasion", "phonetic": "", "translation": "Steuerhinterziehung", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "noun phrase", "example": "Never use a tax evasion scheme; it’s a crime.", "extraExamples": ["Hiding money in an offshore bank account and not reporting cash earnings are some common examples of tax evasion."], "definition": "using illegal ways to pay less tax", "family": "to evade (v) ➔ evasion (n) | contrast: tax avoidance (legal) vs tax evasion (illegal)", "tip": "tax avoidance (legal) ≠ tax evasion (illegal)", "taboo": ["illegal", "fraud", "offshore", "taxes"], "cloze": "Governments lose hundreds of billions every year through illicit [tax evasion] and secretive shell companies.", "cloze_blank": "tax evasion"}, {"id": "v_061", "word": "peer pressure", "rawWord": "peer pressure", "phonetic": "", "translation": "sozialer Druck; Gruppenzwang", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "noun phrase", "example": "Young people often suffer from peer pressure because they want their friends to think they’re cool.", "extraExamples": [], "definition": "acting as expected by the members of the same social group", "family": "peer (n) ➔ pressure (n) ➔ to pressure (v)", "tip": "Influence from members of one's peer group to conform to their behaviors or values.", "taboo": ["friends", "conform", "social", "group"], "cloze": "Global youth culture and viral social media trends amplify intense [peer pressure] to buy fast fashion.", "cloze_blank": "peer pressure"}, {"id": "v_062", "word": "consumption", "rawWord": "consumption", "phonetic": "", "translation": "Verbrauch", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "noun", "example": "We must reduce our consumption of fossil fuels before they begin to disappear.", "extraExamples": ["Fr. consommation (f.)"], "definition": "the amount of sth that people use", "family": "consumption (n) ➔ consumer (n) ➔ to consume (v)", "tip": "The using up of a resource; also consumer culture.", "taboo": ["use", "buying", "resources", "waste"], "cloze": "The unsustainable [consumption] of electronic goods creates massive mountains of toxic e-waste.", "cloze_blank": "consumption"}, {"id": "v_063", "word": "severely", "rawWord": "severely", "phonetic": "", "translation": "stark; schwer", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "adverb", "example": "Our friend was severely injured by the car crash and barely made it out alive.", "extraExamples": [], "definition": "Always carries negative connotation: severely damaged, severely injured, severely affected.", "family": "severely (adv) ➔ severe (adj)", "tip": "severely = very seriously | tip: It always has a negative meaning.", "taboo": ["very", "badly", "strictly", "harshly"], "cloze": "Local farming communities were [severely] impacted by the sudden influx of cheap subsidized imports.", "cloze_blank": "severely"}, {"id": "v_064", "word": "to facilitate", "rawWord": "to facilitate", "phonetic": "", "translation": "erleichtern; ermöglichen", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb", "example": "The new bus line will facilitate access to the city.", "extraExamples": ["Fr. faciliter"], "definition": "to make sth easier", "family": "to facilitate (v) ➔ facilitation (n) ➔ facilitator (n) ➔ facile (adj)", "tip": "to facilitate sth = to enable sth = to make sth possible", "taboo": ["make easy", "help", "assist", "smooth"], "cloze": "Modern container shipping and high-speed fibre optics [facilitate] global trade on an unprecedented scale.", "cloze_blank": "facilitate"}, {"id": "v_065", "word": "to foster", "rawWord": "to foster", "phonetic": "", "translation": "fördern", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb", "example": "We hope to foster good relations with the EU and encourage free trade.", "extraExamples": [], "definition": "to help the development or growth of sth", "family": "to foster (v) ➔ fostering (n) ➔ foster (adj)", "tip": "to foster = to support", "taboo": ["encourage", "promote", "nurture", "support"], "cloze": "International student exchange programmes [foster] mutual cultural understanding and tolerance.", "cloze_blank": "foster"}, {"id": "v_066", "word": "to threaten", "rawWord": "to threaten", "phonetic": "", "translation": "drohen; bedrohen; gefährden", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb", "example": "The hurricane threatened to destroy our neighbourhood.", "extraExamples": ["When the senator pledged to reform the law, some opponents threatened her."], "definition": "Seasonal flu threatens the elderly every year.", "family": "threat (n) ➔ to threaten (v) ➔ threatening (adj)", "tip": "to threaten = to put at risk", "taboo": ["menace", "danger", "risk", "harm"], "cloze": "Rising sea levels and severe coastal erosion [threaten] low-lying island nations with total submergence.", "cloze_blank": "threaten"}, {"id": "v_067", "word": "to assess", "rawWord": "to assess", "phonetic": "", "translation": "bewerten; einschätzen; beurteilen", "topic": "Chances and challenges of globalisation", "topicShort": "Chances & Challenges", "topicKey": "chances", "docName": "Vocab_Chances_and_challenges_of_globalisation.docx", "docColor": "#113f67", "pos": "verb", "example": "Environmental scientists will have to assess the damage caused by the oil leak.", "extraExamples": [], "definition": "To evaluate or estimate the nature, ability, or quality of.", "family": "to assess (v) ➔ assessment (n)", "tip": "to assess = to judge = to evaluate", "taboo": ["evaluate", "judge", "rate", "measure"], "cloze": "Independent auditors were tasked to [assess] whether the supplier factories complied with international labor standards.", "cloze_blank": "assess"}], "factFake": [{"id": "ff_01", "statement": "'Subsidisation' refers to the abolition or complete cancellation of government aid.", "truth": false, "topicKey": "chances", "correction": "FALSE! 'Subsidisation' means financial support / subsidies (Subventionierung / Bezuschussung). 'Abolition' means cancellation / putting an end to something.", "gesture": "Stay seated 🪑"}, {"id": "ff_02", "statement": "'Offshoring' means relocating business processes or manufacturing overseas to minimize production or labor costs.", "truth": true, "topicKey": "chances", "correction": "TRUE! Offshoring is basing business operations abroad to take advantage of lower wages, lower taxes, or favorable regulations.", "gesture": "Stand up 🧍"}, {"id": "ff_03", "statement": "The word 'drought' is pronounced [drɔːt] and rhymes with 'bought' and 'thought'.", "truth": false, "topicKey": "planet", "correction": "FALSE! 'Drought' is pronounced [draʊt] and rhymes with 'out' or 'shout'. It means Trockenheit / Dürre.", "gesture": "Stay seated 🪑"}, {"id": "ff_04", "statement": "'Tax avoidance' is legally utilizing tax laws to pay less, whereas 'tax evasion' is illegal criminal fraud.", "truth": true, "topicKey": "chances", "correction": "TRUE! This is a classic Sek II distinction: avoidance is legal (exploiting tax loopholes), while evasion is illegal (hiding assets/income).", "gesture": "Stand up 🧍"}, {"id": "ff_05", "statement": "The noun 'species' has no plural form with an 's' and becomes 'specie' in the singular.", "truth": false, "topicKey": "planet", "correction": "FALSE! 'Species' ends in -s in BOTH singular ('one species') and plural ('many species'). 'Specie' (without s) means coined money!", "gesture": "Stay seated 🪑"}, {"id": "ff_06", "statement": "'To undermine' means to actively support, reinforce, and strengthen an authority or system.", "truth": false, "topicKey": "chances", "correction": "FALSE! 'To un // Web Audio API Sound Synthesizer
let audioCtx = null;
function playSfx(type){
  if(!S.sound) return;
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if(type === 'correct'){
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now); // C5
      osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.25); // G5
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if(type === 'wrong'){
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now); // A3
      osc.frequency.linearRampToValueAtTime(146.83, now + 0.25); // D3
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if(type === 'click'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if(type === 'buzzer'){
      osc.type = 'square';
      osc.frequency.setValueAtTime(160, now);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now);
      osc.stop(now + 0.5);
    }
  } catch(e) {}
}

// Text to Speech
function speakEnglish(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

// Helper: Shuffle Array
function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Filter helpers
function filterByScope(list){
  if(S.scope === 'all') return list;
  return list.filter(item => item.topicKey === S.scope || item.topicKey === 'both');
}

// Timer Functions
function startTimer(){
  if(S.timerSetting === 0) return;
  clearInterval(S.timerInterval);
  S.timerRunning = true;
  S.timerInterval = setInterval(() => {
    if(S.timerRemaining > 0){
      S.timerRemaining--;
      updateTimerUI();
      if(S.timerRemaining === 0){
        clearInterval(S.timerInterval);
        S.timerRunning = false;
        playSfx('buzzer');
        updateTimerUI();
      }
    }
  }, 1000);
  updateTimerUI();
}

function pauseTimer(){
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  updateTimerUI();
}

function resetTimer(){
  clearInterval(S.timerInterval);
  S.timerRunning = false;
  S.timerRemaining = S.timerSetting;
  updateTimerUI();
}

function updateTimerUI(){
  const el = document.getElementById('timer-val');
  if(!el) return;
  el.textContent = S.timerRemaining + 's';
  if(S.timerRemaining <= 10 && S.timerRemaining > 0){
    el.classList.add('urgent');
  } else {
    el.classList.remove('urgent');
  }
  const btn = document.getElementById('timer-toggle-btn');
  if(btn) btn.textContent = S.timerRunning ? '⏸' : '▶';
}

      render();
    };
  });

    btn.onclick = () => {
      S.tier = btn.dataset.v;
      playSfx('click');
      render();
    };
  });

  document.querySelectorAll('#mode-pills button').forEach(btn => {
    btn.onclick = () => {
      S.numTeams = parseInt(btn.dataset.n);

      playSfx('click');
      render();
    };
  });

  document.querySelectorAll('#timer-pills button').forEach(btn => {
    btn.onclick = () => {
      S.timerSetting = parseInt(btn.dataset.t);
      S.timerRemaining = S.timerSetting;
      playSfx('click');
      render();
    };
  });

  document.querySelectorAll('.act-card').forEach(card => {

  if(catSearch){

      if(grid) grid.innerHTML = renderCatalogItems();
    };
  }
}

function getGameDeckCount(g){
  if(g.id === 'forge') return DATA.forge.length;
  if(g.id === 'factfake') return filterByScope(DATA.factFake).length;
  if(g.id === 'debate') return DATA.debates.length;
  return filterByScope(DATA.vocab).length;
}

// --------------------------------------------------------------------------
// CATALOG COMPONENT
// --------------------------------------------------------------------------
function renderCatalogGrid(){
  return `
    <div class="catalog-search-wrap">
      <input type="text" id="cat-search" class="search-input" placeholder="Search by English word, German meaning, or keyword..." value="${S.catalogSearch}">
      <button class="action-btn secondary" onclick="window.print()">🖨️ Print Vocab Handout</button>
    </div>
    <div class="catalog-grid" id="cat-grid-box">
      ${renderCatalogItems()}
    </div>
  `;
}

function renderCatalogItems(){
  const pool = filterByScope(DATA.vocab);
  const q = S.catalogSearch;
  const filtered = pool.filter(item => {
    if(!q) return true;
    return item.word.toLowerCase().includes(q) ||
           item.translation.toLowerCase().includes(q) ||
           item.example.toLowerCase().includes(q) ||
           item.family.toLowerCase().includes(q) ||
           item.tip.toLowerCase().includes(q);
  });

  if(filtered.length === 0){
    return `<div style="grid-column: 1/-1; padding: 20px; text-align: center; color: var(--ink-soft);">No vocabulary matches your search query.</div>`;
  }

  return filtered.map(item => `
    <div class="cat-item">
      <div class="cat-item-top">
        <div>
          <div class="cat-item-word">${item.word} ${item.phonetic ? `<small style="font-size:14px; color:var(--globe-blue); font-family:var(--font-mono)">${item.phonetic}</small>` : ''}</div>
          <div class="cat-item-trans">${item.translation}</div>
        </div>
        <button class="speak-btn" onclick="speakEnglish('${escapeQuotes(item.word)}')">🔊 Listen</button>
      </div>
      <div class="cat-item-ex">“${item.example}”</div>
      ${item.family ? `<div style="font-size:13px; color:var(--ink-soft)"><b>Word Family:</b> ${item.family}</div>` : ''}
      ${item.tip ? `<div style="font-size:12.5px; color:var(--ink-muted)">💡 ${item.tip}</div>` : ''}
      <div class="cat-item-meta">
        <span class="chip">${item.topicShort}</span>
        <span class="chip">${item.pos}</span>
      </div>
    </div>
  `).join("");
}

// --------------------------------------------------------------------------
// GAME VIEW
// --------------------------------------------------------------------------
function renderGame(app){
  const gameDef = GAMES.find(g => g.id === S.currentGame);
  if(!gameDef) return;

  const totalCards = S.deck.length;
  const currentCard = S.deck[S.deckIdx];

  app.innerHTML = `
    <!-- Top Game Bar -->
    <header class="gbar">
      <div class="gbar-left">
        <button class="back-btn" id="exit-game-btn">← All Activities</button>
        <div class="gbar-title-wrap">
          <h2>${gameDef.icon} ${gameDef.title}</h2>
          <p>Card <b>${S.deckIdx + 1}</b> of <b>${totalCards}</b> • ${gameDef.tierLabel}</p>
        </div>
      </div>

      <div class="gbar-right">
        ${S.timerSetting > 0 ? `
          <div class="timer-box">
            <span>⏱️</span>
            <span class="timer-num" id="timer-val">${S.timerRemaining}s</span>
            <button class="timer-ctrl-btn" id="timer-toggle-btn">${S.timerRunning ? '⏸' : '▶'}</button>
            <button class="timer-ctrl-btn" id="timer-reset-btn">↺</button>
          </div>
        ` : ''}
      </div>
    </header>

    <!-- Delegations / Teams Scoreboard -->
    ${S.mode === 'team' ? renderTeamsBar() : renderSoloStatsBar()}

    <!-- Main Game Play Area -->
    <main class="arena-card" id="arena-content">
      ${renderGameContent(currentCard)}
    </main>
  `;

  // Attach Handlers
  document.getElementById('exit-game-btn').onclick = () => {
    pauseTimer();
    S.currentGame = null;
    playSfx('click');
    render();
  };

  const timerTog = document.getElementById('timer-toggle-btn');
  if(timerTog){
    timerTog.onclick = () => {
      if(S.timerRunning) pauseTimer();
      else startTimer();
    };
  }
  const timerRst = document.getElementById('timer-reset-btn');
  if(timerRst){
    timerRst.onclick = () => {
      resetTimer();
    };
  }

  attachTeamScoreHandlers();
  attachGameSpecificHandlers(currentCard);
}

function renderTeamsBar(){
  return `
    <div class="teams-bar">
      ${S.teams.slice(0, S.numTeams).map((t, i) => `
        <div class="team-badge ${i === S.activeTeamIdx ? 'active' : ''}" style="--t-col:${t.color}">
          <button class="team-name" onclick="setActiveTeam(${i})">${t.name}</button>
          <div class="team-score" id="team-sc-${i}">${t.score}</div>
          <button class="pm-btn" onclick="adjustScore(${i}, 1)">+</button>
          <button class="pm-btn" onclick="adjustScore(${i}, -1)">−</button>
        </div>
      `).join("")}

        👉 Click delegation name to set active turn
      </div>

function renderSoloStatsBar(){
  const pct = S.soloStats.total > 0 ? Math.round((S.soloStats.correct / S.soloStats.total) * 100) : 0;
  return `
    <div class="solo-stats-box" style="margin-bottom: 20px;">
      <div class="solo-stat">Session Cards: <b>${S.soloStats.total}</b></div>
      <div class="solo-stat">Accuracy: <b>${pct}%</b></div>
      <div class="solo-stat">Current Streak: <b>${S.soloStats.streak} 🔥</b></div>

// GAME ENGINES RENDERERS
// --------------------------------------------------------------------------
function renderGameContent(card){
  if(!card) return `<div style="text-align:center; padding:40px;"><h3>All cards completed! 🎉</h3><button class="action-btn primary" onclick="launchGame('${S.currentGame}')">Play Again</button></div>`;

  switch(S.currentGame){
    case 'flashcard': return renderFlashcard(card);
    case 'detective': return renderDetective(card);
    case 'factfake': return renderFactFake(card);
    case 'context': return renderContext(card);
    case 'speller': return renderSpeller(card);
    case 'forge': return renderForge(card);
    case 'taboo': return renderTaboo(card);
    case 'debate': return renderDebate(card);
    default: return '';
  }
}

    </div>

    <div class="mc-grid">
      ${item.options.map((opt, idx) => {

// 5. Speller / Cloze
function renderSpeller(item){
  const isChecked = S.stepState === 1;
  const sentencePrompt = item.cloze.replace(/\[([^\]]+)\]/g, "_______");
  const letters = shuffle(item.cloze_blank.replace(/\s+/g, '').split(''));

  return `
    <div style="margin-bottom: 20px;">
      <span class="chip" style="background:${item.docColor}22; color:${item.docColor}">${item.topicShort} • Active Recall</span>
      <h3 style="font-family:var(--font-display); font-size:22px; margin:14px 0 10px;">Type the missing English word/phrase:</h3>
      <div style="font-size:18px; line-height:1.6; background:var(--bg-card-subtle); padding:20px; border-radius:var(--radius-md); border-left:4px solid var(--tier2);">
        “${sentencePrompt}”
      </div>
      <p style="margin-top:10px; font-size:15px; color:var(--ink-soft);">
        🇩🇪 <b>German Meaning:</b> <span style="color:var(--eco-emerald); font-weight:700;">${item.translation}</span>
      </p>
    </div>

    <div class="cloze-input-wrap">
      <input type="text" id="speller-inp" class="speller-input" placeholder="Type here (e.g. ${item.cloze_blank.slice(0, 2)}...)" value="${S.userAnswer}" ${isChecked ? 'readonly' : ''} autofocus autocomplete="off">
      
      ${!isChecked ? `
        <div class="letter-tiles">
          ${letters.map(l => `<span class="letter-tile" onclick="appendLetter('${l}')">${l}</span>`).join("")}
          <span class="letter-tile" onclick="backspaceLetter()" style="width:auto; padding:0 10px;">⌫</span>
        </div>
      ` : ''}
    </div>

    ${isChecked ? `
      <div style="background:${S.feedback.correct ? 'var(--eco-light)' : 'var(--alert-light)'}; border:2px solid ${S.feedback.correct ? 'var(--eco-emerald)' : 'var(--alert-red)'}; border-radius:var(--radius-md); padding:18px; text-align:center;">
        <h4 style="margin:0 0 6px; font-size:20px; color:${S.feedback.correct ? 'var(--eco-emerald)' : 'var(--alert-red)'}">
          ${S.feedback.correct ? '✓ Exactly Correct!' : '✗ Correct Word: ' + item.cloze_blank}
        </h4>
        <p style="margin:0; font-size:15px;">“${item.example}”</p>
        <button class="speak-btn" style="margin-top:10px;" onclick="speakEnglish('${escapeQuotes(item.cloze_blank)}')">🔊 Listen Pronunciation</button>
      </div>
    ` : ''}

    <div class="arena-actions">
      ${!isChecked ? `
        <button class="action-btn success" id="check-speller-btn">Check Answer ↵</button>
        <button class="action-btn secondary" id="hint-speller-btn">Show First Letter 💡</button>
        <button class="action-btn warn" id="reveal-speller-btn">Reveal Word</button>
      ` : `
        <button class="action-btn primary" id="next-card-btn">Next Sentence →</button>
      `}
    </div>
  `;
}

          <b>Pattern:</b> ${item.family}
        </div>
        <div style="font-size:14.5px; color:var(--ink-soft);">${item.explanation}</div>
      </div>

      <div class="arena-actions">
        <button class="action-btn success" onclick="awardActiveTeam(1)">Award Delegation Point (+1)</button>
        <button class="action-btn primary" id="next-card-btn">Next Morphology Challenge →</button>
      </div>
    `}
  `;
}

// 7. Global Taboo (Speaking Challenge)
function renderTaboo(item){
  return `
    <div class="taboo-card">
      <span class="chip" style="background:${item.docColor}22; color:${item.docColor}; margin-bottom:12px;">${item.topicShort}</span>
      <div class="taboo-target-word">${item.word}</div>
      <div class="taboo-forbidden-box">
        <div class="taboo-forbidden-label">🚫 FORBIDDEN TABOO WORDS (Do NOT Say!):</div>
        <ul class="taboo-list">
          ${item.taboo.map(tw => `<li>• ${tw}</li>`).join("")}
        </ul>
      </div>
      <p style="font-size:13.5px; color:var(--ink-soft); margin:0;">
        💡 <b>Speaker Tip:</b> Explain the concept using synonyms, context situations, or global consequences without mentioning the words above!
      </p>
    </div>

    <div class="arena-actions">
      <button class="action-btn success" id="taboo-correct-btn">✓ Team Guessed It! (+1)</button>
      <button class="action-btn danger" id="taboo-broken-btn">🚫 Taboo Broken! (-1)</button>
      <button class="action-btn secondary" id="taboo-pass-btn">Pass ↷</button>
      <button class="action-btn primary" id="next-card-btn">Next Taboo Card →</button>
    </div>
  `;
}

// 8. Argumentation & Collocation Studio
function renderDebate(item){
  const text = S.userAnswer || "";
  return `
    <div style="margin-bottom: 20px;">
      <span class="chip" style="background:rgba(109, 40, 217, 0.12); color:var(--purple-regal)">Abitur Writing & Argumentation Studio</span>
      <h3 style="font-family:var(--font-display); font-size:24px; margin:12px 0 6px;">${item.title}</h3>
      <p style="font-size:16px; color:var(--ink-soft); margin:0 0 16px;">${item.prompt}</p>

      <div style="font-size:13.5px; font-weight:700; color:var(--ink-muted); text-transform:uppercase;">Required Collocations (Live Check):</div>
      <div class="target-colloc-tags">
        ${item.targetCollocations.map(col => {
          const included = text.toLowerCase().includes(col.toLowerCase());
          return `<span class="colloc-tag ${included ? 'included' : ''}">${included ? '✓ ' : ''}${col}</span>`;
        }).join("")}
      </div>
    </div>

    <div style="margin-bottom:16px;">
      <textarea id="arg-text" class="arg-textarea" placeholder="Draft your academic sentence here...">${text}</textarea>
    </div>

    <div style="background:var(--bg-card-subtle); border-radius:var(--radius-md); padding:16px; margin-bottom:20px;">
      <div style="font-size:13px; font-weight:700; color:var(--globe-blue); margin-bottom:6px;">Suggested Oberstufe Sentence Starters:</div>
      <ul style="margin:0; padding-left:20px; font-size:14px; color:var(--ink-soft);">
        ${item.sentenceStarters.map(st => `<li>${st}</li>`).join("")}
      </ul>
    </div>

    ${S.stepState === 1 ? `
      <div style="background:var(--eco-light); border:2px solid var(--eco-emerald); border-radius:var(--radius-md); padding:18px; margin-bottom:20px;">
        <h4 style="margin:0 0 6px; color:var(--eco-emerald);">Sek II Curriculum Model Sentence:</h4>
        <p style="margin:0; font-size:15.5px; line-height:1.5;">“${item.modelSentence}”</p>
      </div>
    ` : ''}

    <div class="arena-actions">
      <button class="action-btn secondary" id="show-model-btn">${S.stepState === 1 ? 'Hide Model' : 'View Sek II Model Sentence'}</button>
      <button class="action-btn success" onclick="awardActiveTeam(1)">Award Delegation Point (+1)</button>
      <button class="action-btn primary" id="next-card-btn">Next Writing Prompt →</button>
    </div>
  `;
}

// --------------------------------------------------------------------------
// EVENT HANDLERS & LOGIC
// --------------------------------------------------------------------------

function launchGame(gid){
  const g = GAMES.find(x => x.id === gid);
  if(!g) return;
  S.currentGame = gid;
  g.init();
  resetTimer();
  playSfx('click');
  render();
}

function nextCard(){
  if(S.deckIdx < S.deck.length - 1){
    S.deckIdx++;
  } else {
    S.deckIdx = 0; // loop
  }
  S.stepState = 0;
  S.userAnswer = "";
  S.feedback = null;
  resetTimer();
  playSfx('click');
  rotateTurn();
  render();
}

function rotateTurn(){
  if(S.mode === 'team' && S.numTeams > 1){
    S.activeTeamIdx = (S.activeTeamIdx + 1) % S.numTeams;
  }
}

function setActiveTeam(idx){
  S.activeTeamIdx = idx;
  playSfx('click');
  render();
}

function adjustScore(idx, delta){
  S.teams[idx].score = Math.max(0, S.teams[idx].score + delta);
  if(delta > 0) playSfx('correct');
  else playSfx('click');
  const scEl = document.getElementById('team-sc-' + idx);
  if(scEl) scEl.textContent = S.teams[idx].score;
}

function awardActiveTeam(pts){
  adjustScore(S.activeTeamIdx, pts);
}

function attachTeamScoreHandlers(){
  // Handlers attached inline or dynamically
}

function attachGameSpecificHandlers(card){
  // Next Card generic
  const nextBtn = document.getElementById('next-card-btn');
  if(nextBtn) nextBtn.onclick = nextCard;

  // 1. Flashcard
  const fcBox = document.getElementById('fc-box');
  const flipBtn = document.getElementById('fc-flip-btn');
  const knowBtn = document.getElementById('fc-know-btn');
  const repeatBtn = document.getElementById('fc-repeat-btn');

  function doFlip(){
    S.stepState = S.stepState === 0 ? 1 : 0;
    playSfx('click');
    const inner = fcBox ? fcBox.querySelector('.flashcard-inner') : null;
    if(inner) inner.classList.toggle('flipped');
  }

  if(fcBox) fcBox.onclick = doFlip;
  if(flipBtn) flipBtn.onclick = doFlip;

  if(knowBtn){
    knowBtn.onclick = () => {
      awardActiveTeam(1);
      S.soloStats.correct++;
      S.soloStats.total++;
      S.soloStats.streak++;
      if(S.soloStats.streak > S.soloStats.bestStreak) S.soloStats.bestStreak = S.soloStats.streak;
      playSfx('correct');
      nextCard();
    };
  }

  if(repeatBtn){
    repeatBtn.onclick = () => {
      S.soloStats.total++;
      S.soloStats.streak = 0;
      playSfx('click');
      // Append card to end of deck
      S.deck.push(card);
      nextCard();
    };
  }

  // 2 & 4. Multiple Choice options
  document.querySelectorAll('.mc-opt').forEach(optBtn => {
    optBtn.onclick = () => {
      if(S.stepState === 1) return;
      const chosen = optBtn.dataset.opt;
      S.userAnswer = chosen;
      S.stepState = 1;
      const isCorrect = chosen === card.correctAnswer;
      if(isCorrect){
        playSfx('correct');
        awardActiveTeam(1);
        S.soloStats.correct++;
        S.soloStats.total++;
        S.soloStats.streak++;
        if(S.soloStats.streak > S.soloStats.bestStreak) S.soloStats.bestStreak = S.soloStats.streak;
      } else {
        playSfx('wrong');
        S.soloStats.total++;
        S.soloStats.streak = 0;
      }
      render();
    };
  });

  // 3. Fact or Fake
  const ffTrue = document.getElementById('ff-true-btn');
  const ffFalse = document.getElementById('ff-false-btn');
  const ffRev = document.getElementById('ff-reveal-btn');
  if(ffTrue){
    ffTrue.onclick = () => {
      S.stepState = 1;
      if(card.truth === true){
        playSfx('correct');
        awardActiveTeam(1);
      } else {
        playSfx('wrong');
      }
      render();
    };
  }
  if(ffFalse){
    ffFalse.onclick = () => {
      S.stepState = 1;
      if(card.truth === false){
        playSfx('correct');
        awardActiveTeam(1);
      } else {
        playSfx('wrong');
      }
      render();
    };
  }
  if(ffRev){
    ffRev.onclick = () => {
      S.stepState = 1;
      playSfx('click');
      render();
    };
  }

  // 5. Speller
  const spInp = document.getElementById('speller-inp');
  const chkSpeller = document.getElementById('check-speller-btn');
  const hintSpeller = document.getElementById('hint-speller-btn');
  const revSpeller = document.getElementById('reveal-speller-btn');

  if(spInp && S.stepState === 0){
    spInp.oninput = (e) => {
      S.userAnswer = e.target.value;
    };
    spInp.onkeydown = (e) => {
      if(e.key === 'Enter') doCheckSpeller();
    };
  }

  function doCheckSpeller(){
    const input = (spInp ? spInp.value : S.userAnswer).trim().toLowerCase();
    const target = card.cloze_blank.trim().toLowerCase();
    // allow matching without 'to '
    const targetClean = target.replace(/^to\s+/, '');
    const inputClean = input.replace(/^to\s+/, '');

    const isMatch = input === target || inputClean === targetClean;
    S.stepState = 1;
    S.feedback = { correct: isMatch };
    if(isMatch){
      playSfx('correct');
      awardActiveTeam(1);
      S.soloStats.correct++;
      S.soloStats.total++;
      S.soloStats.streak++;
      if(S.soloStats.streak > S.soloStats.bestStreak) S.soloStats.bestStreak = S.soloStats.streak;
    } else {
      playSfx('wrong');
      S.soloStats.total++;
      S.soloStats.streak = 0;
    }
    render();
  }

  if(chkSpeller) chkSpeller.onclick = doCheckSpeller;
  if(hintSpeller){
    hintSpeller.onclick = () => {
      if(spInp){
        spInp.value = card.cloze_blank.slice(0, 1);
        S.userAnswer = spInp.value;
        spInp.focus();
      }
    };
  }
  if(revSpeller){
    revSpeller.onclick = () => {
      S.stepState = 1;
      S.feedback = { correct: false };
      playSfx('click');
      render();
    };
  }

  // 6. Forge
  const forgeRev = document.getElementById('forge-reveal-btn');
  if(forgeRev){
    forgeRev.onclick = () => {
      S.stepState = 1;
      playSfx('click');
      render();
    };
  }

  // 7. Taboo
  const tabCorrect = document.getElementById('taboo-correct-btn');
  const tabBroken = document.getElementById('taboo-broken-btn');
  const tabPass = document.getElementById('taboo-pass-btn');

  if(tabCorrect){
    tabCorrect.onclick = () => {
      playSfx('correct');
      awardActiveTeam(1);
      nextCard();
    };
  }
  if(tabBroken){
    tabBroken.onclick = () => {
      playSfx('buzzer');
      awardActiveTeam(-1);
    };
  }
  if(tabPass){
    tabPass.onclick = () => {
      playSfx('click');
      nextCard();
    };
  }

  // 8. Debate
  const argText = document.getElementById('arg-text');
  const showModel = document.getElementById('show-model-btn');
  if(argText){
    argText.oninput = (e) => {
      S.userAnswer = e.target.value;
      // live update collocation highlights
      document.querySelectorAll('.colloc-tag').forEach(tag => {
        const txt = tag.textContent.replace('✓ ', '').trim();
        if(S.userAnswer.toLowerCase().includes(txt.toLowerCase())){
          tag.classList.add('included');
        } else {
          tag.classList.remove('included');
        }
      });
    };
  }
  if(showModel){
    showModel.onclick = () => {
      S.stepState = S.stepState === 0 ? 1 : 0;
      playSfx('click');
      render();
    };
  }
}

// Letter tile helpers
function appendLetter(char){
  const inp = document.getElementById('speller-inp');
  if(inp){
    inp.value += char;
    S.userAnswer = inp.value;
    inp.focus();
  }
}
function backspaceLetter(){
  const inp = document.getElementById('speller-inp');
  if(inp){
    inp.value = inp.value.slice(0, -1);
    S.userAnswer = inp.value;
    inp.focus();
  }
}

function highlightWord(sentence, word){
  if(!sentence || !word) return sentence || "";
  const clean = word.replace(/[\[\]]/g, '').trim();
  const re = new RegExp('(' + escapeRegex(clean) + ')', 'gi');
  return sentence.replace(re, '<mark style="background:var(--solar-light); color:var(--ink); padding:2px 4px; border-radius:3px;">$1</mark>');
}

function escapeRegex(s){
  return s.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
}

function escapeQuotes(str){
  return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function toggleTheme(){
  S.theme = S.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', S.theme);
  playSfx('click');
  render();
}

function toggleSound(){
  S.sound = !S.sound;
  render();
}

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  if(e.code === 'Space' && S.currentGame === 'flashcard' && e.target.tagName !== 'INPUT'){
    e.preventDefault();
    const fcBox = document.getElementById('fc-box');
    if(fcBox) fcBox.click();
  }
});

// Initial boot
document.documentElement.setAttribute('data-theme', S.theme);
render();
</script>
